<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: media-screenshot (a still screenshot in a browser window). ===
           Frames a portal/app screenshot in a neutral window chrome, with a slow Ken Burns push
           and an optional accent callout box over a region. The <img> is NOT timed media — it is a
           static image the scene timeline animates via an UNTIMED wrapper. Ships a placeholder, so
           it previews with no asset; the builder sets CONFIG.src to the project-local screenshot. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        /* ==== END _foundation.css ==== */

        /* ---- media window chrome (shared look with media-screen-recording) ---- */
        .mf-stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2cqw;
          padding: 5cqw;
        }
        .mf-window {
          width: 76cqw;
          border-radius: var(--radius);
          background: var(--paper);
          border: 1.5px solid var(--border);
          box-shadow: 0 18px 60px rgba(9, 31, 46, 0.18);
          overflow: hidden;
          transform-origin: center center;
        }
        .mf-bar {
          display: flex;
          align-items: center;
          gap: 1cqw;
          height: 3.4cqw;
          padding: 0 1.6cqw;
          background: var(--paper);
          border-bottom: 1px solid var(--border-soft);
        }
        .mf-dots {
          display: flex;
          gap: 0.7cqw;
        }
        .mf-dot {
          width: 1cqw;
          height: 1cqw;
          border-radius: 50%;
          background: var(--border);
        }
        .mf-url {
          flex: 1;
          margin-left: 0.8cqw;
          height: 2.1cqw;
          display: flex;
          align-items: center;
          gap: 0.6cqw;
          padding: 0 1.2cqw;
          border-radius: var(--radius-pill);
          background: var(--border-soft);
          font-size: var(--fs-micro);
          color: var(--ink-soft);
          overflow: hidden;
          white-space: nowrap;
        }
        .mf-lock {
          width: 1.1cqw;
          height: 1.1cqw;
          flex: none;
        }
        .mf-screen {
          position: relative;
          aspect-ratio: 16 / 9;
          overflow: hidden;
          background: #f2eef4;
        }
        /* placeholder (shows until/unless a real screenshot loads over it) */
        .mf-placeholder {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1.4cqw;
          background:
            repeating-linear-gradient(45deg, rgba(9, 31, 46, 0.035) 0 12px, transparent 12px 24px),
            var(--paper);
          color: var(--ink-soft);
        }
        .mf-placeholder svg {
          width: 8cqw;
          height: 8cqw;
          opacity: 0.5;
        }
        .mf-zoom {
          position: absolute;
          inset: 0;
          transform-origin: 50% 42%;
        }
        .mf-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }
        /* accent callout drawn over a region (a graphic — never text colour) */
        .mf-callout {
          position: absolute;
          border: 0.35cqw solid var(--accent-2);
          border-radius: var(--radius-sm);
          box-shadow: 0 0 0 100vmax rgba(9, 31, 46, 0.06);
        }
        .mf-caption {
          max-width: 76cqw;
          text-align: center;
        }
      </style>

      <div id="root" data-composition-id="media-screenshot" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div class="mf-stage">
          <div id="mf-window" class="mf-window">
            <div class="mf-bar">
              <div class="mf-dots"><span class="mf-dot"></span><span class="mf-dot"></span><span class="mf-dot"></span></div>
              <div class="mf-url">
                <svg class="mf-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" />
                </svg>
                <span id="mf-urltext">portal.azure.com</span>
              </div>
            </div>
            <div class="mf-screen">
              <div id="mf-placeholder" class="mf-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <rect x="2.5" y="4" width="19" height="13" rx="2" /><path d="M8 20h8M12 17v3" />
                </svg>
                <span class="ilt-kicker">Screenshot</span>
              </div>
              <div id="mf-zoom" class="mf-zoom"><img id="mf-img" class="mf-img" alt="" /></div>
              <div id="mf-callout" class="mf-callout"></div>
            </div>
          </div>
          <div id="mf-caption" class="mf-caption ilt-caption"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Edit per use. The builder copies the screenshot into <project>/assets/media/ and sets `src`.
          var CONFIG = {
            src: "", // e.g. "assets/media/intune-enrollment.png" — empty shows the placeholder
            url: "portal.azure.com", // the address-bar label
            caption: "The device enrollment blade in the Intune admin center.",
            // optional accent callout over a region, as % of the screen; null to hide
            callout: { x: 8, y: 20, w: 46, h: 30 },
          };

          var img = document.getElementById("mf-img");
          var placeholder = document.getElementById("mf-placeholder");
          var callout = document.getElementById("mf-callout");
          document.getElementById("mf-urltext").textContent = CONFIG.url;
          document.getElementById("mf-caption").textContent = CONFIG.caption;

          if (CONFIG.src) {
            img.src = CONFIG.src;
            img.addEventListener("load", function () {
              placeholder.style.display = "none";
            });
          } else {
            img.style.display = "none";
          }

          if (CONFIG.callout) {
            callout.style.left = CONFIG.callout.x + "%";
            callout.style.top = CONFIG.callout.y + "%";
            callout.style.width = CONFIG.callout.w + "%";
            callout.style.height = CONFIG.callout.h + "%";
          } else {
            callout.style.display = "none";
          }

          var win = document.getElementById("mf-window");
          var zoom = document.getElementById("mf-zoom");
          var caption = document.getElementById("mf-caption");

          var tl = gsap.timeline({ paused: true });

          // Window arrives; a slow Ken Burns push sells "look here"; callout + caption land last.
          gsap.set(win, { opacity: 0, scale: 0.94, y: 24 });
          tl.to(win, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          // Ken Burns on the UNTIMED wrapper, never on timed media. Slow, generous duration.
          tl.fromTo(zoom, { scale: 1 }, { scale: 1.06, duration: 8, ease: "none" }, 0.9);
          if (CONFIG.callout) {
            gsap.set(callout, { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" });
            tl.to(callout, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.5);
          }
          gsap.set(caption, { opacity: 0, y: 16 });
          tl.to(caption, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.7);

          window.__timelines["media-screenshot"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
