<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: stat-spotlight (the one dramatic single-stat "wow" beat). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Runs on the DRAMATIC EXCEPTION ground (dark-field): ink auto-inverts to WHITE.
           Never hardcode white — text reads var(--ink)/var(--ink-soft); accents colour graphics. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        .ilt-display {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-display);
          line-height: 0.95;
          letter-spacing: -0.03em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        .ilt-rule {
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        /* dramatic exception — centre it, let it breathe (lots of negative space). */
        #mk-ss-stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2.4cqw;
          text-align: center;
        }
        /* number-wrap holds the count-up numeral above its soft accent glow. */
        #mk-ss-numwrap {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        /* GRAPHIC: soft accent glow behind the figure — token colour only. */
        #mk-ss-glow {
          position: absolute;
          left: 50%;
          top: 52%;
          width: 48cqw;
          height: 28cqw;
          transform: translate(-50%, -50%);
          border-radius: 50%;
          background: radial-gradient(closest-side, var(--accent), transparent 76%);
          filter: blur(34px);
          z-index: 0;
        }
        #mk-ss-num {
          position: relative;
          z-index: 1;
        }
        /* GRAPHIC: accent underline that wipes in as the count lands. */
        #mk-ss-underline {
          width: 15cqw;
          transform-origin: center center;
        }
        #mk-ss-label {
          max-width: 62cqw;
        }
        #mk-ss-caption {
          max-width: 52cqw;
        }
      </style>

      <div
        id="root"
        data-composition-id="stat-spotlight"
        data-ground="dark-field"
        data-width="1920"
        data-height="1080"
      >
        <!-- dark-field is the dramatic exception: ink auto-inverts to white. Never hardcode white. -->
        <div id="mk-ss-stage">
          <div id="mk-ss-numwrap">
            <div id="mk-ss-glow"></div>
            <div id="mk-ss-num" class="ilt-display">0</div>
          </div>
          <div id="mk-ss-underline" class="ilt-rule"></div>
          <div id="mk-ss-label" class="ilt-headline"></div>
          <div id="mk-ss-caption" class="ilt-caption"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Edit per use. One huge count-up figure + a short label + one supporting caption line.
          var CONFIG = {
            value: 12500,
            prefix: "",
            suffix: "",
            label: "Endpoints onboarded",
            caption: "In the first quarter after switching to zero-touch enrollment.",
          };

          var num = document.getElementById("mk-ss-num");
          var glow = document.getElementById("mk-ss-glow");
          var underline = document.getElementById("mk-ss-underline");
          var numwrap = document.getElementById("mk-ss-numwrap");
          document.getElementById("mk-ss-label").textContent = CONFIG.label;
          document.getElementById("mk-ss-caption").textContent = CONFIG.caption;

          // Deterministic thousands grouping (no locale dependency) for a big "wow" figure.
          function fmt(n) {
            return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          }
          num.textContent = CONFIG.prefix + fmt(0) + CONFIG.suffix;

          var tl = gsap.timeline({ paused: true });

          // Stillness, then the figure rises and COUNTS UP; glow + underline land as it settles.
          tl.fromTo(
            numwrap,
            { opacity: 0, scale: 0.9, y: 24 },
            { opacity: 1, scale: 1, y: 0, duration: 0.85, ease: "power3.out" },
            0.35,
          );

          var st = { v: 0 };
          tl.fromTo(
            st,
            { v: 0 },
            {
              v: CONFIG.value,
              duration: 1.75,
              ease: "power2.out",
              onUpdate: function () {
                num.textContent = CONFIG.prefix + fmt(st.v) + CONFIG.suffix;
              },
            },
            0.55,
          );

          // Soft accent glow pulses up behind the figure as the count lands (graphic).
          tl.fromTo(
            glow,
            { opacity: 0, scale: 0.7 },
            { opacity: 0.55, scale: 1, duration: 0.9, ease: "power2.out" },
            1.55,
          );

          // Accent underline wipes in from centre as the figure settles (graphic).
          tl.fromTo(
            underline,
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
            2.0,
          );

          tl.fromTo(
            "#mk-ss-label",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            2.15,
          );
          tl.fromTo(
            "#mk-ss-caption",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            2.35,
          );

          window.__timelines["stat-spotlight"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
