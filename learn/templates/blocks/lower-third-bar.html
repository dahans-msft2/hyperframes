<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: lt-clean-bar (lower-third: accent tab + name + role). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink.
           Markup + the clip-path wipe-in motion are unchanged; only styling reads tokens now. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        .ilt-panel {
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-tab {
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #root .lt {
          position: absolute;
          left: 120px;
          bottom: 110px;
          display: flex;
          align-items: stretch;
          overflow: hidden; /* clips the wipe + rounds the tab's left corners */
          will-change: clip-path;
        }
        #root .lt-tab {
          width: 0.6cqw; /* wider than the --rule default for a lower-third tab */
          border-radius: 0;
          flex-shrink: 0;
        }
        #root .lt-body {
          padding: 1.2cqw 2.1cqw 1.3cqw 1.6cqw;
          display: flex;
          flex-direction: column;
          gap: 0.35cqw;
        }
        #lt-name,
        #lt-role {
          white-space: nowrap;
        }
      </style>

      <div id="root" data-composition-id="lower-third-bar" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="lt" class="lt ilt-panel">
          <div id="lt-tab" class="lt-tab ilt-tab"></div>
          <div class="lt-body">
            <div id="lt-name" class="ilt-headline">Dr. Maya Chen</div>
            <div id="lt-role" class="ilt-caption">Host · Neuroscientist</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          var card = document.getElementById("lt");
          var tab = document.getElementById("lt-tab");
          var nameEl = document.getElementById("lt-name");
          var role = document.getElementById("lt-role");

          // Card wipes in from the left (clip-path), accent tab grows, text rises with a small stagger.
          gsap.set(card, { clipPath: "inset(0 100% 0 0)" });
          gsap.set(tab, { scaleY: 0, transformOrigin: "50% 0%" });
          gsap.set(nameEl, { y: 22, opacity: 0 });
          gsap.set(role, { y: 22, opacity: 0 });

          tl.to(card, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.1);
          tl.to(tab, { scaleY: 1, duration: 0.45, ease: "power2.out" }, 0.28);
          tl.to(nameEl, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.34);
          tl.to(role, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.44);

          window.__timelines["lower-third-bar"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
