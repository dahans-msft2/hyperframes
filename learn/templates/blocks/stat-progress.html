<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: progress-stat (count-up numeral + accent track). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        .ilt-display {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-display);
          line-height: 0.95;
          letter-spacing: -0.03em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-ps-group {
          position: absolute;
        }
        #mk-ps-label {
          margin-top: 0.5cqw;
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        #mk-ps-track {
          position: relative;
          margin-top: 1.6cqw;
          height: 0.55cqw;
          border-radius: var(--radius-pill);
          background: var(--border-soft);
          overflow: hidden;
        }
        #mk-ps-fill {
          position: absolute;
          inset: 0;
          border-radius: var(--radius-pill);
          background: var(--accent); /* accent = graphic, not text */
          transform-origin: left center;
        }
        #mk-ps-caption {
          margin-top: 1.4cqw;
        }
      </style>

      <div id="root" data-composition-id="stat-progress" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="mk-ps-group">
          <div id="mk-ps-num" class="ilt-display">0</div>
          <div id="mk-ps-label"></div>
          <div id="mk-ps-track"><div id="mk-ps-fill"></div></div>
          <div id="mk-ps-caption" class="ilt-caption"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Edit per use. A big count-up numeral + label + accent track filling to value/max + caption.
          var CONFIG = {
            value: 22,
            suffix: "",
            label: "Goals reached",
            caption: "Great job — we're getting closer.",
            max: 30,
            trackWidth: 560,
            x: 1180,
            y: 320,
          };

          var num = document.getElementById("mk-ps-num");
          var fill = document.getElementById("mk-ps-fill");
          var group = document.getElementById("mk-ps-group");
          document.getElementById("mk-ps-label").textContent = CONFIG.label;
          document.getElementById("mk-ps-caption").textContent = CONFIG.caption;
          document.getElementById("mk-ps-track").style.width = CONFIG.trackWidth + "px";
          group.style.left = CONFIG.x + "px";
          group.style.top = CONFIG.y + "px";

          var tl = gsap.timeline({ paused: true });

          // Scene-relative, seek-safe: group rises in, numeral counts up while the track fills.
          gsap.set(group, { opacity: 0, y: 30 });
          tl.to(group, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);

          var st = { v: 0 };
          tl.to(
            st,
            {
              v: CONFIG.value,
              duration: 1.6,
              ease: "power2.out",
              onUpdate: function () {
                num.textContent = Math.round(st.v) + CONFIG.suffix;
              },
            },
            0.5,
          );
          gsap.set(fill, { scaleX: 0 });
          tl.to(fill, { scaleX: CONFIG.value / CONFIG.max, duration: 1.6, ease: "power2.out" }, 0.5);

          window.__timelines["stat-progress"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
