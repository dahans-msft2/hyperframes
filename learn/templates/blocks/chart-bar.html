<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: data-chart (animated bar + conversion-line chart). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink.
           SVG bar+line geometry + GSAP draw-on timeline kept exactly as-is. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        .ilt-axis {
          stroke: var(--border-soft);
          stroke-width: 2;
          fill: none;
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #root {
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .chart-container {
          width: 1600px;
          height: 900px;
          display: flex;
          flex-direction: column;
          position: relative;
          transform: scale(1.15);
          transform-origin: center center;
        }

        .header {
          margin-bottom: 40px;
          text-align: left;
        }

        .headline {
          margin: 0;
          padding: 0;
          clip-path: inset(0 100% 0 0);
          white-space: nowrap;
        }

        .subtitle {
          margin: 8px 0 16px 0;
          clip-path: inset(0 100% 0 0);
          white-space: nowrap;
        }

        .key {
          display: flex;
          gap: 32px;
          opacity: 0;
        }

        .key-item {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .key-box {
          width: 22px;
          height: 22px;
          background-color: var(--ink);
        }

        .key-line {
          width: 34px;
          height: 4px;
          background-color: var(--accent-2);
        }

        .key-text {
          font-size: var(--fs-micro);
          color: var(--ink-soft);
        }

        .chart-svg {
          width: 100%;
          height: 600px;
          overflow: visible;
        }

        .source {
          position: absolute;
          bottom: 0;
          left: 0;
          font-size: var(--fs-micro);
          color: var(--ink-soft);
          opacity: 0;
        }

        .grid-line {
          stroke: var(--border-soft);
          stroke-width: 0.5px;
          opacity: 0;
        }

        .axis-label {
          font-size: var(--fs-caption);
          fill: var(--ink-soft);
          text-anchor: middle;
        }

        .bar {
          fill: var(--ink);
        }

        .bar-label {
          font-size: var(--fs-caption);
          fill: var(--ink);
          text-anchor: middle;
          opacity: 0;
        }

        .line-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-size: var(--fs-caption);
          fill: var(--ink);
          font-weight: 600;
          text-anchor: middle;
          opacity: 0;
        }

        .conversion-path {
          stroke: var(--accent-2);
        }

        .line-dot {
          fill: var(--accent-2);
        }
      </style>

      <div id="root" data-composition-id="chart-bar" data-width="1920" data-height="1080">
        <div class="chart-container">
          <!-- Header Section -->
          <div class="header">
            <h1 class="headline ilt-headline">Monthly Revenue vs. Conversion Rate</h1>
            <p class="subtitle ilt-caption">Jan–Jun 2024, in thousands</p>
            <div class="key">
              <div class="key-item">
                <div class="key-box revenue-box"></div>
                <span class="key-text">Revenue</span>
              </div>
              <div class="key-item">
                <div class="key-line conversion-line"></div>
                <span class="key-text">Conversion Rate</span>
              </div>
            </div>
          </div>

          <!-- SVG Chart Area -->
          <svg class="chart-svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet">
            <!-- Gridlines Group -->
            <g class="gridlines"></g>

            <!-- X-Axis Labels -->
            <g class="x-axis-labels"></g>

            <!-- Bars Group (Revenue) -->
            <g class="bars-group"></g>

            <!-- Bar Labels Group -->
            <g class="bar-labels-group"></g>

            <!-- Line Group (Conversion Rate) -->
            <g class="line-group">
              <path class="conversion-path" fill="none" stroke-width="4" />
              <circle class="line-dot" r="7" style="opacity: 0" />
            </g>

            <!-- Line Labels Group -->
            <g class="line-labels-group"></g>

            <!-- Baseline -->
            <line class="ilt-axis" x1="100" y1="600" x2="1500" y2="600" />
          </svg>

          <!-- Source Line -->
          <div class="source">Source: Internal analytics</div>
        </div>
      </div>

      <script>
        (function () {
          const svg = document.querySelector('[data-composition-id="chart-bar"] .chart-svg');
          const tl = gsap.timeline({ paused: true });

          // Data
          const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];
          const revenueData = [8, 12, 15, 11, 18, 22];
          const conversionData = [2.1, 2.8, 3.2, 2.9, 3.8, 4.2];

          // Chart Dimensions
          const chartWidth = 1400;
          const chartHeight = 500;
          const startX = 100;
          const startY = 600;
          const barWidth = 80;
          const spacing = (chartWidth - barWidth * months.length) / (months.length + 1);

          // Scales
          const maxRevenue = 25;
          const maxConversion = 5;

          const getBarY = (val) => startY - (val / maxRevenue) * chartHeight;
          const getLineY = (val) => startY - (val / maxConversion) * chartHeight;
          const getX = (i) => startX + spacing + i * (barWidth + spacing) + barWidth / 2;

          // Setup Elements
          const gridGroup = svg.querySelector(".gridlines");
          const xAxisGroup = svg.querySelector(".x-axis-labels");
          const barsGroup = svg.querySelector(".bars-group");
          const barLabelsGroup = svg.querySelector(".bar-labels-group");
          const lineLabelsGroup = svg.querySelector(".line-labels-group");
          const conversionPath = svg.querySelector(".conversion-path");
          const lineDot = svg.querySelector(".line-dot");

          // Create Gridlines
          for (let i = 1; i <= 5; i++) {
            const y = startY - i * (chartHeight / 5);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", startX);
            line.setAttribute("y1", y);
            line.setAttribute("x2", startX + chartWidth);
            line.setAttribute("y2", y);
            line.setAttribute("class", "grid-line");
            gridGroup.appendChild(line);
          }

          // Create X-Axis Labels & Bars & Bar Labels
          const linePoints = [];
          months.forEach((month, i) => {
            const x = getX(i);

            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", x);
            label.setAttribute("y", startY + 30);
            label.setAttribute("class", "axis-label");
            label.textContent = month;
            xAxisGroup.appendChild(label);

            const barHeight = (revenueData[i] / maxRevenue) * chartHeight;
            const bar = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            bar.setAttribute("x", x - barWidth / 2);
            bar.setAttribute("y", startY);
            bar.setAttribute("width", barWidth);
            bar.setAttribute("height", 0);
            bar.setAttribute("class", "bar");
            barsGroup.appendChild(bar);

            const barLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            barLabel.setAttribute("x", x);
            barLabel.setAttribute("y", getBarY(revenueData[i]) - 10);
            barLabel.setAttribute("class", "bar-label");
            barLabel.textContent = `$${revenueData[i]}K`;
            barLabelsGroup.appendChild(barLabel);

            linePoints.push(`${x},${getLineY(conversionData[i])}`);

            const lineLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            lineLabel.setAttribute("x", x);
            lineLabel.setAttribute("y", getLineY(conversionData[i]) - 15);
            lineLabel.setAttribute("class", "line-label");
            lineLabel.textContent = `${conversionData[i]}%`;
            lineLabelsGroup.appendChild(lineLabel);
          });

          // Set Path Data
          conversionPath.setAttribute("d", `M ${linePoints.join(" L ")}`);
          const pathLength = conversionPath.getTotalLength();
          conversionPath.style.strokeDasharray = pathLength;
          conversionPath.style.strokeDashoffset = pathLength;

          // --- ANIMATION TIMELINE ---

          tl.to(
            '[data-composition-id="chart-bar"] .headline',
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 1.2,
              ease: "power1.inOut",
            },
            0,
          );

          tl.to(
            '[data-composition-id="chart-bar"] .subtitle',
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 1.2,
              ease: "power1.inOut",
            },
            0.2,
          );

          tl.to(
            '[data-composition-id="chart-bar"] .key',
            {
              opacity: 1,
              duration: 0.4,
              ease: "power2.out",
            },
            1.0,
          );

          tl.to(
            '[data-composition-id="chart-bar"] .grid-line',
            {
              opacity: 1,
              duration: 0.5,
              stagger: 0.25,
              ease: "power2.out",
            },
            0.5,
          );

          // Bars
          const bars = barsGroup.querySelectorAll(".bar");
          const barLabels = barLabelsGroup.querySelectorAll(".bar-label");

          bars.forEach((bar, i) => {
            const barHeight = (revenueData[i] / maxRevenue) * chartHeight;
            const startTime = 1.5 + i * 0.5;

            tl.to(
              bar,
              {
                attr: { height: barHeight, y: startY - barHeight },
                duration: 0.8,
                ease: "power2.out",
              },
              startTime,
            );

            tl.to(
              barLabels[i],
              {
                opacity: 1,
                duration: 0.3,
                ease: "power2.out",
              },
              startTime + 0.8,
            );
          });

          // Line
          const lastBarStartTime = 1.5 + (months.length - 1) * 0.5;
          const lineStartTime = lastBarStartTime + 0.5;

          tl.to(
            conversionPath,
            {
              strokeDashoffset: 0,
              duration: 3,
              ease: "none",
            },
            lineStartTime,
          );

          // Line Dot & Labels
          tl.set(
            lineDot,
            {
              opacity: 1,
              attr: { cx: getX(0), cy: getLineY(conversionData[0]) },
            },
            lineStartTime,
          );

          const lineLabels = lineLabelsGroup.querySelectorAll(".line-label");
          months.forEach((_, i) => {
            if (i > 0) {
              const x = getX(i);
              const y = getLineY(conversionData[i]);
              tl.to(
                lineDot,
                {
                  attr: { cx: x, cy: y },
                  duration: 3 / (months.length - 1),
                  ease: "none",
                },
                lineStartTime + ((i - 1) / (months.length - 1)) * 3,
              );
            }

            const labelTime = lineStartTime + (i / (months.length - 1)) * 3 + 0.2;

            lineLabels[i].textContent = "0.0%";

            tl.to(
              lineLabels[i],
              {
                opacity: 1,
                duration: 0.1,
                ease: "power2.out",
              },
              labelTime,
            );

            const dummy = { val: 0 };
            tl.to(
              dummy,
              {
                val: conversionData[i],
                duration: 0.8,
                ease: "power2.out",
                onUpdate: () => {
                  lineLabels[i].textContent = dummy.val.toFixed(1) + "%";
                },
              },
              labelTime,
            );
          });

          // Source Line
          tl.to(
            '[data-composition-id="chart-bar"] .source',
            {
              opacity: 1,
              duration: 0.5,
              ease: "power2.out",
            },
            ">+0.5",
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["chart-bar"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
