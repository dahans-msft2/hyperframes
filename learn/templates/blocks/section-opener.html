<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: section-opener (segment divider — number + rule + title). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-display {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-display);
          line-height: 0.95;
          letter-spacing: -0.03em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-so-group {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          display: flex;
          align-items: center;
          gap: 3.6cqw;
        }
        #mk-so-num {
          flex: none;
        }
        #mk-so-divider {
          /* tall thin accent bar between number and title — a graphic, never text */
          flex: none;
          width: 0.5cqw;
          height: 13.5cqw;
          border-radius: var(--radius-pill);
          background: var(--accent);
          transform-origin: center center;
        }
        #mk-so-text {
          max-width: 46cqw;
        }
        #mk-so-desc {
          margin-top: 1.5cqw;
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.35;
          color: var(--ink-soft);
        }
      </style>

      <div id="root" data-composition-id="section-opener" data-ground="section-field" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="mk-so-group">
          <div id="mk-so-num" class="ilt-display">00</div>
          <div id="mk-so-divider"></div>
          <div id="mk-so-text">
            <div id="mk-so-title" class="ilt-title"></div>
            <div id="mk-so-desc"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Edit per use. A big section number, a vertical accent rule, a one-line title,
          // and an optional one-line description. Shown as a divider between video segments.
          var CONFIG = {
            number: "02",
            title: "Enroll and configure devices",
            description: "How managed devices reach a known-good baseline.",
          };

          var num = document.getElementById("mk-so-num");
          var divider = document.getElementById("mk-so-divider");
          var title = document.getElementById("mk-so-title");
          var desc = document.getElementById("mk-so-desc");

          num.textContent = CONFIG.number;
          title.textContent = CONFIG.title;
          desc.textContent = CONFIG.description || "";
          if (!CONFIG.description) desc.style.display = "none";

          var tl = gsap.timeline({ paused: true });

          // Scene-relative, seek-safe. Divider grows first, number scales in, then the
          // title slides out from the divider, description trailing — calm authority ~1.6s.
          tl.fromTo(divider, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.15);
          tl.fromTo(num, { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.4);
          tl.fromTo(title, { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.7);
          if (CONFIG.description) {
            tl.fromTo(desc, { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 0.95);
          }

          window.__timelines["section-opener"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
