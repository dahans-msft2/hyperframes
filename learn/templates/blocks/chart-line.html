<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: line-graph (dual-series trend, draw-on + point reveal). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink.
           Accents colour the LINES and DOTS only (graphics); all text stays ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: retheme mk-line-graph on foundation tokens only ---- */
        #mk-lg-svg {
          position: absolute;
          inset: 0;
        }
        .mk-lg-line {
          fill: none;
          stroke-width: 5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .mk-lg-dot {
          stroke-width: 4;
          fill: var(--paper); /* donut dot fill */
        }
        .mk-lg-axis {
          stroke: var(--border-soft);
          stroke-width: 2;
        }
        .mk-lg-value {
          position: absolute;
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-caption);
          letter-spacing: -0.01em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
          /* Horizontal centring only. The label's vertical offset is baked into
             `top` instead of a CSS translate, because the entrance tween animates
             `y` and GSAP rewrites this transform, dropping any vertical shift. */
          transform: translate(-50%, 0);
          line-height: 1.2;
          white-space: nowrap;
        }
        .mk-lg-xlabel {
          position: absolute;
          font-weight: 400;
          font-size: var(--fs-micro);
          color: var(--ink-soft);
          transform: translateX(-50%);
          white-space: nowrap;
        }
        .mk-lg-legend {
          position: absolute;
          display: flex;
          gap: 40px;
        }
        .mk-lg-legend-item {
          display: flex;
          align-items: center;
          gap: 12px;
          font-weight: 500;
          font-size: var(--fs-micro);
          color: var(--ink-soft);
        }
        .mk-lg-legend-dot {
          width: 16px;
          height: 16px;
          border-radius: 50%;
        }
      </style>

      <div id="root" data-composition-id="chart-line" data-width="1920" data-height="1080">
        <svg id="mk-lg-svg" viewBox="0 0 1920 1080"></svg>
        <div id="mk-lg-labels"></div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- published parameters (inspector-style CONFIG) ----
             A presentation line graph: 1–2 series draw on, dots pop, value labels ride
             their points, axis dimmer than labels. Re-skin via the foundation accents
             (--accent-2 primary, --accent second) + #root[data-ground] above. */
          var CONFIG = {
            // scheme-agnostic; lines/dots read foundation accents, data-ground picks the deck
            series: [
              { name: "Enrollments", color: null /* accent */, values: [12, 26, 22, 38, 44, 58] },
              { name: "Completions", color: null /* blob-2 */, values: [8, 14, 18, 16, 28, 36] },
            ],
            xLabels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
            showValues: true,
            // widened + centred plot rect (source rect left half the frame empty for footage)
            area: { x: 260, y: 300, w: 1400, h: 440 },
            animationIn: true,
          };

          var NS = "http://www.w3.org/2000/svg";
          var root = document.getElementById("root");
          var svg = document.getElementById("mk-lg-svg");
          var labels = document.getElementById("mk-lg-labels");
          var A = CONFIG.area;

          var accent = getComputedStyle(root).getPropertyValue("--accent-2").trim();
          var blob2 = getComputedStyle(root).getPropertyValue("--accent").trim();
          if (CONFIG.series[1] && !CONFIG.series[1].color) CONFIG.series[1].color = blob2;

          /* scale: 0..max(all values)*1.15 into the plot rect */
          var max = 0;
          CONFIG.series.forEach(function (s) {
            s.values.forEach(function (v) {
              if (v > max) max = v;
            });
          });
          max *= 1.15;
          var n = CONFIG.series[0].values.length;
          function px(i) {
            return A.x + (i / (n - 1)) * A.w;
          }
          function py(v) {
            return A.y + A.h - (v / max) * A.h;
          }

          /* baseline axis */
          var axis = document.createElementNS(NS, "line");
          axis.setAttribute("class", "mk-lg-axis");
          axis.setAttribute("x1", A.x - 20);
          axis.setAttribute("y1", A.y + A.h);
          axis.setAttribute("x2", A.x + A.w + 20);
          axis.setAttribute("y2", A.y + A.h);
          axis.id = "mk-lg-axis";
          svg.appendChild(axis);

          /* series paths, dots, value labels */
          var paths = [],
            dots = [],
            vals = [];
          CONFIG.series.forEach(function (s, si) {
            var color = s.color || accent;
            var d = s.values
              .map(function (v, i) {
                return (i === 0 ? "M" : "L") + px(i) + " " + py(v);
              })
              .join(" ");
            var path = document.createElementNS(NS, "path");
            path.setAttribute("class", "mk-lg-line");
            path.setAttribute("d", d);
            path.setAttribute("stroke", color);
            path.id = "mk-lg-path-" + si;
            svg.appendChild(path);
            paths.push(path);

            s.values.forEach(function (v, i) {
              var dot = document.createElementNS(NS, "circle");
              dot.setAttribute("class", "mk-lg-dot");
              dot.setAttribute("cx", px(i));
              dot.setAttribute("cy", py(v));
              dot.setAttribute("r", 9);
              dot.setAttribute("stroke", color);
              dot.id = "mk-lg-dot-" + si + "-" + i;
              svg.appendChild(dot);
              dots.push({ el: dot, si: si, i: i });

              if (CONFIG.showValues) {
                var val = document.createElement("div");
                /* Series after the first label downward. With every series
                   labelling upward the numbers collide wherever the lines run
                   close together. GAP clears the dot radius plus line stroke. */
                var below = si > 0;
                var GAP = 22;
                val.className = "mk-lg-value";
                val.id = "mk-lg-val-" + si + "-" + i;
                val.textContent = v;
                val.style.left = px(i) + "px";
                val.style.top = py(v) + (below ? GAP : -(GAP + 38)) + "px";
                labels.appendChild(val);
                vals.push({ el: val, si: si, i: i });
              }
            });
          });

          /* x labels + legend */
          CONFIG.xLabels.slice(0, n).forEach(function (t, i) {
            var xl = document.createElement("div");
            xl.className = "mk-lg-xlabel";
            xl.id = "mk-lg-xl-" + i;
            xl.textContent = t;
            xl.style.left = px(i) + "px";
            xl.style.top = A.y + A.h + 24 + "px";
            labels.appendChild(xl);
          });
          var legend = document.createElement("div");
          legend.className = "mk-lg-legend";
          legend.id = "mk-lg-legend";
          legend.style.left = A.x + "px";
          legend.style.top = A.y + A.h + 90 + "px";
          CONFIG.series.forEach(function (s) {
            var item = document.createElement("div");
            item.className = "mk-lg-legend-item";
            var dot = document.createElement("span");
            dot.className = "mk-lg-legend-dot";
            dot.style.background = s.color || accent;
            item.appendChild(dot);
            item.appendChild(document.createTextNode(s.name));
            legend.appendChild(item);
          });
          labels.appendChild(legend);

          var tl = gsap.timeline({ paused: true });
          var DRAW = 1.3;

          /* entrance: axis + x labels settle first */
          gsap.set([axis, legend], { opacity: 0 });
          tl.to(axis, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
          CONFIG.xLabels.slice(0, n).forEach(function (t, i) {
            var xl = document.getElementById("mk-lg-xl-" + i);
            gsap.set(xl, { opacity: 0, y: 10 });
            tl.to(xl, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25 + i * 0.05);
          });

          /* draw each series, dots + values riding the draw front */
          CONFIG.series.forEach(function (s, si) {
            var t0 = (CONFIG.animationIn ? 0.5 : 0) + si * 0.35;
            var path = paths[si];
            var len = path.getTotalLength();
            gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
            tl.to(path, { strokeDashoffset: 0, duration: DRAW, ease: "power2.inOut" }, t0);

            s.values.forEach(function (v, i) {
              var dot = document.getElementById("mk-lg-dot-" + si + "-" + i);
              var td = t0 + (i / (n - 1)) * DRAW * 0.92;
              gsap.set(dot, { scale: 0, transformOrigin: "50% 50%" });
              tl.to(dot, { scale: 1, duration: 0.35, ease: "back.out(1.2)" }, td);
              if (CONFIG.showValues) {
                var val = document.getElementById("mk-lg-val-" + si + "-" + i);
                gsap.set(val, { opacity: 0, y: 8 });
                tl.to(val, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, td + 0.06);
              }
            });
          });

          tl.to(legend, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.3);

          /* No exit fade / hard kill: the host owns scene lifetime and holds the final
             frame. The graph settles into its complete state and stays there. */

          window.__timelines["chart-line"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
