<section class="clip beat beat-console" data-start="{{start}}" data-duration="{{duration}}" data-track-index="{{track}}">
  <header class="beat-head">
    <p class="beat-kicker">{{kicker}}</p>
    <h2 class="beat-title">{{title}}</h2>
  </header>

  <div class="console-grid">
    <aside class="console-rail panel">
      <p class="console-rail-label">{{rail_label}}</p>
      <p class="console-rail-sub">{{rail_sub}}</p>
    </aside>

    <section class="console-panel panel">
      <div class="console-row">
        <span class="console-key">{{key_one}}</span>
        <span class="console-value">{{value_one}}</span>
      </div>
      <div class="console-row">
        <span class="console-key">{{key_two}}</span>
        <span class="console-value">{{value_two}}</span>
      </div>
      <div class="console-row">
        <span class="console-key">{{key_three}}</span>
        <span class="console-value">{{value_three}}</span>
      </div>
    </section>
  </div>
</section>
