<section class="clip beat beat-catalog" data-start="{{start}}" data-duration="{{duration}}" data-track-index="{{track}}">
  <header class="beat-head">
    <p class="beat-kicker">{{kicker}}</p>
    <h2 class="beat-title">{{title}}</h2>
  </header>

  <div class="catalog-frame panel">
    <div class="catalog-meta">
      <span class="chip">{{scope}}</span>
      <span class="catalog-count">{{count}}</span>
    </div>

    <ul class="catalog-list" role="list">
      <li class="catalog-row is-active">{{row_one}}</li>
      <li class="catalog-row">{{row_two}}</li>
      <li class="catalog-row">{{row_three}}</li>
      <li class="catalog-row">{{row_four}}</li>
    </ul>
  </div>
</section>
