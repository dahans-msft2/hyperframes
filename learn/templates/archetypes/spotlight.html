<section class="clip beat beat-spotlight" data-start="{{start}}" data-duration="{{duration}}" data-track-index="{{track}}">
  <header class="beat-head">
    <p class="beat-kicker">{{kicker}}</p>
    <h2 class="beat-title">{{title}}</h2>
    <p class="beat-caption">{{caption}}</p>
  </header>

  <div class="spotlight-stage panel">
    <div class="spotlight-subject">{{subject}}</div>
    <p class="spotlight-pivot">{{pivot_line}}</p>
  </div>

  <div class="spotlight-tags">
    <span class="chip">{{tag_one}}</span>
    <span class="chip">{{tag_two}}</span>
  </div>
</section>
