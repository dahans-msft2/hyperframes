<section class="clip beat beat-timeline" data-start="{{start}}" data-duration="{{duration}}" data-track-index="{{track}}">
  <header class="beat-head">
    <p class="beat-kicker">{{kicker}}</p>
    <h2 class="beat-title">{{title}}</h2>
  </header>

  <div class="tl-frame panel">
    <div class="tl-lanes">
      <span class="tl-lane">{{lane_one}}</span>
      <span class="tl-lane">{{lane_two}}</span>
    </div>

    <div class="tl-track" aria-hidden="true">
      <div class="tl-bar is-active"></div>
      <div class="tl-marker tl-marker-a">{{event_one}}</div>
      <div class="tl-marker tl-marker-b">{{event_two}}</div>
      <div class="tl-marker tl-marker-c">{{event_three}}</div>
    </div>
  </div>
</section>
