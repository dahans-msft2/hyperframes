<section class="clip beat beat-layer-stack" data-start="{{start}}" data-duration="{{duration}}" data-track-index="{{track}}">
  <header class="beat-head">
    <p class="beat-kicker">{{kicker}}</p>
    <h2 class="beat-title">{{title}}</h2>
  </header>

  <div class="stack-wrap">
    <div class="stack-layer stack-layer-outer">{{outer_label}}</div>
    <div class="stack-layer stack-layer-mid">{{middle_label}}</div>
    <div class="stack-layer stack-layer-inner">{{inner_label}}</div>
    <div class="stack-core">{{core_label}}</div>
  </div>
</section>
