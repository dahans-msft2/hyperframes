      <style>
        /* === Learn-ILT scene: 07-nesting-reveal — custom on the foundation — the membership graph on dark-field; the badge halts === */
        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        /* =============================================================================
           Learn-ILT KIT FOUNDATION  —  single source of truth for every kit block.
           -----------------------------------------------------------------------------
           Every block in templates/blocks/ opens its <style> with a VERBATIM copy of
           this file (between the two BEGIN/END markers), then adds only block-specific
           rules that REFERENCE these tokens + primitives. That is what makes a chart, a
           spec list, a flowchart and a lower-third feel like one kit instead of seven
           islands: shared tokens, one type scale, one ground-swap, shared primitives.

           NAMING (every kit block file + its data-composition-id + its __timelines key
           share ONE name):  <category>-<variant>  — lowercase, hyphen-separated.
             category = the scene archetype (what kind of scene it is)
             variant  = the specific style within that archetype
           Current categories: stat- (single big number/count-up), chart- (multi-point
           data viz), list- (enumerated rows), diagram- (nodes + relationships),
           title- (title card), section- (segment divider), code- (code window),
           callout- (key-point card), media- (screenshot / screen recording in a window),
           lower-third- (name/role overlay). Reserved: quote-, compare-.
           e.g. stat-progress, stat-count, chart-bar, chart-line, list-specs,
           diagram-flow, media-screenshot, lower-third-bar.

           AUTHORING RULES (the "one consistent approach"):
             1. Never hardcode a brand colour, font, radius, or ground gradient in a
                block. Read a token. If you need a value that isn't here, add it here.
             2. Never size text in px. Use the --fs-* scale (cqw) so type scales with the
                mount container and can never regress below the --fs-micro floor (~24px).
             3. CONTRAST LAW: text is ALWAYS var(--ink) or var(--ink-soft). Accents
                (var(--accent*)) colour GRAPHICS only — bars, lines, fills, borders,
                chips, rules — never text.
             4. Ground is chosen by the host via  #root[data-ground="…"]  (default
                content-wash). Each ground layers the deck's real exported PNG
                (assets/grounds/ground-<name>.png, copied into the project like fonts)
                OVER a CSS-gradient fallback — if the PNG is absent (standalone preview),
                the gradient shows. dark-field is CSS-only (no PNG) and flips ink to white
                automatically — do not special-case it in a block.
             5. The host owns scene lifetime. A block never hides/fades its own #root on
                exit; register the paused timeline on window.__timelines[<id>] and stop.
           ============================================================================= */

        /* ---- reset ---------------------------------------------------------------- */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        /* ---- #root: tokens + container ------------------------------------------- */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size; /* 1cqw = 1% of width = 19.2px at 1920 */

          /* palette — content-wash (default ground). data-ground overrides below. */
          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e; /* all text */
          --ink-soft: #59636e; /* secondary text */
          --paper: #ffffff; /* panel / card fill */
          --paper-veil: rgba(255, 255, 255, 0.9); /* translucent panel on a busy ground */
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          /* accents — GRAPHICS ONLY, never text */
          --accent: #8661c5; /* purple  (primary)   */
          --accent-2: #0078d4; /* blue    (secondary) */
          --accent-3: #389a91; /* teal    (tertiary)  */
          --accent-4: #bf3ac4; /* magenta (quaternary)*/
          --accent-ink: #ffffff; /* text that sits ON an accent fill (chips/badges)   */

          /* type — cqw scale (never px in a block). ~value at 1920 wide in comments.  */
          --fs-display: 11cqw; /* ~211px  hero stat / count-up                        */
          --fs-h1: 4.6cqw; /* ~88px   title-card headline                         */
          --fs-h2: 3.4cqw; /* ~65px   scene title / subject                       */
          --fs-h3: 2.4cqw; /* ~46px   block headline                              */
          --fs-lead: 2cqw; /* ~38px   lead / large label                          */
          --fs-body: 1.75cqw; /* ~34px   body / row label                           */
          --fs-caption: 1.5cqw; /* ~29px   caption / value                            */
          --fs-kicker: 1.55cqw; /* ~30px   eyebrow / kicker                           */
          --fs-micro: 1.25cqw; /* ~24px   FLOOR — nothing smaller than this          */

          /* rhythm */
          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px; /* chart line / connector weight */
          --rule: 3px; /* accent underline weight       */

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }

        #root[data-ground="hero-swoosh"] {
          /* warm paper with a stronger purple sweep — css fallback of the PNG swoosh */
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          /* the deck's pale "background-gradient" export — cool blue wash */
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          /* the dramatic exception: near-black navy, WHITE ink. css-only (no PNG). */
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* ---- shared primitives ---------------------------------------------------- */
        /* Type roles — a block composes these instead of inventing a size each time.  */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-body {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.3;
          color: var(--ink);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        .ilt-value {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-caption);
          letter-spacing: -0.01em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        .ilt-display {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-display);
          line-height: 0.95;
          letter-spacing: -0.03em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }

        /* Surfaces */
        .ilt-panel {
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-panel--veil {
          background: var(--paper-veil);
        }
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }

        /* Accents-as-graphics */
        .ilt-rule {
          /* accent underline bar — a graphic, never text colour */
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        .ilt-tab {
          /* vertical accent tab (lower-thirds, callouts) */
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* SVG helpers: stroke:var(--accent) for lines, stroke:var(--border-soft) for axes */
        .ilt-axis {
          stroke: var(--border-soft);
          stroke-width: 2;
          fill: none;
        }
        /* ==== END _foundation.css ==== */

        /* ---- scene-specific: compose foundation primitives + tokens only ---- */
        #f-wrap {
          position: absolute;
          left: 180px;
          top: 70px;
          width: 1560px;
        }
        #f-ghost-wrap {
          position: relative;
          display: inline-block;
          margin-top: 0.9cqw;
        }
        #f-ghost {
          font-size: var(--fs-lead);
          color: var(--ink-soft);
        }
        #f-strike {
          position: absolute;
          left: -10px;
          top: 52%;
          width: calc(100% + 20px);
          height: 5px;
          border-radius: 5px;
          background: var(--accent-4); /* magenta strike = graphic */
          transform-origin: left center;
        }
        #f-stage {
          position: relative;
          width: 1560px;
          height: 720px;
          margin-top: 1.2cqw;
          transform-origin: center center;
        }
        #f-links {
          position: absolute;
          inset: 0;
        }
        #f-links path {
          fill: none;
          stroke-width: 5;
          stroke-linecap: round;
        }
        .f-node .ilt-headline {
          font-size: var(--fs-lead); /* node titles sit below the block headline tier */
        }
        .f-node {
          position: absolute;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 0.3cqw;
          padding: 24px 30px;
          border-radius: var(--radius);
          background: var(--paper);
          border: 1.5px solid var(--border);
          box-shadow: var(--shadow);
          transform-origin: center center;
        }
        #f-parent {
          left: 0;
          top: 258px;
          width: 420px;
          height: 180px;
        }
        #f-direct {
          left: 1000px;
          top: 70px;
          width: 420px;
          height: 170px;
        }
        #f-child {
          left: 470px;
          top: 490px;
          width: 440px;
          height: 190px;
        }
        #f-nested {
          left: 1000px;
          top: 505px;
          width: 420px;
          height: 160px;
        }
        #f-badge {
          position: absolute;
          left: 130px;
          top: 108px;
          width: 116px;
          height: 116px;
          border-radius: 20px;
          background: var(--accent);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: var(--shadow);
          transform-origin: center center;
        }
        #f-badge svg {
          width: 62px;
          height: 62px;
        }
        .f-mark {
          position: absolute;
          width: 84px;
          height: 84px;
          transform-origin: center center;
        }
        #f-mark-ok {
          left: 1450px;
          top: 113px;
        }
        #f-mark-no {
          left: 1450px;
          top: 543px;
        }
      </style>

      <div
        id="root"
        data-composition-id="07-nesting-reveal"
        data-ground="dark-field"
        data-width="1920"
        data-height="1080"
      >
        <div id="f-wrap">
          <div id="f-kicker" class="ilt-kicker">What actually happens</div>
          <span id="f-ghost-wrap">
            <span id="f-ghost" data-layout-allow-occlusion>Nesting works like folders &mdash; everything flows down</span>
            <span id="f-strike"></span>
          </span>

          <div id="f-stage" data-keep-in-frame>
            <svg id="f-links" viewBox="0 0 1560 720" preserveAspectRatio="none" aria-hidden="true">
              <path id="f-link-direct" d="M420 340 C 700 340 720 155 1000 155" stroke="#0078d4" pathLength="1" />
              <path id="f-link-child" d="M210 438 C 210 560 300 585 470 585" stroke="#0078d4" pathLength="1" />
              <path id="f-link-nested" d="M910 585 L 1000 585" stroke="#8b98a5" pathLength="1" />
            </svg>

            <div id="f-badge">
              <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                <rect x="7" y="16" width="34" height="24" rx="4" stroke="#ffffff" stroke-width="3" />
                <path d="M16 16v-4a8 8 0 0 1 16 0v4" stroke="#ffffff" stroke-width="3" />
              </svg>
            </div>

            <div id="f-parent" class="f-node">
              <div id="f-parent-t" class="ilt-headline">All Engineering</div>
              <div id="f-parent-c" class="ilt-caption">Licence assigned to this group</div>
            </div>

            <div id="f-direct" class="f-node">
              <div id="f-direct-t" class="ilt-headline">Direct members</div>
              <div id="f-direct-c" class="ilt-caption">Reached by the assignment</div>
            </div>

            <div id="f-child" class="f-node">
              <div id="f-child-t" class="ilt-headline">New Office (nested)</div>
              <div id="f-child-c" class="ilt-caption">A member of the parent</div>
            </div>

            <div id="f-nested" class="f-node">
              <div id="f-nested-t" class="ilt-headline">Its members</div>
              <div id="f-nested-c" class="ilt-caption">Two steps removed</div>
            </div>

            <svg id="f-mark-ok" class="f-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <circle cx="24" cy="24" r="21" stroke="#389a91" stroke-width="4" />
              <path d="M14 24.5 21 31.5 34 17.5" stroke="#389a91" stroke-width="5" stroke-linecap="round" />
            </svg>
            <svg
              id="f-mark-no"
              class="f-mark"
              data-reveal-after="#f-mark-ok"
              viewBox="0 0 48 48"
              fill="none"
              aria-hidden="true"
            >
              <circle cx="24" cy="24" r="21" stroke="#bf3ac4" stroke-width="4" />
              <path d="M16 16 32 32 M32 16 16 32" stroke="#bf3ac4" stroke-width="5" stroke-linecap="round" />
            </svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Audio is the clock. anchors.js is generated by tools/word_anchors.py from
          // transcript.json (lead-in 3.0s = the silent bumper) and is loaded by the host.
          // If it is missing every cue time below is unresolvable — fail loudly rather than
          // silently render a de-synced scene.
          if (!window.__anchors) {
            throw new Error("07-nesting-reveal: anchors.js not loaded - cue times unresolvable");
          }

          // S = this scene's cut on the composition clock (scenes.json).
          // W = every spoken-word anchor rebased onto THIS scene's clock, so a content cue
          //     reads W.<anchor_name> and never a hand-estimated offset.
          var S = 113.27;
          var W = {};
          Object.keys(window.__anchors).forEach(function (k) {
            W[k] = window.__anchors[k] - S;
          });

          // B = mechanical beat markers measured from the scene cut itself, never from speech:
          // the scene-open cadence and the slow camera settle (kit precedent: bumper's push).
          var B = { o1: 0.25, push: 0.9, hold: 19.9 };

          var tl = gsap.timeline({ paused: true });

          ["#f-link-direct", "#f-link-child", "#f-link-nested"].forEach((s) => tl.set(s, { strokeDasharray: 1, strokeDashoffset: 1 }, 0));
          ["#f-kicker", "#f-ghost", "#f-parent-t", "#f-parent-c", "#f-direct-t", "#f-direct-c", "#f-child-t", "#f-child-c", "#f-nested-t", "#f-nested-c"].forEach((s) => tl.set(s, { opacity: 0, y: 20 }, 0));
          ["#f-parent", "#f-direct", "#f-child", "#f-nested"].forEach((s) => tl.set(s, { opacity: 0, scale: 0.9 }, 0));
          ["#f-badge", "#f-mark-ok", "#f-mark-no"].forEach((s) => tl.set(s, { opacity: 0, scale: 0.4 }, 0));
          ["#f-strike"].forEach((s) => tl.set(s, { scaleX: 0 }, 0));

          tl.to("#f-kicker", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, B.o1);
          tl.to("#f-stage", { scale: 1.028, duration: B.hold, ease: "none" }, B.push);

          // "Most of us expect nesting to work like folders…" — the wrong prior is stated plainly.
          tl.to("#f-ghost", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, W.nest_folders);
          // "…where everything on the parent flows down"
          tl.to("#f-ghost", { x: 16, duration: 0.7, ease: "power2.out" }, W.nest_flows);
          // "Groups don't behave that way." — the strike sweeps the prior away.
          tl.to("#f-strike", { scaleX: 1, duration: 0.55, ease: "power2.in" }, W.nest_dont);
          tl.to("#f-ghost", { opacity: 0.45, duration: 0.6, ease: "power2.out" }, W.nest_dont);

          // "Nesting makes the child group a member of the parent" — the graph replaces the containment.
          tl.to("#f-parent", { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, W.nest_child_member);
          tl.to("#f-parent-t", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.nest_child_member);
          tl.to("#f-child", { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, W.nest_child_member);
          tl.to("#f-child-t", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.nest_child_member);
          tl.to("#f-child-c", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.nest_child_member);
          tl.to("#f-link-child", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, W.nest_child_member);

          // "…but a license or an assigned resource…" — the badge lands with weight on the parent.
          tl.to("#f-badge", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, W.nest_license);
          tl.to("#f-parent-c", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.nest_license);

          // "…only reaches the parent's direct members" — it travels, and the branch is checked.
          tl.to("#f-link-direct", { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, W.nest_direct);
          tl.to("#f-direct", { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, W.nest_direct);
          tl.to("#f-direct-t", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.nest_direct);
          tl.to("#f-direct-c", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.nest_direct);
          tl.to("#f-mark-ok", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, W.nest_direct);

          // "The people inside the nested group are two steps removed, so nothing reaches them."
          tl.to("#f-link-nested", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, W.nest_removed);
          tl.to("#f-nested", { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, W.nest_removed);
          tl.to("#f-nested-t", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.nest_removed);
          tl.to("#f-nested-c", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.nest_removed);
          tl.to("#f-mark-no", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, W.nest_removed);
          tl.to("#f-nested", { opacity: 0.55, duration: 1.2, ease: "power2.inOut" }, W.nest_removedEnd);

          window.__timelines["07-nesting-reveal"] = tl;
        })();
      </script>
    </template>
