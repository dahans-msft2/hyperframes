<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT scene: 05-membership — list-select — two membership models; the growing office selects dynamic === */
        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        /* =============================================================================
           Learn-ILT KIT FOUNDATION  —  single source of truth for every kit block.
           -----------------------------------------------------------------------------
           Every block in templates/blocks/ opens its <style> with a VERBATIM copy of
           this file (between the two BEGIN/END markers), then adds only block-specific
           rules that REFERENCE these tokens + primitives. That is what makes a chart, a
           spec list, a flowchart and a lower-third feel like one kit instead of seven
           islands: shared tokens, one type scale, one ground-swap, shared primitives.

           NAMING (every kit block file + its data-composition-id + its __timelines key
           share ONE name):  <category>-<variant>  — lowercase, hyphen-separated.
             category = the scene archetype (what kind of scene it is)
             variant  = the specific style within that archetype
           Current categories: stat- (single big number/count-up), chart- (multi-point
           data viz), list- (enumerated rows), diagram- (nodes + relationships),
           title- (title card), section- (segment divider), code- (code window),
           callout- (key-point card), media- (screenshot / screen recording in a window),
           lower-third- (name/role overlay). Reserved: quote-, compare-.
           e.g. stat-progress, stat-count, chart-bar, chart-line, list-specs,
           diagram-flow, media-screenshot, lower-third-bar.

           AUTHORING RULES (the "one consistent approach"):
             1. Never hardcode a brand colour, font, radius, or ground gradient in a
                block. Read a token. If you need a value that isn't here, add it here.
             2. Never size text in px. Use the --fs-* scale (cqw) so type scales with the
                mount container and can never regress below the --fs-micro floor (~24px).
             3. CONTRAST LAW: text is ALWAYS var(--ink) or var(--ink-soft). Accents
                (var(--accent*)) colour GRAPHICS only — bars, lines, fills, borders,
                chips, rules — never text.
             4. Ground is chosen by the host via  #root[data-ground="…"]  (default
                content-wash). Each ground layers the deck's real exported PNG
                (assets/grounds/ground-<name>.png, copied into the project like fonts)
                OVER a CSS-gradient fallback — if the PNG is absent (standalone preview),
                the gradient shows. dark-field is CSS-only (no PNG) and flips ink to white
                automatically — do not special-case it in a block.
             5. The host owns scene lifetime. A block never hides/fades its own #root on
                exit; register the paused timeline on window.__timelines[<id>] and stop.
           ============================================================================= */

        /* ---- reset ---------------------------------------------------------------- */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        /* ---- #root: tokens + container ------------------------------------------- */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size; /* 1cqw = 1% of width = 19.2px at 1920 */

          /* palette — content-wash (default ground). data-ground overrides below. */
          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e; /* all text */
          --ink-soft: #59636e; /* secondary text */
          --paper: #ffffff; /* panel / card fill */
          --paper-veil: rgba(255, 255, 255, 0.9); /* translucent panel on a busy ground */
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          /* accents — GRAPHICS ONLY, never text */
          --accent: #8661c5; /* purple  (primary)   */
          --accent-2: #0078d4; /* blue    (secondary) */
          --accent-3: #389a91; /* teal    (tertiary)  */
          --accent-4: #bf3ac4; /* magenta (quaternary)*/
          --accent-ink: #ffffff; /* text that sits ON an accent fill (chips/badges)   */

          /* type — cqw scale (never px in a block). ~value at 1920 wide in comments.  */
          --fs-display: 11cqw; /* ~211px  hero stat / count-up                        */
          --fs-h1: 4.6cqw; /* ~88px   title-card headline                         */
          --fs-h2: 3.4cqw; /* ~65px   scene title / subject                       */
          --fs-h3: 2.4cqw; /* ~46px   block headline                              */
          --fs-lead: 2cqw; /* ~38px   lead / large label                          */
          --fs-body: 1.75cqw; /* ~34px   body / row label                           */
          --fs-caption: 1.5cqw; /* ~29px   caption / value                            */
          --fs-kicker: 1.55cqw; /* ~30px   eyebrow / kicker                           */
          --fs-micro: 1.25cqw; /* ~24px   FLOOR — nothing smaller than this          */

          /* rhythm */
          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px; /* chart line / connector weight */
          --rule: 3px; /* accent underline weight       */

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }

        #root[data-ground="hero-swoosh"] {
          /* warm paper with a stronger purple sweep — css fallback of the PNG swoosh */
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          /* the deck's pale "background-gradient" export — cool blue wash */
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          /* the dramatic exception: near-black navy, WHITE ink. css-only (no PNG). */
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* ---- shared primitives ---------------------------------------------------- */
        /* Type roles — a block composes these instead of inventing a size each time.  */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-body {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.3;
          color: var(--ink);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        .ilt-value {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-caption);
          letter-spacing: -0.01em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        .ilt-display {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-display);
          line-height: 0.95;
          letter-spacing: -0.03em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }

        /* Surfaces */
        .ilt-panel {
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-panel--veil {
          background: var(--paper-veil);
        }
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }

        /* Accents-as-graphics */
        .ilt-rule {
          /* accent underline bar — a graphic, never text colour */
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        .ilt-tab {
          /* vertical accent tab (lower-thirds, callouts) */
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* SVG helpers: stroke:var(--accent) for lines, stroke:var(--border-soft) for axes */
        .ilt-axis {
          stroke: var(--border-soft);
          stroke-width: 2;
          fill: none;
        }
        /* ==== END _foundation.css ==== */

        /* ---- scene-specific: compose foundation primitives + tokens only ---- */
        #m-wrap {
          position: absolute;
          left: 180px;
          top: 50%;
          width: 1560px;
        }
        #m-head {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          margin-bottom: 1.6cqw;
        }
        #m-count {
          display: flex;
          align-items: baseline;
          gap: 0.7cqw;
        }
        #m-count-num {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h1);
          line-height: 0.9;
          letter-spacing: -0.03em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        .m-row {
          position: relative;
          display: flex;
          gap: 32px;
          padding: 34px 44px;
          align-items: stretch;
          transform-origin: left center;
        }
        .m-row + .m-row {
          margin-top: 34px;
        }
        .m-tab {
          flex: none;
          align-self: stretch;
          transform-origin: center top; /* accent tab = graphic */
        }
        .m-body {
          display: flex;
          flex-direction: column;
          gap: 0.75cqw;
          width: 1340px;
        }
        .m-detail {
          display: flex;
          align-items: baseline;
          gap: 0.8cqw;
        }
        .m-dot {
          flex: none;
          width: 12px;
          height: 12px;
          border-radius: var(--radius-pill);
          background: var(--accent-2); /* accent dot = graphic */
        }

        #m-glyph {
          display: inline-flex;
          align-items: center;
          gap: 0.6cqw;
          margin-top: 0.4cqw;
        }
        #m-glyph-arrow {
          width: 68px;
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent-2); /* connector = graphic */
          transform-origin: left center;
        }
        #m-note {
          display: inline-flex;
          font-size: var(--fs-caption);
        }
        #m-note-rule {
          position: absolute;
          left: 0;
          bottom: -14px;
          width: 100%;
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
          transform-origin: left center;
        }
        #m-note-wrap {
          position: relative;
          display: inline-block;
          margin-top: 1.5cqw;
        }
      </style>

      <div id="root" data-composition-id="05-membership" data-width="1920" data-height="1080">
        <div id="m-wrap">
          <div id="m-head">
            <div id="m-kicker" class="ilt-kicker">Membership</div>
            <div id="m-count">
              <span id="m-count-num">0</span>
              <span id="m-count-label" class="ilt-caption">membership models</span>
            </div>
          </div>

          <div id="m-row-0" class="m-row ilt-panel">
            <div id="m-tab-0" class="m-tab ilt-tab"></div>
            <div class="m-body">
              <div id="m-label-0" class="ilt-headline">Assigned membership</div>
              <div id="m-d0a" class="m-detail">
                <span class="m-dot"></span>
                <span class="ilt-caption">An admin adds and removes each person by hand</span>
              </div>
            </div>
          </div>

          <div id="m-row-1" class="m-row ilt-panel">
            <div id="m-tab-1" class="m-tab ilt-tab"></div>
            <div class="m-body">
              <div id="m-label-1" class="ilt-headline">Dynamic membership</div>
              <div id="m-d1a" class="m-detail">
                <span class="m-dot"></span>
                <span class="ilt-caption">Microsoft Entra ID evaluates a rule over user attributes</span>
              </div>
              <div id="m-glyph">
                <span id="m-glyph-a" class="ilt-chip">office location</span>
                <span id="m-glyph-arrow"></span>
                <span id="m-glyph-b" class="ilt-chip">membership updates automatically</span>
              </div>
            </div>
          </div>

          <span id="m-note-wrap">
            <span id="m-note" class="ilt-chip">Still hiring &mdash; the next starter is added for you</span>
            <span id="m-note-rule"></span>
          </span>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Audio is the clock. anchors.js is generated by tools/word_anchors.py from
          // transcript.json (lead-in 3.0s = the silent bumper) and is loaded by the host.
          // If it is missing every cue time below is unresolvable — fail loudly rather than
          // silently render a de-synced scene.
          if (!window.__anchors) {
            throw new Error("05-membership: anchors.js not loaded - cue times unresolvable");
          }

          // S = this scene's cut on the composition clock (scenes.json).
          // W = every spoken-word anchor rebased onto THIS scene's clock, so a content cue
          //     reads W.<anchor_name> and never a hand-estimated offset.
          var S = 72.67;
          var W = {};
          Object.keys(window.__anchors).forEach(function (k) {
            W[k] = window.__anchors[k] - S;
          });

          // B = mechanical beat markers measured from the scene cut itself, never from speech:
          // the scene-open cadence and the slow camera settle (kit precedent: bumper's push).
          var B = { o1: 0.25, o2: 0.65, push: 1.0, hold: 21.7 };

          var tl = gsap.timeline({ paused: true });

          var counter = { v: 0 };
          var countEl = document.getElementById("m-count-num");
          function paintCount() {
            countEl.textContent = String(Math.round(counter.v));
          }

          tl.set("#m-wrap", { yPercent: -50, transformOrigin: "left center" }, 0);
          ["#m-kicker", "#m-count", "#m-row-0", "#m-row-1", "#m-label-0", "#m-label-1", "#m-d0a", "#m-d1a", "#m-glyph-a", "#m-glyph-b", "#m-note"].forEach((s) => tl.set(s, { opacity: 0, y: 22 }, 0));
          ["#m-tab-0", "#m-tab-1"].forEach((s) => tl.set(s, { scaleY: 0 }, 0));
          ["#m-glyph-arrow", "#m-note-rule"].forEach((s) => tl.set(s, { scaleX: 0 }, 0));

          tl.to("#m-kicker", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, B.o1);
          tl.to("#m-count", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, B.o2);
          tl.to("#m-wrap", { scale: 1.03, duration: B.hold, ease: "none" }, B.push);

          // "With assigned membership…" — the count resolves and both shells land.
          tl.to(counter, { v: 2, duration: 1.0, ease: "power2.out", onUpdate: paintCount }, W.member_assigned);
          tl.to("#m-row-0", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, W.member_assigned);
          tl.to("#m-row-1", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, W.member_assigned);
          tl.to("#m-label-0", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.member_assigned);
          tl.to("#m-tab-0", { scaleY: 1, duration: 0.6, ease: "power2.out" }, W.member_assigned);
          // "…an admin adds and removes each person by hand"
          tl.to("#m-d0a", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.member_manual);

          // "With dynamic membership…"
          tl.to("#m-label-1", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.member_dynamic_label);
          tl.to("#m-tab-1", { scaleY: 1, duration: 0.6, ease: "power2.out" }, W.member_dynamic_label);
          // "…reads user attributes" — the chosen row lifts, the peer recedes.
          tl.to("#m-d1a", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.member_dynamic);
          tl.to("#m-row-1", { x: 26, duration: 0.7, ease: "power3.out" }, W.member_dynamic);
          tl.to("#m-tab-1", { scaleX: 3, duration: 0.7, ease: "power3.out" }, W.member_dynamic);
          tl.to("#m-row-0", { opacity: 0.42, scale: 0.985, duration: 0.7, ease: "power2.out" }, W.member_dynamic);
          // "…and updates the group automatically" — attributes flow into the auto glyph.
          tl.to("#m-glyph-a", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.member_auto);
          tl.to("#m-glyph-arrow", { scaleX: 1, duration: 0.55, ease: "power2.out" }, W.member_auto);
          tl.to("#m-glyph-b", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.member_auto);

          // "For an office that's still hiring…"
          tl.to("#m-note", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, W.member_hiring);
          // "…nobody has to remember to add the next starter"
          tl.to("#m-note-rule", { scaleX: 1, duration: 0.7, ease: "power2.out" }, W.member_verdict);

          window.__timelines["05-membership"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
