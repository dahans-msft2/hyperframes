  <head>

  <body>
    <template>
      <style>
        /* === Learn-ILT scene: 10-expiration-lifecycle — list-steps — the expiration lifecycle as four ordered stages on a connector === */
        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        /* =============================================================================
           Learn-ILT KIT FOUNDATION  —  single source of truth for every kit block.
           -----------------------------------------------------------------------------
           Every block in templates/blocks/ opens its <style> with a VERBATIM copy of
           this file (between the two BEGIN/END markers), then adds only block-specific
           rules that REFERENCE these tokens + primitives. That is what makes a chart, a
           spec list, a flowchart and a lower-third feel like one kit instead of seven
           islands: shared tokens, one type scale, one ground-swap, shared primitives.

           NAMING (every kit block file + its data-composition-id + its __timelines key
           share ONE name):  <category>-<variant>  — lowercase, hyphen-separated.
             category = the scene archetype (what kind of scene it is)
             variant  = the specific style within that archetype
           Current categories: stat- (single big number/count-up), chart- (multi-point
           data viz), list- (enumerated rows), diagram- (nodes + relationships),
           title- (title card), section- (segment divider), code- (code window),
           callout- (key-point card), media- (screenshot / screen recording in a window),
           lower-third- (name/role overlay). Reserved: quote-, compare-.
           e.g. stat-progress, stat-count, chart-bar, chart-line, list-specs,
           diagram-flow, media-screenshot, lower-third-bar.

           AUTHORING RULES (the "one consistent approach"):
             1. Never hardcode a brand colour, font, radius, or ground gradient in a
                block. Read a token. If you need a value that isn't here, add it here.
             2. Never size text in px. Use the --fs-* scale (cqw) so type scales with the
                mount container and can never regress below the --fs-micro floor (~24px).
             3. CONTRAST LAW: text is ALWAYS var(--ink) or var(--ink-soft). Accents
                (var(--accent*)) colour GRAPHICS only — bars, lines, fills, borders,
                chips, rules — never text.
             4. Ground is chosen by the host via  #root[data-ground="…"]  (default
                content-wash). Each ground layers the deck's real exported PNG
                (assets/grounds/ground-<name>.png, copied into the project like fonts)
                OVER a CSS-gradient fallback — if the PNG is absent (standalone preview),
                the gradient shows. dark-field is CSS-only (no PNG) and flips ink to white
                automatically — do not special-case it in a block.
             5. The host owns scene lifetime. A block never hides/fades its own #root on
                exit; register the paused timeline on window.__timelines[<id>] and stop.
           ============================================================================= */

        /* ---- reset ---------------------------------------------------------------- */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        /* ---- #root: tokens + container ------------------------------------------- */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size; /* 1cqw = 1% of width = 19.2px at 1920 */

          /* palette — content-wash (default ground). data-ground overrides below. */
          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e; /* all text */
          --ink-soft: #59636e; /* secondary text */
          --paper: #ffffff; /* panel / card fill */
          --paper-veil: rgba(255, 255, 255, 0.9); /* translucent panel on a busy ground */
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          /* accents — GRAPHICS ONLY, never text */
          --accent: #8661c5; /* purple  (primary)   */
          --accent-2: #0078d4; /* blue    (secondary) */
          --accent-3: #389a91; /* teal    (tertiary)  */
          --accent-4: #bf3ac4; /* magenta (quaternary)*/
          --accent-ink: #ffffff; /* text that sits ON an accent fill (chips/badges)   */

          /* type — cqw scale (never px in a block). ~value at 1920 wide in comments.  */
          --fs-display: 11cqw; /* ~211px  hero stat / count-up                        */
          --fs-h1: 4.6cqw; /* ~88px   title-card headline                         */
          --fs-h2: 3.4cqw; /* ~65px   scene title / subject                       */
          --fs-h3: 2.4cqw; /* ~46px   block headline                              */
          --fs-lead: 2cqw; /* ~38px   lead / large label                          */
          --fs-body: 1.75cqw; /* ~34px   body / row label                           */
          --fs-caption: 1.5cqw; /* ~29px   caption / value                            */
          --fs-kicker: 1.55cqw; /* ~30px   eyebrow / kicker                           */
          --fs-micro: 1.25cqw; /* ~24px   FLOOR — nothing smaller than this          */

          /* rhythm */
          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px; /* chart line / connector weight */
          --rule: 3px; /* accent underline weight       */

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }

        #root[data-ground="hero-swoosh"] {
          /* warm paper with a stronger purple sweep — css fallback of the PNG swoosh */
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          /* the deck's pale "background-gradient" export — cool blue wash */
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          /* the dramatic exception: near-black navy, WHITE ink. css-only (no PNG). */
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* ---- shared primitives ---------------------------------------------------- */
        /* Type roles — a block composes these instead of inventing a size each time.  */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-body {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.3;
          color: var(--ink);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        .ilt-value {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-caption);
          letter-spacing: -0.01em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        .ilt-display {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-display);
          line-height: 0.95;
          letter-spacing: -0.03em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }

        /* Surfaces */
        .ilt-panel {
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-panel--veil {
          background: var(--paper-veil);
        }
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }

        /* Accents-as-graphics */
        .ilt-rule {
          /* accent underline bar — a graphic, never text colour */
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        .ilt-tab {
          /* vertical accent tab (lower-thirds, callouts) */
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* SVG helpers: stroke:var(--accent) for lines, stroke:var(--border-soft) for axes */
        .ilt-axis {
          stroke: var(--border-soft);
          stroke-width: 2;
          fill: none;
        }
        /* ==== END _foundation.css ==== */

        /* ---- scene-specific: compose foundation primitives + tokens only ---- */
        #e-wrap {
          position: absolute;
          left: 180px;
          top: 50%;
          width: 1560px;
          display: flex;
          gap: 60px;
          align-items: center;
        }
        #e-ghost {
          flex: none;
          width: 480px;
          padding: 40px 40px 44px;
          transform-origin: center center;
        }
        #e-ghost-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.1;
          letter-spacing: -0.015em;
          color: var(--ink);
          margin-bottom: 1.1cqw;
        }
        .e-ghost-line {
          display: flex;
          align-items: baseline;
          gap: 0.7cqw;
          margin-top: 0.7cqw;
        }
        .e-ghost-dot {
          flex: none;
          width: 12px;
          height: 12px;
          border-radius: var(--radius-pill);
          background: var(--accent-4); /* magenta dot = graphic */
        }
        #e-col {
          position: relative;
          flex: 1 1 auto;
        }
        #e-connector {
          position: absolute;
          left: 39px;
          top: 40px;
          width: var(--rule);
          height: 396px;
          border-radius: var(--rule);
          background: var(--border-soft);
          transform-origin: top center;
        }
        .e-step {
          position: relative;
          display: flex;
          align-items: center;
          gap: 30px;
        }
        .e-step + .e-step {
          margin-top: 44px;
        }
        .e-badge {
          flex: none;
          width: 82px;
          height: 82px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: var(--radius-pill);
          background: var(--accent);
          box-shadow: var(--shadow);
          transform-origin: center center;
        }
        .e-num {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-lead);
          color: var(--accent-ink); /* numeral sits ON the accent fill */
          font-variant-numeric: tabular-nums;
        }
        .e-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.14;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .e-text {
          display: flex;
          flex-direction: column;
          gap: 0.3cqw;
          width: 820px;
        }
        #e-auto {
          align-self: flex-start;
          margin-top: 0.4cqw;
          font-size: var(--fs-micro);
        }
      </style>

      <div id="root" data-composition-id="10-expiration-lifecycle" data-width="1920" data-height="1080">
        <div id="e-wrap">
          <div id="e-ghost" class="ilt-panel">
            <div id="e-ghost-title">Project Falcon</div>
            <div id="e-ghost-a" class="e-ghost-line">
              <span class="e-ghost-dot"></span><span class="ilt-caption">A six-month project group</span>
            </div>
            <div id="e-ghost-b" class="e-ghost-line">
              <span class="e-ghost-dot"></span><span class="ilt-caption">Still here two years later</span>
            </div>
            <div id="e-ghost-c" class="e-ghost-line">
              <span class="e-ghost-dot"></span><span class="ilt-caption">Owner gone &middot; members unsure why</span>
            </div>
          </div>

          <div id="e-col">
            <div id="e-kicker" class="ilt-kicker">Group expiration policy</div>
            <div id="e-connector"></div>
            <div id="e-step-0" class="e-step">
              <div id="e-badge-0" class="e-badge"><span class="e-num">1</span></div>
              <div class="e-text"><div id="e-title-0" class="e-title">A lifetime in days</div></div>
            </div>
            <div id="e-step-1" class="e-step">
              <div id="e-badge-1" class="e-badge"><span class="e-num">2</span></div>
              <div class="e-text">
                <div id="e-title-1" class="e-title">Entra ID asks the owners to renew</div>
                <span id="e-auto" class="ilt-chip">a group still in use renews itself</span>
              </div>
            </div>
            <div id="e-step-2" class="e-step">
              <div id="e-badge-2" class="e-badge"><span class="e-num">3</span></div>
              <div class="e-text"><div id="e-title-2" class="e-title">Anything nobody renews is deleted</div></div>
            </div>
            <div id="e-step-3" class="e-step">
              <div id="e-badge-3" class="e-badge"><span class="e-num">4</span></div>
              <div class="e-text"><div id="e-title-3" class="e-title">&hellip; but it stays restorable for 30 days</div></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Audio is the clock. anchors.js is generated by tools/word_anchors.py from
          // transcript.json (lead-in 3.0s = the silent bumper) and is loaded by the host.
          // If it is missing every cue time below is unresolvable — fail loudly rather than
          // silently render a de-synced scene.
          if (!window.__anchors) {
            throw new Error("10-expiration-lifecycle: anchors.js not loaded - cue times unresolvable");
          }

          // S = this scene's cut on the composition clock (scenes.json).
          // W = every spoken-word anchor rebased onto THIS scene's clock, so a content cue
          //     reads W.<anchor_name> and never a hand-estimated offset.
          var S = 180.81;
          var W = {};
          Object.keys(window.__anchors).forEach(function (k) {
            W[k] = window.__anchors[k] - S;
          });

          // B = mechanical beat markers measured from the scene cut itself, never from speech:
          // the scene-open cadence and the slow camera settle (kit precedent: bumper's push).
          var B = { o1: 0.25, push: 0.9, hold: 31.1 };

          var tl = gsap.timeline({ paused: true });

          tl.set("#e-wrap", { yPercent: -50, transformOrigin: "left center" }, 0);
          ["#e-kicker", "#e-ghost-title", "#e-ghost-a", "#e-ghost-b", "#e-ghost-c", "#e-title-0", "#e-title-1", "#e-title-2", "#e-title-3", "#e-auto"].forEach((s) => tl.set(s, { opacity: 0, y: 20 }, 0));
          ["#e-ghost"].forEach((s) => tl.set(s, { opacity: 0, scale: 0.94 }, 0));
          ["#e-connector"].forEach((s) => tl.set(s, { scaleY: 0 }, 0));
          ["#e-badge-0", "#e-badge-1", "#e-badge-2", "#e-badge-3"].forEach((s) => tl.set(s, { opacity: 0, scale: 0.3 }, 0));

          // "Naming keeps names tidy…"
          tl.to("#e-kicker", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, B.o1);
          tl.to("#e-wrap", { scale: 1.028, duration: B.hold, ease: "none" }, B.push);

          // "…but it doesn't stop groups from outliving their purpose"
          tl.to("#e-ghost", { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, W.expire_outliving);
          tl.to("#e-ghost-title", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.expire_outliving);
          // "A six-month project group…"
          tl.to("#e-ghost-a", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.expire_sixmonth);
          // "…is often still around two years later"
          tl.to("#e-ghost-b", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.expire_twoyears);
          // "owner gone, members unsure why they're there"
          tl.to("#e-ghost-c", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.expire_ownergone);

          // "A group expiration policy…" — the orphan recedes, the lifecycle rail draws down.
          tl.to("#e-ghost", { opacity: 0.4, scale: 0.96, duration: 0.9, ease: "power2.out" }, W.expire_policy);
          tl.to("#e-connector", { scaleY: 1, duration: 15.4, ease: "none" }, W.expire_policy);
          tl.to(["#e-badge-0", "#e-badge-1", "#e-badge-2", "#e-badge-3"], { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2.2)", stagger: 0.18 }, W.expire_policy);

          // "…gives each Microsoft 365 group a lifetime in days"
          tl.to("#e-title-0", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.expire_lifetime);
          tl.to("#e-badge-0", { scale: 1.12, duration: 0.6, ease: "power2.out" }, W.expire_nears);
          // "…Entra ID asks the owners to renew"
          tl.to("#e-title-1", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.expire_owners_renew);
          // "…and a group still in use renews itself automatically"
          tl.to("#e-auto", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, W.expire_renew);
          // "Anything nobody renews gets deleted"
          tl.to("#e-title-2", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.expire_deleted);
          // "…but it stays restorable for thirty days" — the closing stage takes the focus.
          tl.to("#e-title-3", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.expire_restore);
          tl.to("#e-badge-3", { scale: 1.16, duration: 0.7, ease: "back.out(2)" }, W.expire_restore);
          tl.to("#e-step-3", { x: 22, duration: 1.4, ease: "power2.out" }, W.expire_restore);

          window.__timelines["10-expiration-lifecycle"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
