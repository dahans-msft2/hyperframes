    <style>
      @font-face {
        font-family: "Segoe UI";
        font-weight: 400;
        font-style: normal;
        src: url("fonts/segoeui-regular.woff2") format("woff2");
        font-display: block;
      }

      @font-face {
        font-family: "Segoe UI Semibold";
        font-weight: 600;
        font-style: normal;
        src: url("fonts/segoeui-semibold.woff2") format("woff2");
        font-display: block;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 1920px; height: 1080px;
        margin: 0; overflow: hidden;
        background: #fff8f3;
        font-family: "Segoe UI", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px; height: 1080px;
        overflow: hidden;
        /* Opaque stage ground: white-flash guard for any seam dip (seam-craft). */
        background: #fff8f3;
      }

      /* Scene slots fill the root and stack by mount order. */
      #root > div[data-composition-src] { position: absolute; inset: 0; }

      /* Fade bookends: opaque covers above everything; the timeline drives their opacity. */
      .fade-cover { position: absolute; inset: 0; background: #000; z-index: 100; pointer-events: none; }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      // Thin root timeline: scene motion lives in each scene file. This timeline carries only
      // the cross-scene seams, stamped against the slot-<id> hosts.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["root"] = tl;

      // <seams:auto> — cross-scene cut-the-curve, stamped by assemble_scenes.py from scenes.json.
      // SEAM 02-title -> 03-objectives : cut-left (cut @27.55)
      tl.to("#slot-02-title", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 27.21);
      tl.set("#slot-02-title", { autoAlpha: 0 }, 27.55);
      tl.fromTo("#slot-03-objectives", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 27.55);
      // SEAM 03-objectives -> 04-group-types : cut-left (cut @43.35)
      tl.to("#slot-03-objectives", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 43.01);
      tl.set("#slot-03-objectives", { autoAlpha: 0 }, 43.35);

      tl.fromTo("#slot-05-membership", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 72.67);
      // SEAM 05-membership -> 06-nesting-predict : cut-up (cut @95.39)

      tl.set("#slot-05-membership", { autoAlpha: 0 }, 95.39);
      tl.fromTo("#slot-06-nesting-predict", { yPercent: 10, autoAlpha: 0.35 }, { yPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 95.39);

      tl.fromTo("#fade-out", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.7, ease: "power2.in", immediateRender: false }, 276.167);
