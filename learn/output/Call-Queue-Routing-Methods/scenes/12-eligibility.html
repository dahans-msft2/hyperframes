<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: specs-list (label/value rows + accent underline sweep, staggered). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitive used by this block ---- */
        .ilt-rule {
          /* accent underline bar — a graphic, never text colour */
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-sl-col {
          position: absolute;
          display: flex;
          flex-direction: column;
        }
        .mk-sl-row {
          line-height: 1;
          opacity: 0;
        }
        .mk-sl-text {
          display: flex;
          align-items: baseline;
          gap: 22px;
          white-space: nowrap;
        }
        .mk-sl-label {
          font-weight: 600;
          font-size: var(--fs-body);
          letter-spacing: -0.015em;
          color: var(--ink); /* label — primary ink */
        }
        .mk-sl-value {
          font-weight: 400;
          font-size: var(--fs-body);
          letter-spacing: -0.01em;
          color: var(--ink-soft); /* value — secondary ink */
        }
        .mk-sl-line {
          position: relative;
          margin-top: 22px;
          height: var(--rule);
          background: var(--border-soft); /* track — soft border, ground-aware */
          border-radius: 2px;
          overflow: hidden;
        }
        .mk-sl-line-fill {
          position: absolute;
          inset: 0;
          transform-origin: left center;
          /* .ilt-rule supplies the purple accent fill */
        }
      </style>

      <div id="root" data-composition-id="12-eligibility" data-width="1920" data-height="1080" data-ground="content-wash">
        <div id="mk-sl-col"></div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* Edit per use. Label/value rows reveal one-by-one, each with an accent underline sweep. */
          var CONFIG = {
            "rows": [
                        {
                                    "label": "Wait time",
                                    "value": "past your configured threshold"
                        },
                        {
                                    "label": "Calls in queue",
                                    "value": "above your configured number"
                        },
                        {
                                    "label": "Calls-to-agent ratio",
                                    "value": "crosses your limit"
                        },
                        {
                                    "label": "Caller number",
                                    "value": "publicly dialable · non-premium · E.164 · not ringing an agent"
                        }
            ],
            "underline": true,
            "lineWidth": 1160,
            "x": 220,
            "rowGap": 46,
            "stagger": 0.22
};

          var col = document.getElementById("mk-sl-col");

          /* build rows */
          CONFIG.rows.forEach(function (r, i) {
            var row = document.createElement("div");
            row.id = "mk-sl-row-" + i;
            row.className = "mk-sl-row";
            if (i > 0) row.style.marginTop = CONFIG.rowGap + "px";

            var text = document.createElement("div");
            text.className = "mk-sl-text";
            var label = document.createElement("span");
            label.className = "mk-sl-label";
            label.textContent = r.label;
            text.appendChild(label);
            if (r.value) {
              var value = document.createElement("span");
              value.className = "mk-sl-value";
              value.textContent = r.value;
              text.appendChild(value);
            }
            row.appendChild(text);

            if (CONFIG.underline) {
              var line = document.createElement("div");
              line.className = "mk-sl-line";
              line.style.width = CONFIG.lineWidth + "px";
              var fill = document.createElement("div");
              fill.id = "mk-sl-fill-" + i;
              fill.className = "mk-sl-line-fill ilt-rule";
              line.appendChild(fill);
              row.appendChild(line);
            }
            col.appendChild(row);
          });

          /* center the column vertically */
          var colH =
            CONFIG.rows.length * (46 + 22 + (CONFIG.underline ? 3 : 0)) +
            (CONFIG.rows.length - 1) * CONFIG.rowGap;
          col.style.left = CONFIG.x + "px";
          col.style.top = Math.round((1080 - colH) / 2) + "px";

          var tl = gsap.timeline({ paused: true });

          /* Scene-relative, seek-safe: rows slide in staggered, each underline sweeps left→right.
             No exit / hide — the host controls scene lifetime. */
          CONFIG.rows.forEach(function (r, i) {
            var row = document.getElementById("mk-sl-row-" + i);
            var t0 = 0.3 + i * CONFIG.stagger;

            gsap.set(row, { opacity: 0, x: -36 });
            tl.to(row, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, t0);

            if (CONFIG.underline) {
              var fill = document.getElementById("mk-sl-fill-" + i);
              gsap.set(fill, { scaleX: 0 });
              tl.to(fill, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, t0 + 0.15);
            }
          });

          window.__timelines["12-eligibility"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
