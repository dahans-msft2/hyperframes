<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: diagram-layers (concentric planes around a core). ===
           The containment / nesting / boundary beat: outside-in scopes settle around a
           protected core, each ring labelled, the core glowing last — inheritance, trust
           boundaries, layered protection, management scope.
           Built on the kit foundation: tokens only, no hardcoded colours/fonts/px type.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitives used by this block ---- */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-dl-stage {
          position: absolute;
          inset: 0;
        }
        /* a concentric ring: a bordered translucent plane, centred, labelled at its top edge. */
        .mk-dl-ring {
          position: absolute;
          left: var(--cx, 50%);
          top: 50%;
          transform: translate(-50%, -50%);
          border: 2px solid var(--border);
          border-radius: 28px;
          background: var(--paper-veil);
          box-shadow: var(--shadow);
        }
        .mk-dl-ring-label {
          position: absolute;
          top: 0;
          left: 50%;
          transform: translate(-50%, -50%);
          padding: 0.35em 1.1em;
          border-radius: var(--radius-pill);
          border: 1.5px solid var(--border);
          background: var(--paper);
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-caption);
          letter-spacing: 0.02em;
          color: var(--ink);
          white-space: nowrap;
        }
        /* the protected core — an accent-bordered panel; its label sits ON no fill, stays ink. */
        #mk-dl-core {
          position: absolute;
          left: var(--cx, 50%);
          top: 50%;
          transform: translate(-50%, -50%);
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 1.4cqw 2cqw;
          border: 2.5px solid var(--accent);
          border-radius: 20px;
          background: var(--paper);
          box-shadow: 0 0 0 0 rgba(134, 97, 197, 0);
        }
        #mk-dl-core-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.1;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
      </style>

      <div id="root" data-composition-id="05-boundary" data-ground="dark-field" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="mk-dl-stage"></div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* Edit per use. Concentric scopes, OUTER-to-inner, around a protected core. Rings
             settle outside-in, then the core glows — containment, inheritance, trust boundary,
             management scope. */
          var A = window.__anchors || {};
          var cueTypes = Math.max(2.4, (A.au_holds_types || 65.02) - (A.beat5_start || 58.65));
          var cueScope = Math.max(cueTypes + 1.0, (A.au_scoped_objects || 72.76) - (A.beat5_start || 58.65));

          var CONFIG = {
            layers: [
              { label: "Tenant (Entra ID)" },
              { label: "Administrative unit" },
            ],
            core: "Office users · groups · devices",
            outer: 860,
            step: 210,
            coreSize: 360,
            cx: 770,
            stagger: 0.35,
          };

          var stage = document.getElementById("mk-dl-stage");
          stage.style.setProperty("--cx", CONFIG.cx + "px"); // centre rings/core on cx without shifting the frame

          var rings = CONFIG.layers;
          rings.forEach(function (layer, i) {
            var size = CONFIG.outer - i * CONFIG.step;
            var ring = document.createElement("div");
            ring.className = "mk-dl-ring";
            ring.id = "mk-dl-ring-" + i;
            ring.style.width = size + "px";
            ring.style.height = size + "px";
            ring.style.zIndex = 10 + i;

            var label = document.createElement("div");
            label.className = "mk-dl-ring-label";
            label.textContent = layer.label;
            ring.appendChild(label);

            stage.appendChild(ring);
          });

          var core = document.createElement("div");
          core.id = "mk-dl-core";
          core.style.width = CONFIG.coreSize + "px";
          core.style.zIndex = 100;
          var coreLabel = document.createElement("div");
          coreLabel.id = "mk-dl-core-label";
          coreLabel.textContent = CONFIG.core;
          core.appendChild(coreLabel);
          stage.appendChild(core);

          var n = rings.length;
          var tl = gsap.timeline({ paused: true });

          /* rings settle OUTSIDE-IN: outer first, scaling down from slightly larger + fading. */
          rings.forEach(function (layer, i) {
            var ring = document.getElementById("mk-dl-ring-" + i);
            gsap.set(ring, { opacity: 0, scale: 1.12 });
            tl.to(ring, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.3 + i * CONFIG.stagger);
          });

          /* the core scales in, then a soft accent glow pulses on once — it is the payoff. */
          var coreAt = Math.max(1.4, cueTypes - 0.8);
          gsap.set(core, { opacity: 0, scale: 0.6 });
          tl.to(core, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, coreAt);
          tl.to(core, { boxShadow: "0 0 54px 10px rgba(73,197,177,.42)", duration: 0.55, ease: "power2.out" }, cueScope);

          window.__timelines["05-boundary"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
