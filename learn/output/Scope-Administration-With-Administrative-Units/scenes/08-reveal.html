        /* === Custom scene: 08-reveal (the two-hop path that stops at hop two). ===
           The design plan named the diagram-flow block, but that block is a fixed,

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        /* =============================================================================
           Learn-ILT KIT FOUNDATION  —  single source of truth for every kit block.
           -----------------------------------------------------------------------------
           Every block in templates/blocks/ opens its <style> with a VERBATIM copy of
           this file (between the two BEGIN/END markers), then adds only block-specific
           rules that REFERENCE these tokens + primitives. That is what makes a chart, a
           spec list, a flowchart and a lower-third feel like one kit instead of seven
           islands: shared tokens, one type scale, one ground-swap, shared primitives.

           NAMING (every kit block file + its data-composition-id + its __timelines key
           share ONE name):  <category>-<variant>  — lowercase, hyphen-separated.
             category = the scene archetype (what kind of scene it is)
             variant  = the specific style within that archetype
           Current categories: stat- (single big number/count-up), chart- (multi-point
           data viz), list- (enumerated rows), diagram- (nodes + relationships),
           title- (title card), section- (segment divider), code- (code window),
           callout- (key-point card), media- (screenshot / screen recording in a window),
           lower-third- (name/role overlay). Reserved: quote-, compare-.
           e.g. stat-progress, stat-count, chart-bar, chart-line, list-specs,
           diagram-flow, media-screenshot, lower-third-bar.

           AUTHORING RULES (the "one consistent approach"):
             1. Never hardcode a brand colour, font, radius, or ground gradient in a
                block. Read a token. If you need a value that isn't here, add it here.
             2. Never size text in px. Use the --fs-* scale (cqw) so type scales with the
                mount container and can never regress below the --fs-micro floor (~24px).
             3. CONTRAST LAW: text is ALWAYS var(--ink) or var(--ink-soft). Accents
                (var(--accent*)) colour GRAPHICS only — bars, lines, fills, borders,
                chips, rules — never text.
             4. Ground is chosen by the host via  #root[data-ground="…"]  (default
                content-wash). Each ground layers the deck's real exported PNG
                (assets/grounds/ground-<name>.png, copied into the project like fonts)
                OVER a CSS-gradient fallback — if the PNG is absent (standalone preview),
                the gradient shows. dark-field is CSS-only (no PNG) and flips ink to white
                automatically — do not special-case it in a block.
             5. The host owns scene lifetime. A block never hides/fades its own #root on
                exit; register the paused timeline on window.__timelines[<id>] and stop.
           ============================================================================= */

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);

          --accent: #8661c5; /* purple  (primary)   */

          --accent-3: #389a91; /* teal    (tertiary)  */

          --accent-ink: #ffffff; /* text that sits ON an accent fill (chips/badges)   */

          /* type — cqw scale (never px in a block). ~value at 1920 wide in comments.  */
          --fs-display: 11cqw; /* ~211px  hero stat / count-up                        */
          --fs-h1: 4.6cqw; /* ~88px   title-card headline                         */
          --fs-h2: 3.4cqw; /* ~65px   scene title / subject                       */
          --fs-h3: 2.4cqw; /* ~46px   block headline                              */

      <div
        id="root"
        data-composition-id="08-reveal"
        data-width="1920"

        <div id="rv-stage" data-keep-in-frame>
          <div id="rv-col">
            <div id="rv-kicker" class="ilt-kicker">The answer</div>
            <div id="rv-headline" class="ilt-title">

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Scene-relative cue times, every one a REAL spoken-word time from
          // transcript.json (anchors.js, generated by tools/word_anchors.py), rebased to
          // this scene's start. No words-per-second estimate anywhere in this file.
          var A = window.__anchors || {};
          var SCENE_START = 122.64; // "The answer is no" — this scene opens on the payoff
          function at(name) {
            return Math.max(0, (A[name] || 0) - SCENE_START);
          }
          var W = {
            groupScope: at("reveal_group_scope"), // "the group object into scope"
            notInside: at("reveal_not_inside"), // "not the users inside it"
            rename: at("reveal_rename_group"), // "rename the group or edit its membership"
            directMember: at("reveal_direct_member"), // "because the group is a direct member"
            cantReset: at("reveal_cant_reset"), // "reset a password for anyone in it"
            twoSteps: at("reveal_two_steps"), // "two steps removed"
            notUnitItself: at("reveal_not_unit_itself"), // "not of the unit itself"
          };

          var d = document;
          var kicker = d.getElementById("rv-kicker");
          var headline = d.getElementById("rv-headline");
          var nodeUnit = d.getElementById("rv-node-unit");
          var nodeGroup = d.getElementById("rv-node-group");
          var nodeMembers = d.getElementById("rv-node-members");
          var link1 = d.getElementById("rv-link-1");
          var link1Label = d.getElementById("rv-link-1-label");
          var link2 = d.getElementById("rv-link-2");
          var link2Break = d.getElementById("rv-link-2-break");
          var link2Strike = d.getElementById("rv-link-2-strike");
          var chipRename = d.getElementById("rv-chip-rename");
          var chipMembership = d.getElementById("rv-chip-membership");
          var chipReset = d.getElementById("rv-chip-reset");
          var measureBar = d.getElementById("rv-measure-bar");
          var tickA = d.getElementById("rv-tick-a");
          var tickB = d.getElementById("rv-tick-b");
          var measureLabel = d.getElementById("rv-measure-label");
          var footnote = d.getElementById("rv-footnote");

          var tl = gsap.timeline({ paused: true });

          // t=0 pins — every arrival is hidden until its own cue (check_initial_state).
          tl.set([kicker, headline], { opacity: 0, y: 26 }, 0);
          tl.set(nodeUnit, { opacity: 0, scale: 0.94 }, 0);
          tl.set(nodeGroup, { opacity: 0, scale: 0.94 }, 0);
          tl.set(nodeMembers, { opacity: 0, scale: 0.94 }, 0);
          tl.set([link1, link2], { scaleX: 0 }, 0);
          tl.set(link1Label, { opacity: 0 }, 0);
          tl.set(link2Break, { opacity: 0 }, 0);
          tl.set(link2Strike, { scaleY: 0 }, 0);
          tl.set([chipRename, chipMembership, chipReset], { opacity: 0, y: 16 }, 0);
          tl.set(measureBar, { scaleX: 0 }, 0);
          tl.set([tickA, tickB], { scaleY: 0 }, 0);
          tl.set([measureLabel, footnote], { opacity: 0, y: 14 }, 0);

          // 1) The cut IS the answer — scene 7 held the question across the seam.
          //    Headline and the unit (the boundary we already drew in beat 5) land together.
          tl.fromTo(
            [kicker, headline],
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.12 },
            0,
          );
          tl.fromTo(
            nodeUnit,
            { opacity: 0, scale: 0.94 },
            { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" },
            0,
          );

          // 2) "the group object into scope" — hop one completes: the link draws, THEN the
          //    group node arrives (a link never precedes the things it links; the group
          //    node is what the link is about, so it lands on the word).
          tl.fromTo(
            link1,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "power2.out" },
            W.groupScope,
          );
          tl.fromTo(
            nodeGroup,
            { opacity: 0, scale: 0.94 },
            { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" },
            W.groupScope,
          );

          // 3) "not the users inside it" — hop two exists, but arrives recessed.
          tl.fromTo(
            link2,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power2.out" },
            W.notInside,
          );
          tl.fromTo(
            nodeMembers,
            { opacity: 0, scale: 0.94 },
            { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
            W.notInside,
          );

          // 4) "rename the group or edit its membership" — what the admin CAN do.
          tl.fromTo(
            [chipRename, chipMembership],
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.26 },
            W.rename,
          );

          // 5) "because the group is a direct member" — hop one is named and emphasised.
          tl.fromTo(
            link1Label,
            { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power2.out" },
            W.directMember,
          );
          tl.to(link1, { scaleY: 1.6, duration: 0.35, ease: "power2.out" }, W.directMember);
          tl.to(nodeGroup, { scale: 1.03, duration: 0.4, ease: "power2.out" }, W.directMember);

          // 6) "reset a password for anyone in it" — what the admin CAN'T do.
          tl.fromTo(
            chipReset,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.6)" },
            W.cantReset,
          );

          // 7) "two steps removed" — the wall. Hop two breaks, the members shake against
          //    it, and the measure spans the whole distance that scope does not cross.
          tl.fromTo(
            link2Break,
