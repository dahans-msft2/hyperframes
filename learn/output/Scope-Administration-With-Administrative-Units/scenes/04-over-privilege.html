        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        /* =============================================================================
           Learn-ILT KIT FOUNDATION  —  single source of truth for every kit block.
           -----------------------------------------------------------------------------
           Every block in templates/blocks/ opens its <style> with a VERBATIM copy of
           this file (between the two BEGIN/END markers), then adds only block-specific
           rules that REFERENCE these tokens + primitives. That is what makes a chart, a
           spec list, a flowchart and a lower-third feel like one kit instead of seven
           islands: shared tokens, one type scale, one ground-swap, shared primitives.

           NAMING (every kit block file + its data-composition-id + its __timelines key
           share ONE name):  <category>-<variant>  — lowercase, hyphen-separated.
             category = the scene archetype (what kind of scene it is)
             variant  = the specific style within that archetype
           Current categories: stat- (single big number/count-up), chart- (multi-point
           data viz), list- (enumerated rows), diagram- (nodes + relationships),
           title- (title card), section- (segment divider), code- (code window),
           callout- (key-point card), media- (screenshot / screen recording in a window),
           lower-third- (name/role overlay). Reserved: quote-, compare-.
           e.g. stat-progress, stat-count, chart-bar, chart-line, list-specs,
           diagram-flow, media-screenshot, lower-third-bar.

           AUTHORING RULES (the "one consistent approach"):
             1. Never hardcode a brand colour, font, radius, or ground gradient in a
                block. Read a token. If you need a value that isn't here, add it here.
             2. Never size text in px. Use the --fs-* scale (cqw) so type scales with the
                mount container and can never regress below the --fs-micro floor (~24px).
             3. CONTRAST LAW: text is ALWAYS var(--ink) or var(--ink-soft). Accents
                (var(--accent*)) colour GRAPHICS only — bars, lines, fills, borders,
                chips, rules — never text.
             4. Ground is chosen by the host via  #root[data-ground="…"]  (default
                content-wash). Each ground layers the deck's real exported PNG
                (assets/grounds/ground-<name>.png, copied into the project like fonts)
                OVER a CSS-gradient fallback — if the PNG is absent (standalone preview),
                the gradient shows. dark-field is CSS-only (no PNG) and flips ink to white
                automatically — do not special-case it in a block.
             5. The host owns scene lifetime. A block never hides/fades its own #root on
                exit; register the paused timeline on window.__timelines[<id>] and stop.
           ============================================================================= */

        /* ---- reset ---------------------------------------------------------------- */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;

        /* ---- #root: tokens + container ------------------------------------------- */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size; /* 1cqw = 1% of width = 19.2px at 1920 */

          /* palette — content-wash (default ground). data-ground overrides below. */
          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e; /* all text */
          --ink-soft: #59636e; /* secondary text */
          --paper: #ffffff; /* panel / card fill */
          --paper-veil: rgba(255, 255, 255, 0.9); /* translucent panel on a busy ground */
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          /* accents — GRAPHICS ONLY, never text */
          --accent: #8661c5; /* purple  (primary)   */
          --accent-2: #0078d4; /* blue    (secondary) */
          --accent-3: #389a91; /* teal    (tertiary)  */
          --accent-4: #bf3ac4; /* magenta (quaternary)*/
          --accent-ink: #ffffff; /* text that sits ON an accent fill (chips/badges)   */

          /* type — cqw scale (never px in a block). ~value at 1920 wide in comments.  */
          --fs-display: 11cqw; /* ~211px  hero stat / count-up                        */
          --fs-h1: 4.6cqw; /* ~88px   title-card headline                         */
          --fs-h2: 3.4cqw; /* ~65px   scene title / subject                       */
          --fs-h3: 2.4cqw; /* ~46px   block headline                              */
          --fs-lead: 2cqw; /* ~38px   lead / large label                          */
          --fs-body: 1.75cqw; /* ~34px   body / row label                           */
          --fs-caption: 1.5cqw; /* ~29px   caption / value                            */
          --fs-kicker: 1.55cqw; /* ~30px   eyebrow / kicker                           */
          --fs-micro: 1.25cqw; /* ~24px   FLOOR — nothing smaller than this          */

          /* rhythm */
          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px; /* chart line / connector weight */
          --rule: 3px; /* accent underline weight       */

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Scene-relative cue times. Every one is a REAL spoken-word time from
          // transcript.json (anchors.js, generated by tools/word_anchors.py), rebased
          // to this scene's start. No words-per-second estimate anywhere in this file.
          var A = window.__anchors || {};
          var SCENE_START = 41.06; // "start with what goes wrong" — the scene's own cut
          function at(name) {
            return Math.max(0, (A[name] || 0) - SCENE_START);
          }
          var W = {
            tenantLevel: at("op_tenant_level"), // "at the tenant level"
            resets: at("op_resets_profiles"), // "resets passwords and edits profiles"
            noStop: at("op_no_stop"), // "doesn't stop at the new office"
            reachEvery: at("op_reach_every"), // "reach every user in the directory"
            hq: at("overprivilege_hq"), // "the executives back at headquarters"
          };

          var d = document;
          var kicker = d.getElementById("op-kicker");
          var headline = d.getElementById("op-headline");
          var ring = d.getElementById("op-ring");
          var ringLabel = d.getElementById("op-ring-label");
          var users = Array.prototype.slice.call(d.querySelectorAll("#op-grid .op-user"));
          var card = d.getElementById("op-card");
          var scopeChip = d.getElementById("op-scope-chip");
          var caps = Array.prototype.slice.call(d.querySelectorAll("#op-caps .op-cap"));
          var reach = d.getElementById("op-reach");
          var flare = d.getElementById("op-ring-flare");
          var hq = d.getElementById("op-hq");
          var hqFlash = d.getElementById("op-hq-flash");
          var hqStrike = d.getElementById("op-hq-strike");
          var verdict = d.getElementById("op-verdict");

          var tl = gsap.timeline({ paused: true });

          // t=0 pins — state is a pure function of timeline time (check_initial_state).
          tl.set([kicker, headline], { opacity: 0, y: 26 }, 0);
          tl.set(ring, { opacity: 0, scale: 0.97 }, 0);
          tl.set(ringLabel, { opacity: 0 }, 0);
          tl.set(users, { opacity: 0, scale: 0.6 }, 0);
          tl.set(card, { opacity: 0, y: 30 }, 0);
          tl.set(scopeChip, { opacity: 0, y: 14 }, 0);
          tl.set(caps, { opacity: 0, y: 14 }, 0);
          tl.set(reach, { scaleX: 0 }, 0);
          tl.set(flare, { opacity: 0 }, 0);
          tl.set(hq, { opacity: 0, y: 22 }, 0);
          tl.set(hqFlash, { opacity: 0 }, 0);
          tl.set(hqStrike, { scaleX: 0 }, 0);
          tl.set(verdict, { opacity: 0, y: 18 }, 0);

          // 1) The cut lands on "Start with what goes wrong" — the frame builds its ground
          //    plane first: the bounded tenant region, then the directory it holds.
          tl.fromTo(
            [kicker, headline],
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.62, ease: "power3.out", stagger: 0.12 },
            0,
          );
          tl.fromTo(
            ring,
            { opacity: 0, scale: 0.97 },
            { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" },
            0,
          );
          tl.fromTo(
            ringLabel,
            { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "power2.out" },
            0,
          );
          tl.fromTo(
            users,
            { opacity: 0, scale: 0.6 },
            {
              opacity: 1,
              scale: 1,
              duration: 0.5,
              ease: "back.out(1.6)",
              stagger: { each: 0.045, from: "start" },
            },
            0,
          );
          tl.fromTo(
            hq,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            0,
          );

          // 2) "at the tenant level" — the assignment card lands and stamps its scope.
          tl.fromTo(
            card,
            { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            W.tenantLevel,
          );
          tl.fromTo(
            scopeChip,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.7)" },
            W.tenantLevel,
          );

          // 3) "resets passwords and edits profiles" — the two powers arrive on the word.
          tl.fromTo(
            caps,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.22 },
            W.resets,
          );

          // 4) "doesn't stop at the new office" — the reach FLOODS the whole ring.
          tl.fromTo(
            reach,
            { scaleX: 0 },
            { scaleX: 1, duration: 1.5, ease: "power2.inOut" },
            W.noStop,
          );

          // 5) "reach every user in the directory" — the boundary edge flares; the users
          //    the admin can now touch pull toward the reach.
          tl.fromTo(
            flare,
            { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "power2.out" },
            W.reachEvery,
          );
          tl.to(
            users,
            {
              borderColor: "rgba(196,62,28,.55)",
              backgroundColor: "rgba(196,62,28,.22)",
              duration: 0.4,
              ease: "power2.out",
              stagger: { each: 0.02, from: "start" },
            },
            W.reachEvery,
          );

          // 6) "the executives back at headquarters" — the collateral is named: the HQ
          //    cluster flashes and takes the strike.
          tl.fromTo(
            hqFlash,
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power2.out" },
            W.hq,
          );
          tl.to(hq, { scale: 1.05, duration: 0.4, ease: "back.out(2)" }, W.hq);
          tl.fromTo(
            hqStrike,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: "power2.out" },
            W.hq,
          );
          tl.fromTo(
            verdict,
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            W.hq,
          );

          window.__timelines["04-over-privilege"] = tl;
