<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat;
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --border: rgba(9, 31, 46, 0.16);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);
          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #title {
          position: absolute;
          left: 150px;
          top: 95px;
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-size: 2.25cqw;
        }
        #subtitle {
          position: absolute;
          left: 150px;
          top: 153px;
          color: var(--ink-soft);
          font-size: 1.35cqw;
          width: 840px;
        }
        .node {
          position: absolute;
          width: 360px;
          padding: 18px 20px;
          border-radius: 18px;
          background: var(--paper);
          border: 1px solid var(--border);
          box-shadow: var(--shadow);
          transform-origin: 50% 50%;
        }
        .node .h {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-size: 1.6cqw;
        }
        .node .d {
          margin-top: 8px;
          font-size: 1.2cqw;
          color: var(--ink-soft);
          line-height: 1.3;
        }
        #node-unit { left: 150px; top: 300px; }
        #node-group { left: 620px; top: 300px; }
        #node-members { left: 1090px; top: 300px; }
        .edge {
          position: absolute;
          height: 6px;
          border-radius: 6px;
          background: rgba(9, 31, 46, 0.22);
          transform-origin: left center;
        }
        #edge-1 { left: 510px; top: 404px; width: 110px; }
        #edge-2 { left: 980px; top: 404px; width: 110px; }
        .badge {
          position: absolute;
          right: 14px;
          top: 14px;
          width: 40px;
          height: 40px;
          border-radius: 999px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-size: 1.2cqw;
          color: white;
        }
        #ok { background: #389a91; }
        #no { background: #f27356; }
        #two-steps {
          position: absolute;
          left: 1080px;
          top: 530px;
          border-radius: 12px;
          background: #ffe6de;
          border: 1px solid #f27356;
          color: #6c2618;
          padding: 10px 14px;
          font-size: 1.18cqw;
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
        }
      </style>

      <div id="root" data-composition-id="08-reveal-group-scope" data-width="1920" data-height="1080">
        <div id="title">A group is in scope. Its members are not.</div>
        <div id="subtitle">Scope resolves on direct membership only: Unit → Group ✅, but not Group → Members ❌.</div>

        <div class="node" id="node-unit">
          <div class="h">Administrative unit</div>
          <div class="d">Scoped role assignment lands here.</div>
        </div>
        <div class="node" id="node-group">
          <div class="h">Group object</div>
          <div class="d">Direct member of the unit.</div>
          <div id="ok" class="badge">✓</div>
        </div>
        <div class="node" id="node-members">
          <div class="h">Group members</div>
          <div class="d">Two steps removed from the unit.</div>
          <div id="no" class="badge">✕</div>
        </div>

        <div id="edge-1" class="edge"></div>
        <div id="edge-2" class="edge"></div>
        <div id="two-steps">Two steps removed</div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var A = window.__anchors || {};
          var cueGroup = Math.max(1.0, (A.reveal_group_scope || 126.16) - (A.beat8_start || 122.64));
          var cueTwoSteps = Math.max(cueGroup + 0.5, (A.reveal_two_steps || 140.12) - (A.beat8_start || 122.64));

          var tl = gsap.timeline({ paused: true });

          gsap.set(["#title", "#subtitle", "#node-unit", "#node-group", "#node-members"], { opacity: 0, y: 18, scale: 0.96 });
          gsap.set(["#edge-1", "#edge-2"], { scaleX: 0, opacity: 0.55 });
          gsap.set(["#ok", "#no", "#two-steps"], { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" });

          tl.to("#title", { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 0.2);
          tl.to("#subtitle", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.45);
          tl.to("#node-unit", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.75);
          tl.to("#edge-1", { scaleX: 1, duration: 0.45, ease: "none" }, 1.15);

          tl.to("#node-group", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, cueGroup - 0.35);
          tl.to("#ok", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, cueGroup);

          tl.to("#edge-2", { scaleX: 1, duration: 0.45, ease: "none" }, cueTwoSteps - 0.6);
          tl.to("#node-members", { opacity: 0.55, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, cueTwoSteps - 0.45);
          tl.to("#no", { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)" }, cueTwoSteps - 0.05);
          tl.to("#edge-2", { opacity: 0.22, duration: 0.2, ease: "power2.out" }, cueTwoSteps);
          tl.to("#two-steps", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, cueTwoSteps + 0.05);
          tl.to("#node-members", { x: -6, duration: 0.08, yoyo: true, repeat: 3, ease: "power1.inOut" }, cueTwoSteps + 0.1);

          window.__timelines["08-reveal-group-scope"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
