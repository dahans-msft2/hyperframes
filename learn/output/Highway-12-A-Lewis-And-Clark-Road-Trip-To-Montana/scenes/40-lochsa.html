        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
/* =============================================================================
   Learn-ILT KIT FOUNDATION  —  single source of truth for every kit block.
   -----------------------------------------------------------------------------
   Every block in templates/blocks/ opens its <style> with a VERBATIM copy of
   this file (between the two BEGIN/END markers), then adds only block-specific
   rules that REFERENCE these tokens + primitives. That is what makes a chart, a
   spec list, a flowchart and a lower-third feel like one kit instead of seven
   islands: shared tokens, one type scale, one ground-swap, shared primitives.

   NAMING (every kit block file + its data-composition-id + its __timelines key
   share ONE name):  <category>-<variant>  — lowercase, hyphen-separated.
     category = the scene archetype (what kind of scene it is)
     variant  = the specific style within that archetype
   Current categories: stat- (single big number/count-up), chart- (multi-point
   data viz), list- (enumerated rows), diagram- (nodes + relationships),
   title- (title card), section- (segment divider), code- (code window),
   callout- (key-point card), media- (screenshot / screen recording in a window),
   lower-third- (name/role overlay). Reserved: quote-, compare-.
   e.g. stat-progress, stat-count, chart-bar, chart-line, list-specs,
   diagram-flow, media-screenshot, lower-third-bar.

   AUTHORING RULES (the "one consistent approach"):
     1. Never hardcode a brand colour, font, radius, or ground gradient in a
        block. Read a token. If you need a value that isn't here, add it here.
     2. Never size text in px. Use the --fs-* scale (cqw) so type scales with the
        mount container and can never regress below the --fs-micro floor (~24px).
     3. CONTRAST LAW: text is ALWAYS var(--ink) or var(--ink-soft). Accents
        (var(--accent*)) colour GRAPHICS only — bars, lines, fills, borders,
        chips, rules — never text.
     4. Ground is chosen by the host via  #root[data-ground="…"]  (default
        content-wash). Each ground layers the deck's real exported PNG
        (assets/grounds/ground-<name>.png, copied into the project like fonts)
        OVER a CSS-gradient fallback — if the PNG is absent (standalone preview),
        the gradient shows. dark-field is CSS-only (no PNG) and flips ink to white
        automatically — do not special-case it in a block.
     5. The host owns scene lifetime. A block never hides/fades its own #root on
        exit; register the paused timeline on window.__timelines[<id>] and stop.
   ============================================================================= */

/* ---- reset ---------------------------------------------------------------- */
#root,
#root *,
#root *::before,
#root *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ---- #root: tokens + container ------------------------------------------- */
#root {
  position: absolute;
  inset: 0;
  overflow: hidden;
  container-type: size; /* 1cqw = 1% of width = 19.2px at 1920 */

  /* palette — content-wash (default ground). data-ground overrides below. */
  --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
  --ink: #091f2e; /* all text */
  --ink-soft: #59636e; /* secondary text */
  --paper: #ffffff; /* panel / card fill */
  --paper-veil: rgba(255, 255, 255, 0.9); /* translucent panel on a busy ground */
  --border: rgba(9, 31, 46, 0.16);
  --border-soft: rgba(9, 31, 46, 0.12);
  --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

  /* accents — GRAPHICS ONLY, never text */
  --accent: #8661c5; /* purple  (primary)   */
  --accent-2: #0078d4; /* blue    (secondary) */
  --accent-3: #389a91; /* teal    (tertiary)  */
  --accent-4: #bf3ac4; /* magenta (quaternary)*/
  --accent-ink: #ffffff; /* text that sits ON an accent fill (chips/badges)   */

  /* type — cqw scale (never px in a block). ~value at 1920 wide in comments.  */
  --fs-display: 11cqw; /* ~211px  hero stat / count-up                        */
  --fs-h1: 4.6cqw; /* ~88px   title-card headline                         */
  --fs-h2: 3.4cqw; /* ~65px   scene title / subject                       */
  --fs-h3: 2.4cqw; /* ~46px   block headline                              */
  --fs-lead: 2cqw; /* ~38px   lead / large label                          */
  --fs-body: 1.75cqw; /* ~34px   body / row label                           */
  --fs-caption: 1.5cqw; /* ~29px   caption / value                            */
  --fs-kicker: 1.55cqw; /* ~30px   eyebrow / kicker                           */
  --fs-micro: 1.25cqw; /* ~24px   FLOOR — nothing smaller than this          */

  /* rhythm */
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 999px;
  --stroke: 5px; /* chart line / connector weight */
  --rule: 3px; /* accent underline weight       */

  font-family: "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: var(--ground);
}

#root[data-ground="hero-swoosh"] {
  /* warm paper with a stronger purple sweep — css fallback of the PNG swoosh */
  --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
}
#root[data-ground="section-field"] {
  /* the deck's pale "background-gradient" export — cool blue wash */
  --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
}
#root[data-ground="dark-field"] {
  /* the dramatic exception: near-black navy, WHITE ink. css-only (no PNG). */
  --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.72);
  --paper: rgba(255, 255, 255, 0.08);
  --paper-veil: rgba(255, 255, 255, 0.1);
  --border: rgba(255, 255, 255, 0.24);
  --border-soft: rgba(255, 255, 255, 0.14);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

/* ---- shared primitives ---------------------------------------------------- */
/* Type roles — a block composes these instead of inventing a size each time.  */
.ilt-kicker {
  font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
  font-weight: 600;
  font-size: var(--fs-kicker);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.ilt-title {
  font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
  font-weight: 600;
  font-size: var(--fs-h2);
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.ilt-headline {
  font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
  font-weight: 600;
  font-size: var(--fs-h3);
  line-height: 1.12;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.ilt-body {
  font-weight: 400;
  font-size: var(--fs-body);
  line-height: 1.3;
  color: var(--ink);
}
.ilt-caption {
  font-weight: 400;
  font-size: var(--fs-caption);
  line-height: 1.3;
  color: var(--ink-soft);
}
.ilt-value {
  font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
  font-weight: 600;
  font-size: var(--fs-caption);
  letter-spacing: -0.01em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.ilt-display {
  font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
  font-weight: 600;
  font-size: var(--fs-display);
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* Surfaces */
.ilt-panel {
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.ilt-panel--veil {
  background: var(--paper-veil);
}
.ilt-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  padding: 0.5em 1.1em;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-pill);
  font-size: var(--fs-micro);
  font-weight: 600;
  color: var(--ink);
  background: var(--paper-veil);
}

/* Accents-as-graphics */
.ilt-rule {
  /* accent underline bar — a graphic, never text colour */
  height: var(--rule);
  border-radius: var(--rule);
  background: var(--accent);
}
.ilt-tab {
  /* vertical accent tab (lower-thirds, callouts) */
  width: var(--rule);
  border-radius: var(--rule);
  background: var(--accent);
}
/* SVG helpers: stroke:var(--accent) for lines, stroke:var(--border-soft) for axes */
.ilt-axis {
  stroke: var(--border-soft);
  stroke-width: 2;
  fill: none;
}

          <div class="hw-chapter-tab"></div>
          <div class="ilt-kicker">Leg 3 · US-12 and the Lochsa</div>

        <div class="hw-card" id="s40-card0" style="left: 1164px; top: 252px;">
          <div class="hw-card-media"><img class="hw-card-img" id="s40-cardimg0" src="assets/media/img/lochsa.png" alt="" /></div>
          <div class="hw-card-body">

            <div class="ilt-headline">US-12 · the Lewis and Clark Highway</div>
            <div class="ilt-caption">Along the Clearwater, then the Lochsa — “rough water” in the Nez Perce language.</div>

        <div class="hw-chip-abs" id="s40-chip0" style="left: 96px; top: 852px; width: 640px;"><b>~100 roadless miles</b> · forest, whitewater and hot springs at the pavement’s edge</div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Cue clock. anchors.js (tools/word_anchors.py <- transcript.json) is the source of
          // truth; W maps each cue to a SCENE-RELATIVE spoken-word time. FALLBACK holds the same
          // numbers frozen at author time, used only if anchors.js is absent (standalone preview).
          var A = (typeof window !== "undefined" && window.__anchors) || {};
          var SCENE_START = typeof A["beatLochsa"] === "number" ? A["beatLochsa"] : 170.09;
          var FALLBACK = {
            beatLochsa: 0.0,
            lochsa: 11.29,
            roadless: 14.18,
          };
          var W = {};
          Object.keys(FALLBACK).forEach(function (k) {
            W[k] = typeof A[k] === "number" ? Math.max(0, Math.round((A[k] - SCENE_START) * 1000) / 1000) : FALLBACK[k];
          });
          // B: scene-open choreography, measured from this scene's own boundary (not from speech).
          var B = { b0: 0 };

          var tl = gsap.timeline({ paused: true });
          // Pin every arriving element hidden at t=0 — children inherit opacity:1, so an
          // unpinned element is fully drawn the moment the beat opens (check_initial_state.py).
          [
            "#s40-card0",
            "#s40-chip0",
            "#s40-chapter",
            "#s40-marker",
            "#s40-ring-seattle",
            "#s40-ring-vantage",
            "#s40-ring-clarkston",
            "#s40-ring-lochsa",
            "#s40-ring-lolo",
            "#s40-ring-bighole",
            "#s40-ring-travelers",
            "#s40-ring-missoula",
            "#s40-ring-flathead",
            "#s40-ring-glacier",
            "#s40-dot-lochsa",
            "#s40-dot-lolo",
            "#s40-dot-bighole",
            "#s40-dot-travelers",
            "#s40-dot-missoula",
            "#s40-dot-flathead",
            "#s40-dot-glacier",
            "#s40-lbl-lochsa",
            "#s40-lbl-lolo",
            "#s40-lbl-bighole",
            "#s40-lbl-travelers",
            "#s40-lbl-missoula",
            "#s40-lbl-flathead",
            "#s40-lbl-glacier"
          ].forEach((s) => tl.set(s, { opacity: 0 }, 0));

          // Waypoints already reached earlier in the drive stay lit from frame one.
          ["#s40-dot-seattle", "#s40-lbl-seattle", "#s40-dot-vantage", "#s40-lbl-vantage", "#s40-dot-clarkston", "#s40-lbl-clarkston"].forEach((s) => tl.set(s, { opacity: 1 }, 0));

          // Route legs: dash-drawn from their own measured length, so the SAME map SVG
          // (identical viewBox + waypoint coordinates) is reused verbatim in every journey scene.
          var LEGS = ["leg1", "leg2", "leg3", "leg4", "leg5", "leg6", "leg7", "leg8"];
          var DONE = ["leg1", "leg2"];
          var LEN = {};
          LEGS.forEach(function (name) {
            var el = document.getElementById("s40-" + name);
            var L = el.getTotalLength();
            LEN[name] = L;
            el.style.strokeDasharray = L + " " + L;
            tl.set(el, { strokeDashoffset: DONE.indexOf(name) >= 0 ? 0 : L }, 0);
          });

          var mourn = document.getElementById("s40-mourn");
          var mournLen = mourn.getTotalLength();
          tl.set(mourn, { opacity: 0 }, 0);

          // The marker rides the head of the growing line: a proxy tween whose progress is read
          // back onto the path with getPointAtLength — deterministic and seek-safe.
          var marker = document.getElementById("s40-marker");
          function rideLeg(name, at, dur) {
            var el = document.getElementById("s40-" + name);
            var L = LEN[name];
            var head = { v: 0 };
            function place() {
              var p = el.getPointAtLength(L * head.v);
              marker.setAttribute("transform", "translate(" + p.x + "," + p.y + ")");
            }
            place();
            tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "none" }, at);
            tl.to(head, { v: 1, duration: dur, ease: "none", onUpdate: place }, at);
            tl.to(marker, { opacity: 1, duration: 0.4, ease: "power2.out" }, at);
          }

          // Camera: one slow, continuous push toward this leg's region. The map performs; it never idles.
          var cam = document.getElementById("s40-cam");
          tl.fromTo(
            cam,
            { x: -370.88, y: -223.0, scale: 1.34, svgOrigin: "0 0" },
            { x: -426.08, y: -262.33, scale: 1.41, svgOrigin: "0 0", duration: 25.6, ease: "none" },
            0
          );

          tl.to("#s40-chapter", { opacity: 1, duration: 0.5, ease: "power2.out" }, B.b0 + 0.2);

          rideLeg("leg3", W.beatLochsa, 11.3);
          tl.to(marker, { opacity: 0, duration: 0.45, ease: "power2.in" }, W.lochsa);

          // Card 0 pops beside the route on its spoken word, settles with a soft overshoot, holds.
          tl.fromTo("#s40-card0", { opacity: 0, scale: 0.9, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: 0.72, ease: "back.out(1.5)", immediateRender: false }, W.lochsa);
          tl.fromTo("#s40-cardimg0", { scale: 1 }, { scale: 1.07, duration: 13.0, ease: "none", immediateRender: false }, W.lochsa);
          tl.to("#s40-dot-lochsa", { opacity: 1, duration: 0.35, ease: "power2.out" }, W.lochsa);
          tl.to("#s40-lbl-lochsa", { opacity: 1, duration: 0.45, ease: "power2.out" }, W.lochsa);
          tl.fromTo("#s40-ring-lochsa", { opacity: 0.55, scale: 1 }, { opacity: 0, scale: 2.6, duration: 1.1, ease: "power2.out", immediateRender: false }, W.lochsa);
          tl.fromTo("#s40-chip0", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, W.roadless);

          window.__timelines["40-lochsa"] = tl;
        })();
      </script>
    </template>
