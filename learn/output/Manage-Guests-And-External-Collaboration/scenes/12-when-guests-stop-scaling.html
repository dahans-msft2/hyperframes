<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: list-select (peer items, ONE lifted + a count callout). ===
           The choose-one / compare-and-pick beat: a small set of peers cascades in, then the
           selected row rises with an accent tab while the rest recede, and a count reads up.
           Built on the kit foundation: tokens only, no hardcoded colours/fonts/px type.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitives used by this block ---- */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-ls-wrap {
          position: absolute;
        }
        #mk-ls-head {
          display: flex;
          align-items: baseline;
          gap: 0.7em;
          margin-bottom: 3cqw;
          opacity: 0;
        }
        /* count numeral: a Segoe Semibold figure. tabular so the count-up doesn't jitter. */
        #mk-ls-count {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1;
          letter-spacing: -0.02em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        #mk-ls-count-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-lead);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        .mk-ls-row {
          position: relative;
          display: flex;
          align-items: center;
          gap: 1.4cqw;
          padding: 1.5cqw 2cqw;
          border-radius: var(--radius);
          border: 1.5px solid var(--border-soft);
          background: var(--paper-veil);
          opacity: 0;
        }
        .mk-ls-row + .mk-ls-row {
          margin-top: 1.1cqw;
        }
        /* the accent tab that marks the selected row — a graphic (never text colour) */
        .mk-ls-tab {
          position: absolute;
          left: 0;
          top: 12%;
          bottom: 12%;
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
          transform: scaleY(0);
          transform-origin: center;
        }
        .mk-ls-marker {
          flex: none;
          width: 1.5cqw;
          height: 1.5cqw;
          border-radius: var(--radius-pill);
          border: 2px solid var(--border);
          background: transparent;
        }
        .mk-ls-row.is-selected .mk-ls-marker {
          border-color: var(--accent);
          background: var(--accent);
        }
        .mk-ls-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.14;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        .mk-ls-detail {
          margin-top: 0.3cqw;
          opacity: 0;
        }
        /* the strain meter: how the guest-by-guest row degrades as the partnership grows.
           Segments are accent fills (a graphic); the caption beside them stays ink-soft. */
        #ls-strain {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-top: 0.9cqw;
          opacity: 0;
        }
        .ls-strain-seg {
          width: 96px;
          height: 8px;
          border-radius: var(--radius-pill);
          background: var(--border-soft);
          overflow: hidden;
        }
        .ls-strain-fill {
          width: 100%;
          height: 100%;
          border-radius: var(--radius-pill);
          background: var(--accent-4);
          transform-origin: left center;
        }
        #ls-strain-label {
          margin-left: 6px;
          font-weight: 400;
          font-size: var(--fs-micro);
          color: var(--ink-soft);
          white-space: nowrap;
          opacity: 0;
        }
        #ls-close {
          position: absolute;
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="12-when-guests-stop-scaling"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <div id="mk-ls-wrap">
          <div id="mk-ls-head">
            <span id="mk-ls-count">0</span>
            <span id="mk-ls-count-label"></span>
          </div>
          <div id="mk-ls-rows"></div>
        </div>
        <div id="ls-close"></div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 211.81;
          var ABS = {
            "b9Start": 211.81,
            "b9OneAtATime": 213.51,
            "b9Fixed": 216.48,
            "b9Standing": 218.28,
            "b9Hundreds": 220.51,
            "b9Burden": 225.32,
            "b9Mto": 227.9,
            "b9Members": 231.86,
            "b9Skill": 235.72
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          /* B9 — two peer strategies; the resolver lifts. The strain meter is what earns the
             lift: the learner watches guest-by-guest degrade before the alternative appears. */
          var CONFIG = {
            kicker: "When guests stop scaling",
            items: [
              {
                label: "Invite guests, one project at a time",
                detail: "Works for a fixed group of people.",
              },
              {
                label: "Multitenant Organization",
                detail: "Synchronizes users as members \u2014 not guests you invite one by one.",
              },
            ],
            selectedIndex: 1,
            countLabel: "ways to work with a partner",
            close: "Spotting that shift is the skill \u2014 configuring it is a separate job.",
            x: 340,
            width: 1240,
          };

          var wrap = document.getElementById("mk-ls-wrap");
          var rowsHost = document.getElementById("mk-ls-rows");
          var countEl = document.getElementById("mk-ls-count");
          var closeEl = document.getElementById("ls-close");
          var items = CONFIG.items;
          var n = items.length;

          document.getElementById("mk-ls-count-label").textContent = CONFIG.countLabel;
          closeEl.textContent = CONFIG.close;

          items.forEach(function (it, i) {
            var row = document.createElement("div");
            row.id = "mk-ls-row-" + i;
            row.className = "mk-ls-row" + (i === CONFIG.selectedIndex ? " is-selected" : "");

            var tab = document.createElement("div");
            tab.className = "mk-ls-tab";
            tab.id = "mk-ls-tab-" + i;
            row.appendChild(tab);

            var marker = document.createElement("div");
            marker.className = "mk-ls-marker";
            row.appendChild(marker);

            var text = document.createElement("div");
            var label = document.createElement("div");
            label.className = "mk-ls-label";
            label.textContent = it.label;
            text.appendChild(label);
            var detail = document.createElement("div");
            detail.id = "mk-ls-detail-" + i;
            detail.className = "ilt-caption mk-ls-detail";
            detail.textContent = it.detail;
            text.appendChild(detail);

            /* the strain meter belongs to the guest-by-guest row only */
            if (i === 0) {
              var strain = document.createElement("div");
              strain.id = "ls-strain";
              for (var s = 0; s < 3; s++) {
                var seg = document.createElement("div");
                seg.className = "ls-strain-seg";
                var fill = document.createElement("div");
                fill.id = "ls-strain-fill-" + s;
                fill.className = "ls-strain-fill";
                seg.appendChild(fill);
                strain.appendChild(seg);
              }
              var slabel = document.createElement("span");
              slabel.id = "ls-strain-label";
              slabel.textContent = "Maintenance burden";
              strain.appendChild(slabel);
              text.appendChild(strain);
            }

            row.appendChild(text);
            rowsHost.appendChild(row);
          });

          wrap.style.left = CONFIG.x + "px";
          wrap.style.width = CONFIG.width + "px";
          rowsHost.querySelectorAll(".mk-ls-row").forEach(function (r) {
            r.style.width = CONFIG.width + "px";
          });

          requestAnimationFrame(function () {
            var h = wrap.getBoundingClientRect().height;
            var top = Math.round((1080 - h) / 2) - 40;
            wrap.style.top = top + "px";
            closeEl.style.left = CONFIG.x + "px";
            closeEl.style.width = CONFIG.width + "px";
            closeEl.style.top = top + h + 58 + "px";
          });

          var tl = gsap.timeline({ paused: true });

          /* t=0 pins */
          gsap.set("#mk-ls-head", { opacity: 0, y: 20 });
          gsap.set("#ls-strain", { opacity: 0 });
          gsap.set("#ls-strain-label", { opacity: 0 });
          gsap.set(".ls-strain-fill", { scaleX: 0 });
          gsap.set(closeEl, { opacity: 0, y: 16 });
          for (var i = 0; i < n; i++) {
            gsap.set(document.getElementById("mk-ls-row-" + i), { opacity: 0, x: -30 });
            gsap.set(document.getElementById("mk-ls-detail-" + i), { opacity: 0, y: 10 });
            gsap.set(document.getElementById("mk-ls-tab-" + i), { scaleY: 0 });
          }

          /* "One last judgment call." */
          tl.to("#mk-ls-head", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b9Start);
          var counter = { v: 0 };
          tl.to(
            counter,
            {
              v: n,
              duration: 0.5,
              ease: "power1.out",
              onUpdate: function () {
                countEl.textContent = Math.round(counter.v);
              },
            },
            W.b9Start
          );

          /* "Inviting analysts one project at a time..." */
          tl.to("#mk-ls-row-0", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b9OneAtATime);
          /* "...works for a fixed group." */
          tl.to("#mk-ls-detail-0", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, W.b9Fixed);

          /* "But if this becomes a standing partnership..." — the strain begins. */
          tl.to("#ls-strain", { opacity: 1, duration: 0.35, ease: "power2.out" }, W.b9Standing);
          tl.to("#ls-strain-fill-0", { scaleX: 1, duration: 0.5, ease: "power2.out" }, W.b9Standing);
          /* "...hundreds of people, changing constantly..." */
          tl.to("#ls-strain-fill-1", { scaleX: 1, duration: 0.5, ease: "power2.out" }, W.b9Hundreds);
          /* "...those individual invitations become a maintenance burden." */
          tl.to("#ls-strain-fill-2", { scaleX: 1, duration: 0.5, ease: "power2.out" }, W.b9Burden);
          tl.to("#ls-strain-label", { opacity: 1, duration: 0.4, ease: "power2.out" }, W.b9Burden + 0.3);

          /* "That's when a Multitenant Organization fits" — it arrives AND lifts on the same
             words, because the alternative is the answer, not a peer to weigh. */
          var sel = CONFIG.selectedIndex;
          tl.to("#mk-ls-row-" + sel, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b9Mto);
          tl.to("#mk-ls-row-0", { opacity: 0.4, duration: 0.6, ease: "power2.out" }, W.b9Mto + 0.3);
          tl.to(
            "#mk-ls-row-" + sel,
            { scale: 1.04, boxShadow: "0 14px 40px rgba(9,31,46,.16)", duration: 0.55, ease: "power3.out" },
            W.b9Mto + 0.3
          );
          tl.to("#mk-ls-tab-" + sel, { scaleY: 1, duration: 0.45, ease: "power2.out" }, W.b9Mto + 0.35);

          /* "...it synchronizes users as members, not guests you invite one by one." */
          tl.to("#mk-ls-detail-" + sel, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, W.b9Members);

          /* "Spotting that shift is the skill; configuring it is a separate job." */
          tl.to(closeEl, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b9Skill);

          window.__timelines["12-when-guests-stop-scaling"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
