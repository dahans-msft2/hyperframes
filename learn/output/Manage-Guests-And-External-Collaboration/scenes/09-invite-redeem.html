<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: console-status (a status panel; one row flips pending→passed). ===
           The operational-evidence beat: portal-like check rows with status pills populate,
           then the blocking row flips from pending to passed — readiness checks, approval flows,
           troubleshooting, pass/fail outcomes.
           Built on the kit foundation: tokens only, no hardcoded colours/fonts/px type.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitives used by this block ---- */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-cs-panel {
          position: absolute;
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          overflow: hidden;
          opacity: 0;
        }
        #mk-cs-title-bar {
          display: flex;
          align-items: center;
          gap: 0.8cqw;
          padding: 1.5cqw 2.2cqw;
          border-bottom: 1.5px solid var(--border-soft);
        }
        /* window dots — a chrome graphic; neutral so they never fight the status colours */
        .mk-cs-dot {
          width: 0.9cqw;
          height: 0.9cqw;
          border-radius: var(--radius-pill);
          background: var(--border);
        }
        #mk-cs-title {
          margin-left: 0.6cqw;
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        .mk-cs-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 2cqw;
          padding: 1.6cqw 2.2cqw;
          opacity: 0;
        }
        .mk-cs-row + .mk-cs-row {
          border-top: 1.5px solid var(--border-soft);
        }
        .mk-cs-label {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.2;
          color: var(--ink);
        }
        /* status pills — the fill/border is a GRAPHIC; pill text rides ON the fill via
           --accent-ink (sanctioned for chips/badges) or stays --ink-soft on the outline pill. */
        .mk-cs-pillwrap {
          position: relative;
          flex: none;
          display: inline-grid;
        }
        .mk-cs-pill {
          grid-area: 1 / 1;
          display: inline-flex;
          align-items: center;
          gap: 0.5em;
          padding: 0.5em 1.1em;
          border-radius: var(--radius-pill);
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-micro);
          white-space: nowrap;
        }
        .mk-cs-pill {
          grid-area: 1 / 1;
          display: inline-flex;
          align-items: center;
          gap: 0.55em;
          padding: 0.5em 1.1em;
          border-radius: var(--radius-pill);
          border: 1.5px solid var(--border);
          background: var(--paper-veil);
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-micro);
          white-space: nowrap;
          color: var(--ink); /* label is ALWAYS ink; the status colour lives on the dot (a graphic) */
        }
        /* status dot — a filled graphic, never text, so the accent colour never carries a glyph */
        .mk-cs-dot-status {
          flex: none;
          width: 0.8em;
          height: 0.8em;
          border-radius: var(--radius-pill);
          background: var(--border);
        }
        .mk-cs-pill--pass {
          border-color: var(--accent-3);
        }
        .mk-cs-pill--pass .mk-cs-dot-status {
          background: var(--accent-3);
        }
        .mk-cs-pill--fail {
          border-color: var(--accent-4);
        }
        .mk-cs-pill--fail .mk-cs-dot-status {
          background: var(--accent-4);
        }
        .mk-cs-pill--pending {
          color: var(--ink-soft);
        }
        .mk-cs-pill--pending .mk-cs-dot-status {
          background: transparent;
          border: 2px solid var(--border);
        }

        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        #mk-cs-foot {
          position: absolute;
          text-align: center;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="09-invite-redeem"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <div id="mk-cs-panel">
          <div id="mk-cs-title-bar">
            <span class="mk-cs-dot"></span>
            <span class="mk-cs-dot"></span>
            <span class="mk-cs-dot"></span>
            <span id="mk-cs-title"></span>
          </div>
          <div id="mk-cs-rows"></div>
        </div>
        <div id="mk-cs-foot" class="ilt-caption"></div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 146.47;
          var ABS = {
            "b6Start": 146.47,
            "b6Sends": 149.2,
            "b6SendsEnd": 151.08,
            "b6Redeem": 154.08,
            "b6Appears": 157.16,
            "b6NoIdentity": 161.67
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          /* B6 — a status the SYSTEM performs, not a procedure the learner runs. The pending row
             flips on the word "redeems", which is the only moment in the film where something
             changes state on its own (design-plan.md). */
          var CONFIG = {
            title: "B2B invitation",
            rows: [
              { label: "Invitation sent to an external email address", status: "pass" },
              { label: "Analyst redeems with their own account", status: "pending" },
              { label: "Guest object created in your directory", status: "pass" },
            ],
            flipIndex: 1,
            foot: "No Relecloud identity to create or maintain.",
            x: 400,
            width: 1120,
          };

          var STATUS = {
            pass: { cls: "mk-cs-pill--pass", text: "Done" },
            fail: { cls: "mk-cs-pill--fail", text: "Failed" },
            pending: { cls: "mk-cs-pill--pending", text: "Pending" },
          };

          function makePill(kind, label) {
            var s = STATUS[kind];
            var pill = document.createElement("span");
            pill.className = "mk-cs-pill " + s.cls;
            var dot = document.createElement("span");
            dot.className = "mk-cs-dot-status";
            var t = document.createElement("span");
            t.textContent = label || s.text; /* the WORD is ink; the colour is the dot + border */
            pill.appendChild(dot);
            pill.appendChild(t);
            return pill;
          }

          var panel = document.getElementById("mk-cs-panel");
          var rowsHost = document.getElementById("mk-cs-rows");
          var foot = document.getElementById("mk-cs-foot");
          document.getElementById("mk-cs-title").textContent = CONFIG.title;
          panel.style.left = CONFIG.x + "px";
          panel.style.width = CONFIG.width + "px";
          foot.style.left = CONFIG.x + "px";
          foot.style.width = CONFIG.width + "px";

          CONFIG.rows.forEach(function (r, i) {
            var row = document.createElement("div");
            row.className = "mk-cs-row";
            row.id = "mk-cs-row-" + i;

            var label = document.createElement("div");
            label.className = "mk-cs-label";
            label.textContent = r.label;
            row.appendChild(label);

            var wrap = document.createElement("div");
            wrap.className = "mk-cs-pillwrap";
            if (i === CONFIG.flipIndex) {
              wrap.setAttribute("data-layout-allow-overlap", ""); // stacked pills cross-fade on flip
              var pending = makePill("pending", "Pending");
              pending.id = "mk-cs-pending-" + i;
              var pass = makePill("pass", "Redeemed");
              pass.id = "mk-cs-pass-" + i;
              wrap.appendChild(pending);
              wrap.appendChild(pass);
            } else {
              wrap.appendChild(makePill(r.status, i === 0 ? "Sent" : "Created"));
            }
            row.appendChild(wrap);
            rowsHost.appendChild(row);
          });

          requestAnimationFrame(function () {
            var h = panel.getBoundingClientRect().height;
            var top = Math.round((1080 - h) / 2) - 40;
            panel.style.top = top + "px";
            foot.style.top = top + h + 56 + "px";
          });

          var tl = gsap.timeline({ paused: true });

          /* t=0 pins — both pill states live in the DOM at all times, so a seek to any frame
             renders the correct one rather than whichever the last tween left behind. */
          gsap.set(panel, { opacity: 0, y: 26 });
          gsap.set(foot, { opacity: 0, y: 16 });
          gsap.set("#mk-cs-row-0", { opacity: 0, x: 24 });
          gsap.set("#mk-cs-row-1", { opacity: 0, x: 24 });
          gsap.set("#mk-cs-row-2", { opacity: 0, x: 24 });
          gsap.set("#mk-cs-pass-1", { opacity: 0, scale: 0.7 });

          /* "With that set, inviting is simple." */
          tl.to(panel, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, W.b6Start);

          /* "A coordinator sends an invitation to an external email address." */
          tl.to("#mk-cs-row-0", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b6Sends);
          /* the pending row arrives at the END of that clause, so the wait is visible before
             it resolves — the flip needs something to flip FROM. */
          tl.to("#mk-cs-row-1", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b6SendsEnd);

          /* "The analyst redeems it by signing in with their own account" — the flip. */
          tl.to("#mk-cs-pending-1", { opacity: 0, duration: 0.3, ease: "power1.out" }, W.b6Redeem);
          tl.to("#mk-cs-pass-1", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, W.b6Redeem + 0.05);

          /* "...and a guest object appears in your directory" */
          tl.to("#mk-cs-row-2", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b6Appears);

          /* "...no Relecloud identity to create or maintain." */
          tl.to(foot, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b6NoIdentity);

          window.__timelines["09-invite-redeem"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
