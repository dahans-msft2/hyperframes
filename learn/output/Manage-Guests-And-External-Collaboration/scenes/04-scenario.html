<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: callout-note (key-point / note / definition card). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink.
           A panel + a left accent tab is the callout marker (mirrors lower-third-bar);
           the glyph + tab are the only accent-coloured graphics — all text stays ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-body {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.3;
          color: var(--ink);
        }
        .ilt-panel {
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-tab {
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #root .cn-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .cn-card {
          display: flex;
          align-items: stretch;
          width: 46cqw; /* body wraps to 1–2 lines at the kit type scale */
          overflow: hidden; /* clips the tab wipe + rounds the tab's left corners */
          will-change: transform, opacity;
        }
        #root .cn-tab {
          width: 0.6cqw; /* wider than the --rule default for a callout marker */
          border-radius: 0;
          flex-shrink: 0;
        }
        #root .cn-body {
          padding: 2.4cqw 2.8cqw 2.6cqw 2.4cqw;
          display: flex;
          flex-direction: column;
          gap: 1cqw;
        }
        #root .cn-label-row {
          display: flex;
          align-items: center;
          gap: 0.9cqw;
        }
        #root .cn-glyph {
          width: 2.4cqw;
          height: 2.4cqw;
          flex-shrink: 0;
        }
        #root .cn-glyph path {
          stroke: var(--accent); /* accent = graphic, not text */
          fill: none;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        /* The dark field's `--ink-soft` (white @ 72%) lands at 4.43:1 on the ground's lightest
           radial stop (#365F7D) — under AA. Lifted to 86% (~5.5:1) for this beat only. Still
           white ink; no new colour, no palette change. */
        #root[data-ground="dark-field"] {
          --ink-soft: rgba(255, 255, 255, 0.86);
        }
        #root .cn-card {
          width: 54cqw; /* the hook card owns more of the frame than a mid-scene note */
        }
        #root .cn-body {
          gap: 1.3cqw;
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.35;
          color: var(--ink-soft);
        }
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }
        #cn-scope {
          align-self: flex-start;
          opacity: 0;
        }
        /* the scope dot is the graphic; the chip's words stay ink */
        #cn-scope-dot {
          width: 0.62em;
          height: 0.62em;
          border-radius: var(--radius-pill);
          background: var(--accent-3);
          flex: none;
        }
        #cn-divider {
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--border);
          transform-origin: left center;
          margin: 0.4cqw 0;
        }
        #cn-stem {
          opacity: 0;
        }
        #cn-predict {
          align-self: flex-start;
          margin-top: 0.6cqw;
          border-color: var(--accent);
          opacity: 0;
        }
        #cn-predict-dot {
          width: 0.62em;
          height: 0.62em;
          border-radius: var(--radius-pill);
          background: var(--accent);
          flex: none;
        }
      </style>

      <div
        id="root"
        data-composition-id="04-scenario"
        data-ground="dark-field"
        data-width="1920"
        data-height="1080"
      >
        <div class="cn-wrap">
          <div id="cn-card" class="cn-card ilt-panel">
            <div id="cn-tab" class="cn-tab ilt-tab"></div>
            <div class="cn-body">
              <div id="cn-label-row" class="cn-label-row">
                <svg class="cn-glyph" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 18h6" />
                  <path d="M10 22h4" />
                  <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1v.2h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z" />
                </svg>
                <div id="cn-label" class="ilt-kicker"></div>
              </div>
              <div id="cn-body-text" class="ilt-body"></div>
              <div id="cn-scope" class="ilt-chip">
                <span id="cn-scope-dot"></span><span id="cn-scope-text"></span>
              </div>
              <div id="cn-divider"></div>
              <div id="cn-stem" class="ilt-caption"></div>
              <div id="cn-term" class="ilt-headline"></div>
              <div id="cn-predict" class="ilt-chip">
                <span id="cn-predict-dot"></span><span id="cn-predict-text"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 31.19;
          var ABS = {
            "b1Start": 31.19,
            "b1Setup": 33.87,
            "b1OnlyThat": 37.27,
            "b1RealQuestion": 40.71,
            "b1Moment": 43.41,
            "b1Question": 46.01,
            "b1Predict": 49.43
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          /* B1 — pose ONE question and refuse to answer it (design-plan.md: curiosity gap).
             Nothing on this card may hint at the answer; the payoff belongs to B3. */
          var CONFIG = {
            label: "The scenario",
            body: "Relecloud's coordinators need Woodgrove Bank's fraud analysts inside one investigation.",
            scope: "That investigation \u2014 and only that",
            stem: "So here's the real question",
            term: "What can a guest see by default?",
            predict: "Predict before we answer",
          };

          document.getElementById("cn-label").textContent = CONFIG.label;
          document.getElementById("cn-body-text").textContent = CONFIG.body;
          document.getElementById("cn-scope-text").textContent = CONFIG.scope;
          document.getElementById("cn-stem").textContent = CONFIG.stem;
          document.getElementById("cn-term").textContent = CONFIG.term;
          document.getElementById("cn-predict-text").textContent = CONFIG.predict;

          var card = document.getElementById("cn-card");
          var tab = document.getElementById("cn-tab");
          var labelRow = document.getElementById("cn-label-row");
          var bodyText = document.getElementById("cn-body-text");
          var scope = document.getElementById("cn-scope");
          var divider = document.getElementById("cn-divider");
          var stem = document.getElementById("cn-stem");
          var term = document.getElementById("cn-term");
          var predict = document.getElementById("cn-predict");

          var tl = gsap.timeline({ paused: true });

          /* t=0 pins — the card is empty of everything before its own spoken cue. */
          gsap.set(card, { opacity: 0, scale: 0.92, y: 24, transformOrigin: "50% 50%" });
          gsap.set(tab, { scaleY: 0, transformOrigin: "50% 0%" });
          gsap.set(divider, { scaleX: 0 });
          gsap.set([labelRow, bodyText, scope, stem, term, predict], { y: 22, opacity: 0 });

          /* "Start with the scenario." */
          tl.to(card, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, W.b1Start);
          tl.to(labelRow, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, W.b1Start + 0.3);

          /* "Relecloud's coordinators need Woodgrove Bank's fraud analysts..." */
          tl.to(bodyText, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, W.b1Setup);

          /* "...inside one investigation — and *only* that." */
          tl.to(scope, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, W.b1OnlyThat);

          /* "So here's the real question" — the card turns: tab wipes, divider draws. */
          tl.to(tab, { scaleY: 1, duration: 0.45, ease: "power2.out" }, W.b1RealQuestion);
          tl.to(divider, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, W.b1RealQuestion);

          /* "The moment you invite one of them as a guest..." */
          tl.to(stem, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, W.b1Moment);

          /* the question itself lands on the words that ask it */
          tl.to(term, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, W.b1Question);

          /* "Take a guess before we answer it." — the predict tag, then stillness. */
          tl.to(predict, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, W.b1Predict);

          window.__timelines["04-scenario"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
