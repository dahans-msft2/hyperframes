<!DOCTYPE html>

  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: callout-note (key-point / note / definition card). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink.
           A panel + a left accent tab is the callout marker (mirrors lower-third-bar);
           the glyph + tab are the only accent-coloured graphics — all text stays ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-body {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.3;
          color: var(--ink);
        }
        .ilt-panel {
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-tab {
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #root .cn-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .cn-card {
          display: flex;
          align-items: stretch;
          width: 46cqw; /* body wraps to 1–2 lines at the kit type scale */
          overflow: hidden; /* clips the tab wipe + rounds the tab's left corners */
          will-change: transform, opacity;
        }
        #root .cn-tab {
          width: 0.6cqw; /* wider than the --rule default for a callout marker */
          border-radius: 0;
          flex-shrink: 0;
        }
        #root .cn-body {
          padding: 2.4cqw 2.8cqw 2.6cqw 2.4cqw;
          display: flex;
          flex-direction: column;
          gap: 1cqw;
        }
        #root .cn-label-row {
          display: flex;
          align-items: center;
          gap: 0.9cqw;
        }
        #root .cn-glyph {
          width: 2.4cqw;
          height: 2.4cqw;
          flex-shrink: 0;
        }
        #root .cn-glyph path {
          stroke: var(--accent); /* accent = graphic, not text */
          fill: none;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        #root .cn-card {
          width: 52cqw;
        }
        #root .cn-body {
          gap: 1.2cqw;
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }
        /* the two surfaces, side by side, joined by a rule that draws between them. The rule
           IS the teaching claim ("same record"), so it is a graphic, not a caption. */
        #cn-surfaces {
          display: flex;
          align-items: center;
          gap: 0;
        }
        .cn-surface {
          opacity: 0;
        }
        #cn-link {
          flex: none;
          width: 88px;
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
          margin: 0 14px;
          transform-origin: left center;
        }
        .cn-surface-dot {
          flex: none;
          width: 0.62em;
          height: 0.62em;
          border-radius: var(--radius-pill);
          background: var(--accent-2);
        }
        #cn-body-text {
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="10-one-object-two-surfaces"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <div class="cn-wrap">
          <div id="cn-card" class="cn-card ilt-panel">
            <div id="cn-tab" class="cn-tab ilt-tab"></div>
            <div class="cn-body">
              <div id="cn-label-row" class="cn-label-row">
                <svg class="cn-glyph" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 18h6" />
                  <path d="M10 22h4" />
                  <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1v.2h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z" />
                </svg>
                <div id="cn-label" class="ilt-kicker"></div>
              </div>
              <div id="cn-term" class="ilt-headline"></div>
              <div id="cn-surfaces">
                <span id="cn-surface-0" class="cn-surface ilt-chip">
                  <span class="cn-surface-dot"></span><span id="cn-surface-0-text"></span>
                </span>
                <span id="cn-link"></span>
                <span id="cn-surface-1" class="cn-surface ilt-chip">
                  <span class="cn-surface-dot"></span><span id="cn-surface-1-text"></span>
                </span>
              </div>
              <div id="cn-body-text" class="ilt-body"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 163.59;
          var ABS = {
            "b7Start": 163.59,
            "b7TwoPlaces": 167.59,
            "b7Entra": 169.21,
            "b7M365": 173.18,
            "b7SameRecord": 177.83,
            "b7NotCopy": 182.15
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          /* B7 — one DEFINITIONAL fact, not a decision: the same object, seen twice.
             The connecting rule is what makes it a definition rather than a list of two. */
          var CONFIG = {
            label: "Key point",
            term: "One guest object \u00b7 two surfaces",
            surfaces: ["Microsoft Entra admin center", "Microsoft 365 \u2014 Guest users"],
            body: "Same record, two surfaces \u2014 not a copy, and not a second account to reconcile.",
          };

          document.getElementById("cn-label").textContent = CONFIG.label;
          document.getElementById("cn-term").textContent = CONFIG.term;
          document.getElementById("cn-surface-0-text").textContent = CONFIG.surfaces[0];
          document.getElementById("cn-surface-1-text").textContent = CONFIG.surfaces[1];
          document.getElementById("cn-body-text").textContent = CONFIG.body;

          var card = document.getElementById("cn-card");
          var tab = document.getElementById("cn-tab");
          var labelRow = document.getElementById("cn-label-row");
          var term = document.getElementById("cn-term");
          var surface0 = document.getElementById("cn-surface-0");
          var surface1 = document.getElementById("cn-surface-1");
          var link = document.getElementById("cn-link");
          var bodyText = document.getElementById("cn-body-text");

          var tl = gsap.timeline({ paused: true });

          /* t=0 pins */
          gsap.set(card, { opacity: 0, scale: 0.92, y: 24, transformOrigin: "50% 50%" });
          gsap.set(tab, { scaleY: 0, transformOrigin: "50% 0%" });
          gsap.set(link, { scaleX: 0 });
          gsap.set([labelRow, term, surface0, surface1, bodyText], { y: 22, opacity: 0 });

          /* "Here's a point that trips people up." */
          tl.to(card, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, W.b7Start);
          tl.to(tab, { scaleY: 1, duration: 0.45, ease: "power2.out" }, W.b7Start + 0.3);
          tl.to(labelRow, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, W.b7Start + 0.4);

          /* "That one guest object shows up in two places" */
          tl.to(term, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, W.b7TwoPlaces);

          /* "...beside your members in the Microsoft Entra admin center..." */
          tl.to(surface0, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, W.b7Entra);
          /* "...and in the Guest users list in the Microsoft 365 admin center." */
          tl.to(surface1, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, W.b7M365);

          /* "Same record, two surfaces" — the rule draws BETWEEN the two chips. This is the
             payoff of the beat, so it is the only accent motion in the scene. */
          tl.to(link, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, W.b7SameRecord);

          /* "...not a *copy*, not a second account to reconcile." */
          tl.to(bodyText, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, W.b7NotCopy);

          window.__timelines["10-one-object-two-surfaces"] = tl;
        })();
      </script>
    </template>
  </body>
