<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: title-hero (opening title card — kicker + 2-line title + subtitle). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-rule {
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-th-group {
          position: absolute;
          left: 184px;
          top: 50%;
          width: 1250px; /* left ~65% of a 1920 frame, generous right margin */
          transform: translateY(-50%);
        }
        #mk-th-title {
          font-size: var(--fs-h1); /* title-card headline — up to the h1 tier */
          margin-top: 2.4cqw;
        }
        #mk-th-line {
          display: block;
        }
        #mk-th-rule {
          width: 104px; /* graphic underline bar (accent = graphic, not text) */
          margin: 2.6cqw 0 0;
          transform-origin: left center;
        }
        #mk-th-subtitle {
          margin-top: 2.4cqw;
          font-size: var(--fs-lead);
          line-height: 1.3;
          color: var(--ink-soft);
        }

        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        /* the kit block ships `#mk-th-line` (an id) for markup that uses the `mk-th-line`
           class, so the two title lines never actually become blocks. Fixed here. */
        .mk-th-line {
          display: block;
        }
      </style>

      <div
        id="root"
        data-composition-id="02-title"
        data-ground="hero-swoosh"
        data-width="1920"
        data-height="1080"
      >
        <div id="mk-th-group">
          <div id="mk-th-kicker" class="ilt-kicker"></div>
          <div id="mk-th-title" class="ilt-title">
            <span id="mk-th-line1" class="mk-th-line"></span>
            <span id="mk-th-line2" class="mk-th-line"></span>
          </div>
          <div id="mk-th-rule" class="ilt-rule"></div>
          <div id="mk-th-subtitle"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 3.03;
          var ABS = {
            "titleStart": 3.03,
            "titleSubtitle": 7.9,
            "titleTail": 11.64
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          // Opening title card. Text from script.md -> "Chrome text" (02-title).
          var CONFIG = {
            kicker: "Provision and govern identities in Microsoft Entra",
            titleLine1: "Manage Guests &",
            titleLine2: "External Collaboration",
            subtitle: "Let partners in \u2014 without opening up the directory.",
          };

          var kicker = document.getElementById("mk-th-kicker");
          var line1 = document.getElementById("mk-th-line1");
          var line2 = document.getElementById("mk-th-line2");
          var rule = document.getElementById("mk-th-rule");
          var subtitle = document.getElementById("mk-th-subtitle");

          kicker.textContent = CONFIG.kicker;
          line1.textContent = CONFIG.titleLine1;
          line2.textContent = CONFIG.titleLine2;
          subtitle.textContent = CONFIG.subtitle;

          var tl = gsap.timeline({ paused: true });

          // t=0 state is pinned so the card is never "already drawn" when the scene opens.
          gsap.set(kicker, { opacity: 0, y: 24 });
          gsap.set([line1, line2], { opacity: 0, y: 44 });
          gsap.set(rule, { scaleX: 0 });
          gsap.set(subtitle, { opacity: 0, y: 22 });

          // kicker + title land on the first spoken words of the video.
          tl.to(kicker, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, W.titleStart);
          tl.to([line1, line2], { opacity: 1, y: 0, duration: 0.85, ease: "power3.out", stagger: 0.14 }, W.titleStart + 0.3);
          tl.to(rule, { scaleX: 1, duration: 0.7, ease: "power2.out" }, W.titleStart + 1.1);

          // the subtitle arrives on "Let outside partners in".
          tl.to(subtitle, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, W.titleSubtitle);

          // the accent rule extends as the sentence closes ("...the run of your directory") —
          // a graphic mark, so the card is never static for longer than the 5.0s budget.
          tl.to(rule, { width: 188, duration: 1.8, ease: "power2.inOut" }, W.titleTail);

          window.__timelines["02-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
