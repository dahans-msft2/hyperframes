<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: steps-list (numbered how-to process, staggered top→down). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitive used by this block ---- */
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft); /* detail — secondary ink */
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-st-col {
          position: absolute;
        }
        /* the connector: a thin vertical line linking the badges (a graphic) */
        #mk-st-connector {
          position: absolute;
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--border-soft); /* soft border — ground-aware graphic */
          transform-origin: top center;
        }
        .mk-st-row {
          position: relative;
          display: flex;
          align-items: center;
          opacity: 0; /* revealed by the timeline */
        }
        .mk-st-badge {
          flex: none;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: var(--radius-pill);
          background: var(--accent); /* accent fill = graphic */
          box-shadow: var(--shadow);
        }
        .mk-st-num {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          letter-spacing: -0.01em;
          color: var(--accent-ink); /* numeral SITS ON the accent fill — allowed */
          font-variant-numeric: tabular-nums;
        }
        .mk-st-text {
          display: flex;
          flex-direction: column;
          gap: 0.35cqw;
        }
        .mk-st-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink); /* step title — primary ink */
        }

        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        #mk-st-head {
          position: absolute;
          display: flex;
          align-items: baseline;
          gap: 1.3cqw;
        }
        #mk-st-kicker {
          opacity: 0;
        }
        #mk-st-count-wrap {
          display: inline-flex;
          align-items: baseline;
          gap: 0.45em;
          opacity: 0;
        }
        #mk-st-count {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1;
          letter-spacing: -0.02em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        #mk-st-count-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-lead);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        .mk-st-detail {
          margin-top: 0.45cqw;
          opacity: 0;
        }
        /* the gotcha: a bordered note. The border + dot are the graphic; the words are ink. */
        #mk-st-note {
          position: absolute;
          display: inline-flex;
          align-items: center;
          gap: 0.7em;
          padding: 0.6em 1.2em;
          border: 1.5px solid var(--accent-4);
          border-radius: var(--radius-pill);
          background: var(--paper);
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-micro);
          color: var(--ink);
          white-space: nowrap;
          opacity: 0;
        }
        #mk-st-note-dot {
          flex: none;
          width: 0.62em;
          height: 0.62em;
          border-radius: var(--radius-pill);
          background: var(--accent-4);
        }
      </style>

      <div
        id="root"
        data-composition-id="08-delegate-two-pieces"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <div id="mk-st-head">
          <span id="mk-st-kicker" class="ilt-kicker"></span>
          <span id="mk-st-count-wrap">
            <span id="mk-st-count">0</span>
            <span id="mk-st-count-label"></span>
          </span>
        </div>
        <div id="mk-st-col">
          <div id="mk-st-connector"></div>
        </div>
        <div id="mk-st-note">
          <span id="mk-st-note-dot"></span><span id="mk-st-note-text"></span>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 121.39;
          var ABS = {
            "b5Start": 121.39,
            "b5TwoPieces": 123.7,
            "b5First": 126.09,
            "b5OnlyPower": 129.79,
            "b5Second": 133.63,
            "b5Setting": 136.35,
            "b5Skip": 141.19,
            "b5Nothing": 144.42
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          /* B5 — an ORDERED, both-required procedure. The teaching point is that step 2 is not
             optional, so step 2's badge is the focal object (design-plan.md). */
          var CONFIG = {
            kicker: "Least privilege, delegated",
            countLabel: "pieces, not one",
            steps: [
              {
                title: "Assign the Guest Inviter role",
                detail: "Its only power is sending invitations.",
              },
              {
                title: "Set the tenant's invite setting",
                detail: "\u201cOnly users assigned to specific admin roles can invite guest users\u201d",
              },
            ],
            note: "Skip the second piece and everyone can still invite \u2014 the role changes nothing.",
            badge: 104,
            gap: 36,
            rowGap: 92,
            textWidth: 1120,
            x: 260,
          };

          var col = document.getElementById("mk-st-col");
          var head = document.getElementById("mk-st-head");
          var kickerEl = document.getElementById("mk-st-kicker");
          var countWrap = document.getElementById("mk-st-count-wrap");
          var countEl = document.getElementById("mk-st-count");
          var connector = document.getElementById("mk-st-connector");
          var note = document.getElementById("mk-st-note");
          var steps = CONFIG.steps;
          var n = steps.length;

          kickerEl.textContent = CONFIG.kicker;
          document.getElementById("mk-st-count-label").textContent = CONFIG.countLabel;
          document.getElementById("mk-st-note-text").textContent = CONFIG.note;

          steps.forEach(function (s, i) {
            var row = document.createElement("div");
            row.id = "mk-st-row-" + i;
            row.className = "mk-st-row";
            row.style.gap = CONFIG.gap + "px";
            if (i > 0) row.style.marginTop = CONFIG.rowGap + "px";

            var badge = document.createElement("div");
            badge.id = "mk-st-badge-" + i;
            badge.className = "mk-st-badge";
            badge.style.width = CONFIG.badge + "px";
            badge.style.height = CONFIG.badge + "px";
            var num = document.createElement("span");
            num.className = "mk-st-num";
            num.textContent = i + 1;
            badge.appendChild(num);
            row.appendChild(badge);

            var text = document.createElement("div");
            text.className = "mk-st-text";
            text.style.width = CONFIG.textWidth + "px";
            var title = document.createElement("div");
            title.className = "mk-st-title";
            title.textContent = s.title;
            text.appendChild(title);
            var detail = document.createElement("div");
            detail.id = "mk-st-detail-" + i;
            detail.className = "ilt-caption mk-st-detail";
            detail.textContent = s.detail;
            text.appendChild(detail);
            row.appendChild(text);

            col.appendChild(row);
          });

          var colH = n * CONFIG.badge + (n - 1) * CONFIG.rowGap;
          var colTop = Math.round((1080 - colH) / 2) + 16;
          col.style.left = CONFIG.x + "px";
          col.style.top = colTop + "px";
          head.style.left = CONFIG.x + "px";
          head.style.top = colTop - 108 + "px";
          note.style.left = CONFIG.x + "px";
          note.style.top = colTop + colH + 74 + "px";

          connector.style.left = Math.round(CONFIG.badge / 2 - 1.5) + "px";
          connector.style.top = Math.round(CONFIG.badge / 2) + "px";
          connector.style.height = colH - CONFIG.badge + "px";

          var tl = gsap.timeline({ paused: true });

          /* t=0 pins */
          gsap.set(kickerEl, { opacity: 0, y: 18 });
          gsap.set(countWrap, { opacity: 0, y: 18 });
          gsap.set(connector, { scaleY: 0 });
          gsap.set(note, { opacity: 0, y: 18 });
          for (var i = 0; i < n; i++) {
            gsap.set(document.getElementById("mk-st-row-" + i), { opacity: 0, x: -40 });
            gsap.set(document.getElementById("mk-st-badge-" + i), { scale: 0.35 });
            gsap.set(document.getElementById("mk-st-detail-" + i), { opacity: 0, y: 10 });
          }

          /* "The least-privileged path takes..." */
          tl.to(kickerEl, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b5Start);

          /* "...*two* pieces, not one." — the count and the spine commit to two before either
             one arrives, so the learner is watching for the second (Signaling). */
          tl.to(countWrap, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b5TwoPieces);
          var counter = { v: 0 };
          tl.to(
            counter,
            {
              v: n,
              duration: 0.5,
              ease: "power1.out",
              onUpdate: function () {
                countEl.textContent = Math.round(counter.v);
              },
            },
            W.b5TwoPieces
          );
          tl.to(connector, { scaleY: 1, duration: W.b5Second - W.b5TwoPieces, ease: "none" }, W.b5TwoPieces);

          /* "First, assign coordinators the Guest Inviter role" */
          tl.to("#mk-st-row-0", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.b5First);
          tl.to("#mk-st-badge-0", { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, W.b5First + 0.05);
          /* "Its only power is sending invitations." */
          tl.to("#mk-st-detail-0", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, W.b5OnlyPower);

          /* "Second, set the tenant's invite setting..." */
          tl.to("#mk-st-row-1", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.b5Second);
          tl.to("#mk-st-badge-1", { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, W.b5Second + 0.05);
          /* the verbatim portal label lands on the words that quote it */
          tl.to("#mk-st-detail-1", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, W.b5Setting);

          /* "Skip that second piece, and everyone can still invite..." */
          tl.to(note, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b5Skip);

          /* "...so the role changes nothing." — step 2's badge is the thing that mattered. */
          tl.to("#mk-st-badge-1", { scale: 1.12, duration: 0.5, ease: "power2.out" }, W.b5Nothing);
          tl.to("#mk-st-badge-1", { scale: 1.06, duration: 0.8, ease: "power2.inOut" }, W.b5Nothing + 0.6);

          window.__timelines["08-delegate-two-pieces"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
