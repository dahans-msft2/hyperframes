<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: list-select (peer items, ONE lifted + a count callout). ===
           The choose-one / compare-and-pick beat: a small set of peers cascades in, then the
           selected row rises with an accent tab while the rest recede, and a count reads up.
           Built on the kit foundation: tokens only, no hardcoded colours/fonts/px type.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitives used by this block ---- */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-ls-wrap {
          position: absolute;
        }
        #mk-ls-head {
          display: flex;
          align-items: baseline;
          gap: 0.7em;
          margin-bottom: 3cqw;
          opacity: 0;
        }
        /* count numeral: a Segoe Semibold figure. tabular so the count-up doesn't jitter. */
        #mk-ls-count {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1;
          letter-spacing: -0.02em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        #mk-ls-count-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-lead);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        .mk-ls-row {
          position: relative;
          display: flex;
          align-items: center;
          gap: 1.4cqw;
          padding: 1.5cqw 2cqw;
          border-radius: var(--radius);
          border: 1.5px solid var(--border-soft);
          background: var(--paper-veil);
          opacity: 0;
        }
        .mk-ls-row + .mk-ls-row {
          margin-top: 1.1cqw;
        }
        /* the accent tab that marks the selected row — a graphic (never text colour) */
        .mk-ls-tab {
          position: absolute;
          left: 0;
          top: 12%;
          bottom: 12%;
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
          transform: scaleY(0);
          transform-origin: center;
        }
        .mk-ls-marker {
          flex: none;
          width: 1.5cqw;
          height: 1.5cqw;
          border-radius: var(--radius-pill);
          border: 2px solid var(--border);
          background: transparent;
        }
        .mk-ls-row.is-selected .mk-ls-marker {
          border-color: var(--accent);
          background: var(--accent);
        }
        .mk-ls-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.14;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .mk-ls-detail {
          margin-top: 0.3cqw;
        }

        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        /* the row detail is the answer to B1's question, so it is pinned separately from its
           row and revealed on its own spoken words rather than with the row. */
        .mk-ls-detail {
          margin-top: 0.3cqw;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="06-permission-levels"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <div id="mk-ls-wrap">
          <div id="mk-ls-head">
            <span id="mk-ls-count">0</span>
            <span id="mk-ls-count-label"></span>
          </div>
          <div id="mk-ls-rows"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 73.73;
          var ABS = {
            "b3Start": 73.73,
            "b3ThreeLevels": 75.95,
            "b3Same": 77.71,
            "b3Limited": 81.05,
            "b3Browsing": 83.83,
            "b3Restrictive": 87.25,
            "b3OwnProfile": 89.58,
            "b3NoMemberships": 93.64,
            "b3ForAnalysts": 95.71,
            "b3DefaultFit": 98.68
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          /* B3 — the PAYOFF for B1's question. Three peers; the default lifts.
             Nothing here may fire before B3: this scene starts at the beat boundary. */
          var CONFIG = {
            kicker: "Guest permission levels",
            items: [
              { label: "Same access as members", detail: "The most inclusive level." },
              {
                label: "Limited access (default)",
                detail: "Stops a guest from browsing your users and groups.",
              },
              {
                label: "Most restrictive",
                detail: "Their own profile only \u2014 no other users, no groups, not even their own memberships.",
              },
            ],
            selectedIndex: 1,
            countLabel: "levels",
            x: 300,
            width: 1320,
          };

          var wrap = document.getElementById("mk-ls-wrap");
          var rowsHost = document.getElementById("mk-ls-rows");
          var countEl = document.getElementById("mk-ls-count");
          var countLabelEl = document.getElementById("mk-ls-count-label");
          var items = CONFIG.items;
          var n = items.length;

          countLabelEl.textContent = CONFIG.countLabel;

          items.forEach(function (it, i) {
            var row = document.createElement("div");
            row.id = "mk-ls-row-" + i;
            row.className = "mk-ls-row" + (i === CONFIG.selectedIndex ? " is-selected" : "");

            var tab = document.createElement("div");
            tab.className = "mk-ls-tab";
            tab.id = "mk-ls-tab-" + i;
            row.appendChild(tab);

            var marker = document.createElement("div");
            marker.className = "mk-ls-marker";
            row.appendChild(marker);

            var text = document.createElement("div");
            var label = document.createElement("div");
            label.className = "mk-ls-label";
            label.textContent = it.label;
            text.appendChild(label);
            if (it.detail) {
              var detail = document.createElement("div");
              detail.id = "mk-ls-detail-" + i;
              detail.className = "ilt-caption mk-ls-detail";
              detail.textContent = it.detail;
              text.appendChild(detail);
            }
            row.appendChild(text);
            rowsHost.appendChild(row);
          });

          wrap.style.left = CONFIG.x + "px";
          wrap.style.width = CONFIG.width + "px";
          rowsHost.querySelectorAll(".mk-ls-row").forEach(function (r) {
            r.style.width = CONFIG.width + "px";
          });

          /* centre the block vertically once layout settles (kit behaviour) */
          requestAnimationFrame(function () {
            var h = wrap.getBoundingClientRect().height;
            wrap.style.top = Math.round((1080 - h) / 2) + "px";
          });

          var tl = gsap.timeline({ paused: true });

          /* t=0 pins */
          gsap.set("#mk-ls-head", { opacity: 0, y: 20 });
          for (var i = 0; i < n; i++) {
            gsap.set(document.getElementById("mk-ls-row-" + i), { opacity: 0, x: -30 });
            gsap.set(document.getElementById("mk-ls-detail-" + i), { opacity: 0, y: 10 });
            gsap.set(document.getElementById("mk-ls-tab-" + i), { scaleY: 0 });
          }

          /* "Back to what a guest can see." */
          tl.to("#mk-ls-head", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b3Start);

          /* "There are three levels." — the count reads up as the number is spoken. */
          var counter = { v: 0 };
          tl.to(
            counter,
            {
              v: n,
              duration: 0.7,
              ease: "power1.out",
              onUpdate: function () {
                countEl.textContent = Math.round(counter.v);
              },
            },
            W.b3ThreeLevels
          );

          /* one row per level; each detail waits for the clause that explains it */
          tl.to("#mk-ls-row-0", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b3Same);
          tl.to("#mk-ls-detail-0", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, W.b3Same + 0.35);

          tl.to("#mk-ls-row-1", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b3Limited);
          tl.to("#mk-ls-detail-1", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, W.b3Browsing);

          tl.to("#mk-ls-row-2", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b3Restrictive);
          tl.to("#mk-ls-detail-2", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, W.b3OwnProfile);

          /* "not even their own memberships" — the tightest clause gets a beat of its own on the
             row it belongs to, so the scene never sits still for the 5.0s budget. */
          tl.to("#mk-ls-row-2", { scale: 1.015, duration: 0.5, ease: "power2.out" }, W.b3NoMemberships);
          tl.to("#mk-ls-row-2", { scale: 1, duration: 0.6, ease: "power2.inOut" }, W.b3NoMemberships + 0.7);

          /* "For analysts here, for one project..." — the peers recede a beat BEFORE the lift,
             so the scene keeps moving through the clause that sets up its own payoff. */
          tl.to("#mk-ls-row-0", { opacity: 0.62, duration: 0.6, ease: "power2.out" }, W.b3ForAnalysts);
          tl.to("#mk-ls-row-2", { opacity: 0.62, duration: 0.6, ease: "power2.out" }, W.b3ForAnalysts);

          /* "For analysts here for one project, that default fits." — the lift. This is the
             answer B1 withheld; it is deliberately the last thing to move in the scene. */
          var sel = CONFIG.selectedIndex;
          tl.to("#mk-ls-row-0", { opacity: 0.4, duration: 0.5, ease: "power2.out" }, W.b3DefaultFit);
          tl.to("#mk-ls-row-2", { opacity: 0.4, duration: 0.5, ease: "power2.out" }, W.b3DefaultFit);
          tl.to(
            "#mk-ls-row-" + sel,
            { scale: 1.04, boxShadow: "0 14px 40px rgba(9,31,46,.16)", duration: 0.55, ease: "power3.out" },
            W.b3DefaultFit
          );
          tl.to("#mk-ls-tab-" + sel, { scaleY: 1, duration: 0.45, ease: "power2.out" }, W.b3DefaultFit + 0.05);

          window.__timelines["06-permission-levels"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
