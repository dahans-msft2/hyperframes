<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: diagram-layers (concentric planes around a core). ===
           The containment / nesting / boundary beat: outside-in scopes settle around a
           protected core, each ring labelled, the core glowing last — inheritance, trust
           boundaries, layered protection, management scope.
           Built on the kit foundation: tokens only, no hardcoded colours/fonts/px type.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitives used by this block ---- */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-dl-stage {
          position: absolute;
          inset: 0;
        }
        /* a concentric ring: a bordered translucent plane, centred, labelled at its top edge. */
        .mk-dl-ring {
          position: absolute;
          left: var(--cx, 50%);
          top: 50%;
          transform: translate(-50%, -50%);
          border: 2px solid var(--border);
          border-radius: 28px;
          background: var(--paper-veil);
          box-shadow: var(--shadow);
        }
        .mk-dl-ring-label {
          position: absolute;
          top: 0;
          left: 50%;
          transform: translate(-50%, -50%);
          padding: 0.35em 1.1em;
          border-radius: var(--radius-pill);
          border: 1.5px solid var(--border);
          background: var(--paper);
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-caption);
          letter-spacing: 0.02em;
          color: var(--ink);
          white-space: nowrap;
        }
        /* the protected core — an accent-bordered panel; its label sits ON no fill, stays ink. */
        #mk-dl-core {
          position: absolute;
          left: var(--cx, 50%);
          top: 50%;
          transform: translate(-50%, -50%);
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 1.4cqw 2cqw;
          border: 2.5px solid var(--accent);
          border-radius: 20px;
          background: var(--paper);
          box-shadow: 0 0 0 0 rgba(134, 97, 197, 0);
        }
        #mk-dl-core-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.1;
          letter-spacing: -0.015em;
          color: var(--ink);
        }

        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.35;
          color: var(--ink-soft);
        }
        #dl-kicker {
          position: absolute;
          left: 160px;
          top: 92px;
          opacity: 0;
        }
        /* the right-hand read column: what each boundary actually does. Kept clear of the
           concentric stage so the rings never collide with the text. */
        #dl-notes {
          position: absolute;
          left: 1300px;
          top: 300px;
          width: 470px;
          display: flex;
          flex-direction: column;
          gap: 52px;
        }
        .dl-note {
          opacity: 0;
        }
        .dl-note-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.14;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .dl-note-body {
          margin-top: 10px;
        }
        #dl-before {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          margin-top: 14px;
          padding: 0.45em 1.05em;
          border: 1.5px solid var(--accent-3);
          border-radius: var(--radius-pill);
          background: var(--paper);
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-micro);
          color: var(--ink); /* words stay ink; teal is the border + dot */
          white-space: nowrap;
          opacity: 0;
        }
        #dl-before-dot {
          flex: none;
          width: 0.6em;
          height: 0.6em;
          border-radius: var(--radius-pill);
          background: var(--accent-3);
        }
        /* the core carries the two things you actually govern with a partner tenant */
        #mk-dl-core {
          flex-direction: column;
          gap: 14px;
          padding: 2cqw 2.2cqw;
        }
        .dl-core-detail {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.25;
          color: var(--ink-soft);
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="11-restriction-levers"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <div id="dl-kicker" class="ilt-kicker">Two more levers</div>
        <div id="mk-dl-stage" data-keep-in-frame></div>
        <div id="dl-notes">
          <div id="dl-note-0" class="dl-note">
            <div class="dl-note-title">Domain lists</div>
            <div id="dl-before"><span id="dl-before-dot"></span><span>Before any invitation is sent</span></div>
            <div id="dl-note-0-body" class="ilt-caption dl-note-body">
              Permit a partner's domain &mdash; block consumer email outright.
            </div>
          </div>
          <div id="dl-note-1" class="dl-note">
            <div class="dl-note-title">Cross-tenant access</div>
            <div class="ilt-caption dl-note-body">
              A layer deeper: trust with one specific partner tenant.
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 185.17;
          var ABS = {
            "b8Start": 185.17,
            "b8DomainLists": 188.29,
            "b8Before": 190.71,
            "b8Permit": 193.63,
            "b8CrossTenantSettings": 197.87,
            "b8CrossTenant": 199.49,
            "b8Governing": 201.25,
            "b8Mfa": 205.47,
            "b8Apps": 209.06
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          /* B8 — nested boundaries. The narration literally says "a layer deeper", so the rings
             must settle OUTSIDE-IN and the core must be last (design-plan.md). */
          var CONFIG = {
            layers: [{ label: "Domain lists" }, { label: "Cross-tenant access" }],
            core: "Partner-tenant trust",
            coreDetails: [
              "Which multifactor claims you trust from them",
              "Which of your apps their users can reach",
            ],
            outer: 820,
            step: 200,
            coreSize: 440,
            cx: 700, /* stage centre, left of the read column at x=1300 */
          };

          var stage = document.getElementById("mk-dl-stage");
          var kicker = document.getElementById("dl-kicker");
          var before = document.getElementById("dl-before");
          stage.style.setProperty("--cx", CONFIG.cx + "px");

          CONFIG.layers.forEach(function (layer, i) {
            var size = CONFIG.outer - i * CONFIG.step;
            var ring = document.createElement("div");
            ring.className = "mk-dl-ring";
            ring.id = "mk-dl-ring-" + i;
            ring.style.width = size + "px";
            ring.style.height = size + "px";
            ring.style.zIndex = 10 + i;

            var label = document.createElement("div");
            label.className = "mk-dl-ring-label";
            label.textContent = layer.label;
            ring.appendChild(label);

            stage.appendChild(ring);
          });

          var core = document.createElement("div");
          core.id = "mk-dl-core";
          core.style.width = CONFIG.coreSize + "px";
          core.style.zIndex = 100;
          var coreLabel = document.createElement("div");
          coreLabel.id = "mk-dl-core-label";
          coreLabel.textContent = CONFIG.core;
          core.appendChild(coreLabel);
          CONFIG.coreDetails.forEach(function (d, i) {
            var el = document.createElement("div");
            el.id = "dl-core-detail-" + i;
            el.className = "dl-core-detail";
            el.textContent = d;
            core.appendChild(el);
          });
          stage.appendChild(core);

          var tl = gsap.timeline({ paused: true });

          /* t=0 pins. The rings and the core are centred by a CSS percentage translate; it is
             restated as xPercent/yPercent so GSAP owns the whole transform when it scales them. */
          gsap.set(kicker, { opacity: 0, y: 16 });
          gsap.set(".mk-dl-ring", { xPercent: -50, yPercent: -50, opacity: 0, scale: 1.12 });
          gsap.set(core, { xPercent: -50, yPercent: -50, opacity: 0, scale: 0.6 });
          gsap.set(".dl-note", { opacity: 0, x: 26 });
          gsap.set(before, { opacity: 0, y: 12 });
          gsap.set(".dl-core-detail", { opacity: 0, y: 10 });

          /* "Two more levers tighten the outer edges." */
          tl.to(kicker, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b8Start);

          /* "Allow and deny domain lists" — the OUTER boundary, first. */
          tl.to("#mk-dl-ring-0", { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, W.b8DomainLists);
          tl.to("#dl-note-0", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b8DomainLists + 0.25);

          /* "...act before any invitation is sent." */
          tl.to(before, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, W.b8Before);

          /* "Permit a partner's domain, block consumer email outright." */
          tl.to("#dl-note-0-body", { opacity: 1, duration: 0.45, ease: "power2.out" }, W.b8Permit);

          /* "Cross-tenant access settings..." — the inner ring arrives as it is named... */
          tl.to("#mk-dl-ring-1", { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, W.b8CrossTenantSettings);
          /* "...go a layer deeper" — and the read column explains it on the phrase that means it. */
          tl.to("#dl-note-1", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.b8CrossTenant);

          /* "...governing trust with one specific partner tenant" — the core. */
          tl.to(core, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, W.b8Governing);

          /* the two things that trust actually means, each on its own clause */
          tl.to("#dl-core-detail-0", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, W.b8Mfa);
          tl.to("#dl-core-detail-1", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, W.b8Apps);

          /* the core glow is the payoff mark and lands last */
          tl.to(core, { boxShadow: "0 0 44px 6px rgba(134,97,197,.38)", duration: 0.6, ease: "power2.out" }, W.b8Apps + 0.5);
          tl.to(".mk-dl-ring", { opacity: 0.55, duration: 0.7, ease: "power2.out" }, W.b8Apps + 0.5);

          window.__timelines["11-restriction-levers"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
