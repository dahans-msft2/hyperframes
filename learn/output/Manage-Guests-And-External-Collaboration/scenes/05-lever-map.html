<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: specs-list (label/value rows + accent underline sweep, staggered). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitive used by this block ---- */
        .ilt-rule {
          /* accent underline bar — a graphic, never text colour */
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-sl-col {
          position: absolute;
          display: flex;
          flex-direction: column;
        }
        .mk-sl-row {
          line-height: 1;
          opacity: 0;
        }
        .mk-sl-text {
          display: flex;
          align-items: baseline;
          gap: 22px;
          white-space: nowrap;
        }
        .mk-sl-label {
          font-weight: 600;
          font-size: var(--fs-body);
          letter-spacing: -0.015em;
          color: var(--ink); /* label — primary ink */
        }
        .mk-sl-value {
          font-weight: 400;
          font-size: var(--fs-body);
          letter-spacing: -0.01em;
          color: var(--ink-soft); /* value — secondary ink */
        }
        .mk-sl-line {
          position: relative;
          margin-top: 22px;
          height: var(--rule);
          background: var(--border-soft); /* track — soft border, ground-aware */
          border-radius: 2px;
          overflow: hidden;
        }
        .mk-sl-line-fill {
          position: absolute;
          inset: 0;
          transform-origin: left center;
          /* .ilt-rule supplies the purple accent fill */
        }

        /* ---- scene-specific: composes the kit tokens + primitives above ---- */

        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        #mk-sl-head {
          position: absolute;
          display: flex;
          align-items: baseline;
          gap: 1.4cqw;
        }
        #mk-sl-kicker {
          opacity: 0;
        }
        #mk-sl-count-wrap {
          display: inline-flex;
          align-items: baseline;
          gap: 0.45em;
          opacity: 0;
        }
        #mk-sl-count {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1;
          letter-spacing: -0.02em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        #mk-sl-count-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-lead);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
      </style>

      <div
        id="root"
        data-composition-id="05-lever-map"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <div id="mk-sl-head">
          <span id="mk-sl-kicker" class="ilt-kicker"></span>
          <span id="mk-sl-count-wrap">
            <span id="mk-sl-count">0</span>
            <span id="mk-sl-count-label"></span>
          </span>
        </div>
        <div id="mk-sl-col"></div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- CUE CLOCK -------------------------------------------------------
             Every timeline position in this scene is a REAL spoken-word time from
             transcript.json (resolved by tools/word_anchors.py into anchors.json /
             anchors.js, with the 3.0s bumper lead-in applied), rebased to this
             scene's start on the host timeline. Nothing here is an offset guessed
             from an assumed words-per-second. Re-record => regenerate anchors.js. */
          var SCENE_START = 51.95;
          var ABS = {
            "b2Start": 51.95,
            "b2NotOneSwitch": 53.02,
            "b2Levers": 56.72,
            "b2GetsIn": 60.25,
            "b2HowMuch": 61.54,
            "b2Domains": 62.91,
            "b2Trust": 64.73,
            "b2Together": 69.27
          };
          var W = {};
          (function () {
            var live = (typeof window !== "undefined" && window.__anchors) || {};
            for (var k in ABS) {
              if (!Object.prototype.hasOwnProperty.call(ABS, k)) continue;
              var t = typeof live[k] === "number" ? live[k] : ABS[k];
              W[k] = Math.max(0, Math.round((t - SCENE_START) * 1000) / 1000);
            }
          })();

          /* B2 — five PEER levers, nothing selected. Each row is label -> what it controls,
             which is why this is list-specs and not list-select (design-plan.md). */
          var CONFIG = {
            kicker: "Guest access is not one switch",
            countLabel: "levers",
            rows: [
              { label: "Invitation flow", value: "How a guest gets in" },
              { label: "Permission levels", value: "How much a guest can see" },
              { label: "Domain lists", value: "Which domains you'll invite" },
              { label: "Cross-tenant access", value: "How far you trust a partner tenant" },
              { label: "Self-service sign-up", value: "External users request access themselves" },
            ],
            lineWidth: 1080,
            x: 300,
            rowGap: 48,
          };

          var col = document.getElementById("mk-sl-col");
          var head = document.getElementById("mk-sl-head");
          var kickerEl = document.getElementById("mk-sl-kicker");
          var countWrap = document.getElementById("mk-sl-count-wrap");
          var countEl = document.getElementById("mk-sl-count");
          var n = CONFIG.rows.length;

          kickerEl.textContent = CONFIG.kicker;
          document.getElementById("mk-sl-count-label").textContent = CONFIG.countLabel;

          CONFIG.rows.forEach(function (r, i) {
            var row = document.createElement("div");
            row.id = "mk-sl-row-" + i;
            row.className = "mk-sl-row";
            if (i > 0) row.style.marginTop = CONFIG.rowGap + "px";

            var text = document.createElement("div");
            text.className = "mk-sl-text";
            var label = document.createElement("span");
            label.className = "mk-sl-label";
            label.textContent = r.label;
            text.appendChild(label);
            var value = document.createElement("span");
            value.className = "mk-sl-value";
            value.textContent = r.value;
            text.appendChild(value);
            row.appendChild(text);

            var line = document.createElement("div");
            line.className = "mk-sl-line";
            line.style.width = CONFIG.lineWidth + "px";
            var fill = document.createElement("div");
            fill.id = "mk-sl-fill-" + i;
            fill.className = "mk-sl-line-fill ilt-rule";
            line.appendChild(fill);
            row.appendChild(line);

            col.appendChild(row);
          });

          var colH = n * (46 + 22 + 3) + (n - 1) * CONFIG.rowGap;
          var colTop = Math.round((1080 - colH) / 2) + 38;
          col.style.left = CONFIG.x + "px";
          col.style.top = colTop + "px";
          head.style.left = CONFIG.x + "px";
          head.style.top = colTop - 104 + "px";

          var tl = gsap.timeline({ paused: true });

          /* t=0 pins */
          gsap.set(kickerEl, { opacity: 0, y: 18 });
          gsap.set(countWrap, { opacity: 0, y: 18 });
          for (var i = 0; i < n; i++) {
            gsap.set(document.getElementById("mk-sl-row-" + i), { opacity: 0, x: -36 });
            gsap.set(document.getElementById("mk-sl-fill-" + i), { scaleX: 0 });
          }

          /* "Here's the catch" -> the frame; "Guest access isn't one switch" -> the kicker */
          tl.to(kickerEl, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b2NotOneSwitch);

          /* "It's several levers" -> the count reads up to five BEFORE the rows arrive, so the
             learner knows how many are coming (Signaling). */
          tl.to(countWrap, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.b2Levers);
          var counter = { v: 0 };
          tl.to(
            counter,
            {
              v: n,
              duration: 0.8,
              ease: "power1.out",
              onUpdate: function () {
                countEl.textContent = Math.round(counter.v);
              },
            },
            W.b2Levers
          );

          /* one row per lever, each landing on the words that name it */
          tl.to("#mk-sl-row-0", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.b2GetsIn);
          tl.to("#mk-sl-fill-0", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, W.b2GetsIn + 0.15);
          tl.to("#mk-sl-row-1", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.b2HowMuch);
          tl.to("#mk-sl-fill-1", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, W.b2HowMuch + 0.15);
          tl.to("#mk-sl-row-2", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.b2Domains);
          tl.to("#mk-sl-fill-2", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, W.b2Domains + 0.15);
          tl.to("#mk-sl-row-3", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.b2Trust);
          tl.to("#mk-sl-fill-3", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, W.b2Trust + 0.15);

          /* the fifth lever (self-service sign-up) is never named in the VO; it arrives with
             "Together, they define..." so the promised count of five is honoured on screen. */
          tl.to("#mk-sl-row-4", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.b2Together);
          tl.to("#mk-sl-fill-4", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, W.b2Together + 0.15);
          /* "none of them replaces another" — the whole stack settles as one object */
          tl.to(".mk-sl-row", { x: 6, duration: 0.9, ease: "power2.inOut", stagger: 0.05 }, W.b2Together + 0.3);

          window.__timelines["05-lever-map"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
