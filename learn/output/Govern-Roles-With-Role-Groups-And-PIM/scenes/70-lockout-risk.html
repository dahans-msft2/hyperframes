      <style>
        /* === Learn-ILT kit block: callout-note (key-point / note / definition card). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink.
           A panel + a left accent tab is the callout marker (mirrors lower-third-bar);

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);

          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);

          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;

          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {

          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);

        .ilt-kicker {

        .ilt-headline {

        .ilt-body {

        }
        .ilt-panel {

          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-tab {

          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */


        /* primitives this block's pruned _foundation.css copy omitted, pulled in
           verbatim from templates/blocks/_foundation.css so the scene's added
           elements inherit the kit type scale and contrast rules. */
        .ilt-caption {
          font-weight: 400;

          line-height: 1.3;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #root .cn-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .cn-card {
          display: flex;

          overflow: hidden; /* clips the tab wipe + rounds the tab's left corners */
          will-change: transform, opacity;
        }
        #root .cn-tab {
          width: 0.6cqw; /* wider than the --rule default for a callout marker */
          border-radius: 0;
          flex-shrink: 0;

        #root .cn-body {
          padding: 2.4cqw 2.8cqw 2.6cqw 2.4cqw;

        #root .cn-label-row {

        #root .cn-glyph {
          width: 2.4cqw;
          height: 2.4cqw;

        #root .cn-glyph path {
          stroke: var(--incident); /* the one alarm mark in the video — graphic only */
          fill: none;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        /* --incident is not a kit token: this is the single dramatic beat in the video, and
           the mark is used ONLY on graphics (tab, glyph, dots). No text ever takes it, so
           the contrast law still holds on dark-field. */
        #root {
          --incident: #ff6b6b;
        }
        #root .cn-card {
          width: 54cqw;
        }
        #root .cn-tab {
          background: var(--incident);
        }
        #root #cn-if {
          opacity: 0;
        }
        #root #cn-conds {
          display: flex;
          flex-direction: column;
          gap: 0.6cqw;
        }
        #root .cn-cond {
          display: flex;
          align-items: center;
          gap: 0.8cqw;
          opacity: 0;
        }
        #root .cn-cond-dot {
          flex: none;
          width: 0.7em;
          height: 0.7em;
          border-radius: var(--radius-pill);
          background: var(--incident);
        }
        #root #cn-term {
          opacity: 0;
          color: var(--ink);

        #root #cn-fix {

        #root .cn-fix-line {

          height: 0.7em;
          border-radius: var(--radius-pill);
          background: var(--accent-3);
        }
      </style>

      <div id="root" data-composition-id="70-lockout-risk" data-ground="dark-field" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div class="cn-wrap">
          <div id="cn-card" class="cn-card ilt-panel">
            <div id="cn-tab" class="cn-tab ilt-tab"></div>
            <div class="cn-body">

                  <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1v.2h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z" />
                </svg>
                <div id="cn-label" class="ilt-kicker">Key point</div>

                Policies evaluate signals at sign-in and grant, block, or challenge access before the session begins.

              <div id="cn-if" class="ilt-caption">

              </div>
              <div id="cn-conds">
                <span id="cn-cond-0" class="cn-cond"
                  ><span class="cn-cond-dot"></span
                  ><span class="ilt-caption">Approval is required to activate</span></span
                >
                <span id="cn-cond-1" class="cn-cond"
                  ><span class="cn-cond-dot"></span
                  ><span class="ilt-caption">The approver list is empty</span></span
                >
                <span id="cn-cond-2" class="cn-cond"

                >
              </div>
              <div id="cn-term" class="ilt-headline">Nobody can approve. Nobody gets in.</div>
              <div id="cn-fix">

                </div>
                <div id="cn-fix-1" class="cn-fix-line">
                  <span class="cn-fix-dot"></span>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- word-anchored cue clock -----------------------------------------------
             window.__anchors (anchors.js, generated by tools/word_anchors.py from
             transcript.json) carries REAL spoken-word times. This scene starts on its own
             first spoken word, so every cue below is `anchor - sceneStart` in W — never an
             offset guessed from an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = A.beat_b7;
          if (typeof T0 !== "number") throw new Error("70-lockout-risk: anchors.js not loaded");
          var W = {};
          Object.keys(A).forEach(function (k) {
            W[k] = Math.max(0, Math.round((A[k] - T0) * 1000) / 1000);
          });

          // Edit per use. A Learn-style callout: type label + bold term + a 1–2 line body.
          var CONFIG = {
            label: "Watch out",
            term: "Nobody can approve. Nobody gets in.",
            body: "The fallback only helps if somebody is actually active in one of those roles.",
          };

          document.getElementById("cn-label").textContent = CONFIG.label;
          document.getElementById("cn-term").textContent = CONFIG.term;
          document.getElementById("cn-body-text").textContent = CONFIG.body;

          var card = document.getElementById("cn-card");
          var tab = document.getElementById("cn-tab");
          var labelRow = document.getElementById("cn-label-row");
          var term = document.getElementById("cn-term");
          var bodyText = document.getElementById("cn-body-text");

          var tl = gsap.timeline({ paused: true });

          // Scene-relative, seek-safe: card scales/fades in, the accent tab wipes
          // top→bottom, then label → term → body reveal in a short upward stagger.
          gsap.set(card, { opacity: 0, scale: 0.92, y: 24, transformOrigin: "50% 50%" });
          gsap.set(tab, { scaleY: 0, transformOrigin: "50% 0%" });
          gsap.set([labelRow, bodyText], { y: 22, opacity: 0 });

          tl.to(card, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
          tl.to(tab, { scaleY: 1, duration: 0.45, ease: "power2.out" }, 0.42);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
          tl.to(labelRow, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.55);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself

          /* ---- anchored cues ---------------------------------------------------------
             This is the one dramatic beat in the video, so the conditions stack up one at a
             time on the words that state them, and the consequence only lands once all
             three are on screen. */
          var conds = [0, 1, 2].map(function (i) {
            return document.getElementById("cn-cond-" + i);
          });
          var fix = document.getElementById("cn-fix");
          var fixLines = [0, 1].map(function (i) {
            return document.getElementById("cn-fix-" + i);
          });

          // the consequence cannot be shown before the conditions that cause it
          document.getElementById("cn-term").setAttribute("data-reveal-after", "#cn-cond-2");
          fix.setAttribute("data-reveal-after", "#cn-term");

          // "…somebody is actually active in one of those roles."
          tl.to(bodyText, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, W.b7_actually_active);

          // "…if every one of them is eligible-only…"
          tl.fromTo(
            "#cn-if",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            W.b7_if_every
          );

          // the three conditions, each on its own phrase
          [W.b7_cond1, W.b7_cond2, W.b7_cond3].forEach(function (at, i) {
            tl.fromTo(
              conds[i],
              { opacity: 0, x: -18 },
              { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
              at
            );
          });

          // "…nobody is left to approve…" — the stack pulses as one.
          tl.fromTo(
            conds,
            { scale: 1 },
            { scale: 1.04, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.07 },
            W.b7_nobody_left
          );

          // "…lockout." — the consequence.
          tl.fromTo(
            term,
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            W.b7_lockout
          );

          // "…lock your admins out of the tenant." — the card takes the hit.
          tl.fromTo(
            card,
            { x: 0 },
            { x: -10, duration: 0.09, ease: "power1.inOut", yoyo: true, repeat: 5 },
            W.b7_lock_admins_out
          );

          // "…an emergency access account…" — the way out opens.
          tl.fromTo(
            fix,
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            W.b7_emergency
          );

          // "…permanently active…" / "…explicit approvers…"
          tl.fromTo(
            fixLines[0],
            { opacity: 0, x: -16 },
            { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
            W.b7_permanent_active
          );
          tl.fromTo(
            fixLines[1],
            { opacity: 0, x: -16 },
            { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
            W.b7_explicit_approvers
          );

          window.__timelines["70-lockout-risk"] = tl;
        })();
      </script>
