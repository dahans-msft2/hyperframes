<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
    <!-- preview-only: the host (index.html) loads anchors.js for the mounted scene. -->
    <script src="../anchors.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: title-hero (opening title card — kicker + 2-line title + subtitle). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-rule {
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */


        /* primitives this block's pruned _foundation.css copy omitted, pulled in
           verbatim from templates/blocks/_foundation.css so the scene's added
           elements inherit the kit type scale and contrast rules. */
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-th-group {
          position: absolute;
          left: 184px;
          top: 50%;
          width: 1250px; /* left ~65% of a 1920 frame, generous right margin */
          transform: translateY(-50%);
        }
        #mk-th-title {
          font-size: var(--fs-h1); /* title-card headline — up to the h1 tier */
          margin-top: 2.4cqw;
        }
        #mk-th-line {
          display: block;
        }
        #mk-th-rule {
          width: 104px; /* graphic underline bar (accent = graphic, not text) */
          margin: 2.6cqw 0 0;
          transform-origin: left center;
        }
        #mk-th-subtitle {
          margin-top: 2.4cqw;
          font-size: var(--fs-lead);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        /* the payoff: three answer lines that cascade as the recap names them */
        #mk-th-lines {
          margin-top: 2.4cqw;
        }
        .mk-th-answer {
          display: flex;
          align-items: baseline;
          gap: 1.1cqw;
          opacity: 0;
        }
        .mk-th-answer + .mk-th-answer {
          margin-top: 1.4cqw;
        }
        .mk-th-answer-bar {
          flex: none;
          width: 0.55cqw;
          height: 1.5cqw;
          border-radius: var(--rule);
          background: var(--accent);
          transform: translateY(0.15cqw);
        }
        .mk-th-answer-text {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.2;
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        #mk-th-jit {
          display: flex;
          flex-wrap: wrap;
          gap: 0.8cqw;
          margin: 1.1cqw 0 0 1.65cqw;
        }
        .mk-th-jit-chip {
          opacity: 0;
        }
        .mk-th-jit-dot {
          flex: none;
          width: 0.7em;
          height: 0.7em;
          border-radius: var(--radius-pill);
          background: var(--accent-3);
        }
      </style>

      <div
        id="root"
        data-composition-id="90-recap"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <!-- host may override data-ground with "section-field" | "dark-field" -->
        <div id="mk-th-group">
          <div id="mk-th-kicker" class="ilt-kicker"></div>
          <div id="mk-th-title" class="ilt-title">
            <span id="mk-th-line1" class="mk-th-line"></span>
            <span id="mk-th-line2" class="mk-th-line"></span>
          </div>
          <div id="mk-th-rule" class="ilt-rule"></div>
          <div id="mk-th-lines">
            <div id="mk-th-answer-0" class="mk-th-answer">
              <span class="mk-th-answer-bar"></span>
              <span class="mk-th-answer-text">Always-on &rarr; eligible = just-in-time access</span>
            </div>
            <div id="mk-th-jit">
              <span id="mk-th-jit-0" class="ilt-chip mk-th-jit-chip"
                ><span class="mk-th-jit-dot"></span><span>Granted on activation</span></span
              >
              <span id="mk-th-jit-1" class="ilt-chip mk-th-jit-chip"
                ><span class="mk-th-jit-dot"></span><span>Gated by approval</span></span
              >
              <span id="mk-th-jit-2" class="ilt-chip mk-th-jit-chip"
                ><span class="mk-th-jit-dot"></span><span>Gone when the time-box expires</span></span
              >
            </div>
            <div id="mk-th-answer-1" class="mk-th-answer">
              <span class="mk-th-answer-bar"></span>
              <span class="mk-th-answer-text">Empty approver list &rarr; active PRA / GA approve</span>
            </div>
            <div id="mk-th-answer-2" class="mk-th-answer">
              <span class="mk-th-answer-bar"></span>
              <span class="mk-th-answer-text">Emergency access account prevents lockout</span>
            </div>
          </div>
          <div id="mk-th-subtitle"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- word-anchored cue clock -----------------------------------------------
             window.__anchors (anchors.js, generated by tools/word_anchors.py from
             transcript.json) carries REAL spoken-word times. This scene starts on its own
             first spoken word, so every cue below is `anchor - sceneStart` in W — never an
             offset guessed from an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = A.beat_90_recap;
          if (typeof T0 !== "number") throw new Error("90-recap: anchors.js not loaded");
          var W = {};
          Object.keys(A).forEach(function (k) {
            W[k] = Math.max(0, Math.round((A[k] - T0) * 1000) / 1000);
          });

          // Edit per use. Opening title card: eyebrow kicker + two-line title + one-line subtitle.
          var CONFIG = {
            "kicker": "RECAP",
            "titleLine1": "Always-on becomes",
            "titleLine2": "just-in-time",
            "subtitle": "Nobody carries Global Administrator by default — that is the governance model this module builds toward."
          };

          var kicker = document.getElementById("mk-th-kicker");
          var line1 = document.getElementById("mk-th-line1");
          var line2 = document.getElementById("mk-th-line2");
          var rule = document.getElementById("mk-th-rule");
          var subtitle = document.getElementById("mk-th-subtitle");

          kicker.textContent = CONFIG.kicker;
          line1.textContent = CONFIG.titleLine1;
          line2.textContent = CONFIG.titleLine2;
          subtitle.textContent = CONFIG.subtitle;

          var tl = gsap.timeline({ paused: true });

          // Waterfall entrance — scene-relative, seek-safe. Calm cadence for the opener.
          // 1) kicker fades + rises first.
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            kicker,
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
            0.25
          );

          // 2) the two title lines arrive on a short stagger.
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            [line1, line2],
            { opacity: 0, y: 44 },
            { opacity: 1, y: 0, duration: 0.85, ease: "power3.out", stagger: 0.14 },
            0.75
          );

          // 3) the accent rule wipes in left→right (a graphic).
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            rule,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.7, ease: "power2.out" },
            1.55
          );

          // ---- anchored cues: the payoff waterfall, each answer on its spoken phrase ----
          var answers = [0, 1, 2].map(function (i) {
            return document.getElementById("mk-th-answer-" + i);
          });
          var jitChips = [0, 1, 2].map(function (i) {
            return document.getElementById("mk-th-jit-" + i);
          });

          // "Convert your always-on admins to eligible…" — the headline reasserts the thesis.
          tl.fromTo(
            [line1, line2],
            { scale: 1, transformOrigin: "0% 50%" },
            { scale: 1.03, duration: 0.45, ease: "power2.out", yoyo: true, repeat: 1 },
            W.recap_convert
          );

          // "…access becomes just in time." — answer 1.
          tl.fromTo(answers[0], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, W.recap_jit);

          // "Granted on activation, gated by approval, gone when the time-box expires."
          tl.fromTo(jitChips[0], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.recap_activation);
          tl.fromTo(jitChips[1], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.recap_gated);
          tl.fromTo(jitChips[2], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.recap_gone);

          // "The empty approver puzzle isn't magic…" — answer 2.
          tl.fromTo(answers[1], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, W.recap_puzzle);

          // "…you plan around with an emergency access account." — answer 3.
          tl.fromTo(answers[2], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, W.recap_emergency);

          // "That's the governance model this module builds toward." — the closing line.
          tl.fromTo(
            subtitle,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
            W.recap_governance
          );

          window.__timelines["90-recap"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
