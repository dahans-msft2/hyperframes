<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
    <!-- preview-only: the host (index.html) loads anchors.js for the mounted scene. -->
    <script src="../anchors.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: title-hero (opening title card — kicker + 2-line title + subtitle). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-rule {
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */


        /* primitives this block's pruned _foundation.css copy omitted, pulled in
           verbatim from templates/blocks/_foundation.css so the scene's added
           elements inherit the kit type scale and contrast rules. */
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-th-group {
          position: absolute;
          left: 184px;
          top: 50%;
          width: 1250px; /* left ~65% of a 1920 frame, generous right margin */
          transform: translateY(-50%);
        }
        #mk-th-title {
          font-size: var(--fs-h1); /* title-card headline — up to the h1 tier */
          margin-top: 2.4cqw;
        }
        #mk-th-line {
          display: block;
        }
        #mk-th-rule {
          width: 104px; /* graphic underline bar (accent = graphic, not text) */
          margin: 2.6cqw 0 0;
          transform-origin: left center;
        }
        #mk-th-subtitle {
          margin-top: 2.4cqw;
          font-size: var(--fs-lead);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        /* hook rail: the three moves of the opening question, left-aligned so display mass
           stays upper-left and clears the swoosh's bottom-right colour field (zone rule). */
        #mk-th-rail {
          display: flex;
          flex-wrap: wrap;
          gap: 0.9cqw;
          margin-top: 2.2cqw;
        }
        .mk-th-chip {
          opacity: 0;
        }
        .mk-th-chip-dot {
          width: 0.7em;
          height: 0.7em;
          border-radius: var(--radius-pill);
          background: var(--accent);
          flex: none;
        }
        #mk-th-pim {
          display: flex;
          align-items: center;
          gap: 1cqw;
          margin-top: 2.2cqw;
          opacity: 0;
        }
        #mk-th-pim-bar {
          width: 0.9cqw;
          height: 2.2cqw;
          border-radius: var(--rule);
          background: var(--accent-2);
          flex: none;
          transform-origin: center bottom;
        }
        #mk-th-pim-text {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
      </style>

      <div
        id="root"
        data-composition-id="02-title"
        data-ground="hero-swoosh"
        data-width="1920"
        data-height="1080"
      >
        <!-- host may override data-ground with "section-field" | "dark-field" -->
        <div id="mk-th-group">
          <div id="mk-th-kicker" class="ilt-kicker"></div>
          <div id="mk-th-title" class="ilt-title">
            <span id="mk-th-line1" class="mk-th-line"></span>
            <span id="mk-th-line2" class="mk-th-line"></span>
          </div>
          <div id="mk-th-rule" class="ilt-rule"></div>
          <div id="mk-th-subtitle"></div>
          <div id="mk-th-rail">
            <div id="mk-th-chip-0" class="ilt-chip mk-th-chip">
              <span class="mk-th-chip-dot"></span><span>Standing access, used or not</span>
            </div>
            <div id="mk-th-chip-1" class="ilt-chip mk-th-chip">
              <span class="mk-th-chip-dot"></span><span>Dormant until it's needed</span>
            </div>
            <div id="mk-th-chip-2" class="ilt-chip mk-th-chip">
              <span class="mk-th-chip-dot"></span><span>Expires on its own</span>
            </div>
          </div>
          <div id="mk-th-pim">
            <div id="mk-th-pim-bar"></div>
            <div id="mk-th-pim-text">Microsoft Entra Privileged Identity Management</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- word-anchored cue clock -----------------------------------------------
             window.__anchors (anchors.js, generated by tools/word_anchors.py from
             transcript.json) carries REAL spoken-word times. This scene starts on its own
             first spoken word, so every cue below is `anchor - sceneStart` in W — never an
             offset guessed from an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = A.beat_02_title;
          if (typeof T0 !== "number") throw new Error("02-title: anchors.js not loaded");
          var W = {};
          Object.keys(A).forEach(function (k) {
            W[k] = Math.max(0, Math.round((A[k] - T0) * 1000) / 1000);
          });

          // Edit per use. Opening title card: eyebrow kicker + two-line title + one-line subtitle.
          var CONFIG = {
            "kicker": "Identity governance",
            "titleLine1": "Govern roles with",
            "titleLine2": "role groups and PIM",
            "subtitle": "Turn always-on admin access into just-in-time."
          };

          var kicker = document.getElementById("mk-th-kicker");
          var line1 = document.getElementById("mk-th-line1");
          var line2 = document.getElementById("mk-th-line2");
          var rule = document.getElementById("mk-th-rule");
          var subtitle = document.getElementById("mk-th-subtitle");

          kicker.textContent = CONFIG.kicker;
          line1.textContent = CONFIG.titleLine1;
          line2.textContent = CONFIG.titleLine2;
          subtitle.textContent = CONFIG.subtitle;

          var tl = gsap.timeline({ paused: true });

          // Waterfall entrance — scene-relative, seek-safe. Calm cadence for the opener.
          // 1) kicker fades + rises first.
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            kicker,
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
            0.25
          );

          // 2) the two title lines arrive on a short stagger.
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            [line1, line2],
            { opacity: 0, y: 44 },
            { opacity: 1, y: 0, duration: 0.85, ease: "power3.out", stagger: 0.14 },
            0.75
          );

          // 3) the accent rule wipes in left→right (a graphic).
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            rule,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.7, ease: "power2.out" },
            1.55
          );

          // 4) the subtitle fades up last, then we hold on stillness.
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            subtitle,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
            1.95
          );

          // ---- anchored cues: the hook's three moves, each landing on its spoken phrase ----
          var chips = [0, 1, 2].map(function (i) {
            return document.getElementById("mk-th-chip-" + i);
          });
          var pim = document.getElementById("mk-th-pim");
          var pimBar = document.getElementById("mk-th-pim-bar");

          // "…switched on permanently…" — the accent rule extends: the problem widens.
          tl.fromTo(rule, { scaleX: 1 }, { scaleX: 1.9, duration: 0.7, ease: "power2.out" }, W.hook_permanent);

          // "…every one is a standing target…" — the title lifts (design plan cue) and the
          // first hook chip arrives.
          tl.fromTo(
            [line1, line2],
            { scale: 1, transformOrigin: "0% 50%" },
            { scale: 1.03, duration: 0.45, ease: "power2.out", yoyo: true, repeat: 1 },
            W.hook_standing_target
          );
          tl.fromTo(chips[0], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, W.hook_standing_target);

          // "…if nobody carried that access…" — the subtitle answers the question.
          tl.fromTo(subtitle, { opacity: 1 }, { opacity: 0.55, duration: 0.35, ease: "power1.inOut", yoyo: true, repeat: 1 }, W.hook_nobody_carried);

          // "…hand someone the role, let it sit dormant…" / "…then expire on its own."
          tl.fromTo(chips[1], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, W.hook_hand_role);
          tl.fromTo(chips[2], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, W.hook_expire_own);

          // "…Microsoft Entra Privileged Identity Management…" — the lockup settles in.
          tl.fromTo(pim, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, W.hook_pim_named);
          tl.fromTo(pimBar, { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, W.hook_pim_named);

          window.__timelines["02-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
