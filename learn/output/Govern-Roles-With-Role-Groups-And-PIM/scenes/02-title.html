<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: title-hero (opening title card — kicker + 2-line title + subtitle). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-rule {
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-th-group {
          position: absolute;
          left: 184px;
          top: 50%;
          width: 1250px; /* left ~65% of a 1920 frame, generous right margin */
          transform: translateY(-50%);
        }
        #mk-th-title {
          font-size: var(--fs-h1); /* title-card headline — up to the h1 tier */
          margin-top: 2.4cqw;
        }
        #mk-th-line {
          display: block;
        }
        #mk-th-rule {
          width: 104px; /* graphic underline bar (accent = graphic, not text) */
          margin: 2.6cqw 0 0;
          transform-origin: left center;
        }
        #mk-th-subtitle {
          margin-top: 2.4cqw;
          font-size: var(--fs-lead);
          line-height: 1.3;
          color: var(--ink-soft);
        }
      </style>

      <div
        id="root"
        data-composition-id="02-title"
        data-ground="hero-swoosh"
        data-width="1920"
        data-height="1080"
      >
        <!-- host may override data-ground with "section-field" | "dark-field" -->
        <div id="mk-th-group">
          <div id="mk-th-kicker" class="ilt-kicker"></div>
          <div id="mk-th-title" class="ilt-title">
            <span id="mk-th-line1" class="mk-th-line"></span>
            <span id="mk-th-line2" class="mk-th-line"></span>
          </div>
          <div id="mk-th-rule" class="ilt-rule"></div>
          <div id="mk-th-subtitle"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Edit per use. Opening title card: eyebrow kicker + two-line title + one-line subtitle.
          var CONFIG = {
            "kicker": "Identity governance",
            "titleLine1": "Govern roles with",
            "titleLine2": "role groups and PIM",
            "subtitle": "Turn always-on admin access into just-in-time."
          };

          var kicker = document.getElementById("mk-th-kicker");
          var line1 = document.getElementById("mk-th-line1");
          var line2 = document.getElementById("mk-th-line2");
          var rule = document.getElementById("mk-th-rule");
          var subtitle = document.getElementById("mk-th-subtitle");
          var title = document.getElementById("mk-th-title");

          kicker.textContent = CONFIG.kicker;
          line1.textContent = CONFIG.titleLine1;
          line2.textContent = CONFIG.titleLine2;
          subtitle.textContent = CONFIG.subtitle;

          var tl = gsap.timeline({ paused: true });

          /* ---- word-anchored cue clock ------------------------------------------------
             Every position below is a REAL spoken-word time from transcript.json via
             anchors.js (tools/word_anchors.py), converted to scene-relative time by
             subtracting this scene's start. Never an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = 3.0; // scene start in composition time (scenes.json)
          function cue(name, fallback, shift) {
            var t = typeof A[name] === "number" ? A[name] : fallback;
            return Math.max(0, t - T0 + (shift || 0));
          }
          var W = {
            kicker: cue("open_title", 3.03, -0.05),   // "Here's a problem hiding"
            lines: cue("open_title", 3.03, 0.45),
            rule: cue("open_title", 3.03, 1.25),
            subtitle: cue("open_title", 3.03, 1.65),
            hook: cue("hook_standing_target", 13.14, -0.12), // "standing target"
            hookOut: cue("hook_standing_target", 13.14, 0.5),
            pim: cue("hook_pim_named", 28.58, -0.15),        // "Privileged Identity Management"
            pimRule: cue("hook_pim_named", 28.58, 0.1),
          };

          // Waterfall entrance — scene-relative, seek-safe. Calm cadence for the opener.
          // 1) kicker fades + rises first, as the first words land.
          tl.fromTo(
            kicker,
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
            W.kicker
          );

          // 2) the two title lines arrive on a short stagger.
          tl.fromTo(
            [line1, line2],
            { opacity: 0, y: 44 },
            { opacity: 1, y: 0, duration: 0.85, ease: "power3.out", stagger: 0.14 },
            W.lines
          );

          // 3) the accent rule wipes in left→right (a graphic).
          tl.fromTo(
            rule,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.7, ease: "power2.out" },
            W.rule
          );

          // 4) the subtitle fades up last, then we hold on stillness.
          tl.fromTo(
            subtitle,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
            W.subtitle
          );

          // 5) CUE — the title lifts on "standing target" (the curiosity-gap hook) and settles back.
          tl.to(title, { y: -14, duration: 0.5, ease: "power2.out" }, W.hook);
          tl.to(title, { y: 0, duration: 0.9, ease: "power2.inOut" }, W.hookOut);

          // 6) CUE — the lockup settles as PIM is finally named: rule extends, subtitle firms up.
          tl.to(rule, { scaleX: 1.75, duration: 0.8, ease: "power2.out" }, W.pim);
          tl.to(subtitle, { color: "#091f2e", duration: 0.7, ease: "power1.out" }, W.pimRule);

          window.__timelines["02-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
