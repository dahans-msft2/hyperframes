<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: list-select (peer items, ONE lifted + a count callout). ===
           The choose-one / compare-and-pick beat: a small set of peers cascades in, then the
           selected row rises with an accent tab while the rest recede, and a count reads up.
           Built on the kit foundation: tokens only, no hardcoded colours/fonts/px type.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitives used by this block ---- */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-ls-wrap {
          position: absolute;
        }
        #mk-ls-head {
          display: flex;
          align-items: baseline;
          gap: 0.7em;
          margin-bottom: 3cqw;
          opacity: 0;
        }
        /* count numeral: a Segoe Semibold figure. tabular so the count-up doesn't jitter. */
        #mk-ls-count {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1;
          letter-spacing: -0.02em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        #mk-ls-count-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-lead);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        .mk-ls-row {
          position: relative;
          display: flex;
          align-items: center;
          gap: 1.4cqw;
          padding: 1.5cqw 2cqw;
          border-radius: var(--radius);
          border: 1.5px solid var(--border-soft);
          background: var(--paper-veil);
          opacity: 0;
        }
        .mk-ls-row + .mk-ls-row {
          margin-top: 1.1cqw;
        }
        /* the accent tab that marks the selected row — a graphic (never text colour) */
        .mk-ls-tab {
          position: absolute;
          left: 0;
          top: 12%;
          bottom: 12%;
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
          transform: scaleY(0);
          transform-origin: center;
        }
        .mk-ls-marker {
          flex: none;
          width: 1.5cqw;
          height: 1.5cqw;
          border-radius: var(--radius-pill);
          border: 2px solid var(--border);
          background: transparent;
        }
        .mk-ls-row.is-selected .mk-ls-marker {
          border-color: var(--accent);
          background: var(--accent);
        }
        .mk-ls-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.14;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .mk-ls-detail {
          margin-top: 0.3cqw;
        }
      </style>

      <div id="root" data-composition-id="07-assignment-types" data-ground="content-wash" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="mk-ls-wrap">
          <div id="mk-ls-head">
            <span id="mk-ls-count">0</span>
            <span id="mk-ls-count-label"></span>
          </div>
          <div id="mk-ls-rows"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* Edit per use. Peer items with ONE selected. The rows cascade in, the count reads
             up to the total, then the selected row lifts with an accent tab as the rest recede
             — the "choose one from these" / compare-and-pick beat. */
          var CONFIG = {
            items: [
              { label: "Active", detail: "The permissions apply the moment the role is assigned \u2014 always on." },
              { label: "Eligible", detail: "Nothing applies until the admin activates the role in PIM." },
            ],
            selectedIndex: 1, // Eligible lifts \u2014 the state PIM adds
            countLabel: "assignment types in PIM",
            x: 300,
            width: 1320,
            stagger: 0.16,
          };

          var wrap = document.getElementById("mk-ls-wrap");
          var rowsHost = document.getElementById("mk-ls-rows");
          var countEl = document.getElementById("mk-ls-count");
          var countLabelEl = document.getElementById("mk-ls-count-label");
          var items = CONFIG.items;

          countLabelEl.textContent = CONFIG.countLabel;

          items.forEach(function (it, i) {
            var row = document.createElement("div");
            row.id = "mk-ls-row-" + i;
            row.className = "mk-ls-row" + (i === CONFIG.selectedIndex ? " is-selected" : "");

            var tab = document.createElement("div");
            tab.className = "mk-ls-tab";
            tab.id = "mk-ls-tab-" + i;
            row.appendChild(tab);

            var marker = document.createElement("div");
            marker.className = "mk-ls-marker";
            row.appendChild(marker);

            var text = document.createElement("div");
            var label = document.createElement("div");
            label.className = "mk-ls-label";
            label.textContent = it.label;
            text.appendChild(label);
            if (it.detail) {
              var detail = document.createElement("div");
              detail.className = "ilt-caption mk-ls-detail";
              detail.textContent = it.detail;
              text.appendChild(detail);
            }
            row.appendChild(text);
            rowsHost.appendChild(row);
          });

          wrap.style.left = CONFIG.x + "px";
          wrap.style.width = CONFIG.width + "px";
          rowsHost.querySelectorAll(".mk-ls-row").forEach(function (r) {
            r.style.width = CONFIG.width + "px";
          });

          /* center the whole block vertically after layout settles */
          requestAnimationFrame(function () {
            var h = wrap.getBoundingClientRect().height;
            wrap.style.top = Math.round((1080 - h) / 2) + "px";
          });

          var n = items.length;
          var tl = gsap.timeline({ paused: true });

          /* ---- word-anchored cue clock ------------------------------------------------
             Every position below is a REAL spoken-word time from transcript.json via
             anchors.js (tools/word_anchors.py), converted to scene-relative time by
             subtracting this scene's start. Never an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = 98.07; // scene start in composition time (scenes.json)
          function cue(name, fallback, shift) {
            var t = typeof A[name] === "number" ? A[name] : fallback;
            return Math.max(0, t - T0 + (shift || 0));
          }
          var W = {
            head: cue("open_b4", 98.42, -0.15),              // "PIM introduces two assignment types"
            count: cue("b4_two_types", 100.97, -0.85),        // "2" lands ON "two assignment types"
            row0: cue("b4_active_row", 103.39, -0.3),         // "Active means…"
            row1: cue("b4_eligible_row", 108.29, -0.3),       // "Eligible means…"
            immediate: cue("b4_immediately", 106.07, -0.1),   // "…apply immediately"
            lift: cue("b4_eligible", 109.66, -0.15),          // "…nothing applies"
            activate: cue("b4_activate_first", 112.16, -0.1), // "activate the role first"
            move: cue("b4_move", 113.77, -0.1),               // "moving admins from active to eligible"
          };

          /* head + count-up: the figure reads to 2 exactly as "two assignment types" is spoken. */
          gsap.set("#mk-ls-head", { opacity: 0, y: 20 });
          tl.to("#mk-ls-head", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.head);
          var counter = { v: 0 };
          tl.to(
            counter,
            {
              v: n,
              duration: 0.8,
              ease: "power1.out",
              onUpdate: function () {
                countEl.textContent = Math.round(counter.v);
              },
            },
            W.count
          );

          var rowEls = [document.getElementById("mk-ls-row-0"), document.getElementById("mk-ls-row-1")];
          gsap.set(rowEls, { opacity: 0, x: -30 });
          tl.to(rowEls[0], { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.row0);
          tl.to(rowEls[1], { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.row1);

          /* CUE \u2014 "apply immediately": the Active row pulses, the always-on state. */
          tl.to(rowEls[0], { x: 18, duration: 0.45, ease: "power2.out" }, W.immediate);

          /* CUE \u2014 "nothing applies": Eligible lifts with its accent tab, Active recedes. */
          tl.to(rowEls[0], { opacity: 0.4, x: 0, duration: 0.5, ease: "power2.out" }, W.lift);
          tl.to(rowEls[1], { scale: 1.04, boxShadow: "0 14px 40px rgba(9,31,46,.16)", duration: 0.55, ease: "power3.out" }, W.lift);
          tl.to(document.getElementById("mk-ls-tab-1"), { scaleY: 1, duration: 0.45, ease: "power2.out" }, W.lift);

          /* CUE \u2014 "activate the role first": the Eligible row settles forward. */
          tl.to(rowEls[1], { x: 22, duration: 0.5, ease: "power3.out" }, W.activate);

          /* CUE \u2014 "moving admins from active to eligible": the direction of travel, drawn. */
          tl.to(rowEls[0], { y: 14, duration: 0.7, ease: "power2.inOut" }, W.move);
          tl.to(rowEls[1], { y: -14, duration: 0.7, ease: "power2.inOut" }, W.move);

          window.__timelines["07-assignment-types"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
