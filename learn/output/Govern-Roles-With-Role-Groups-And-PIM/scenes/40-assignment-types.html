<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
    <!-- preview-only: the host (index.html) loads anchors.js for the mounted scene. -->
    <script src="../anchors.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: list-select (peer items, ONE lifted + a count callout). ===
           The choose-one / compare-and-pick beat: a small set of peers cascades in, then the
           selected row rises with an accent tab while the rest recede, and a count reads up.
           Built on the kit foundation: tokens only, no hardcoded colours/fonts/px type.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitives used by this block ---- */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-ls-wrap {
          position: absolute;
        }
        #mk-ls-head {
          display: flex;
          align-items: baseline;
          gap: 0.7em;
          margin-bottom: 3cqw;
          opacity: 0;
        }
        /* count numeral: a Segoe Semibold figure. tabular so the count-up doesn't jitter. */
        #mk-ls-count {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1;
          letter-spacing: -0.02em;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        #mk-ls-count-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-lead);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        #mk-ls-kicker {
          margin-bottom: 1.2cqw;
          opacity: 0;
        }
        /* the closing note lands on "nobody carries the role when they aren't using it" */
        #mk-ls-note {
          display: flex;
          align-items: center;
          gap: 0.8cqw;
          margin-top: 2.4cqw;
          opacity: 0;
        }
        #mk-ls-note-bar {
          flex: none;
          width: 2.4cqw;
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent-3);
          transform-origin: left center;
        }
        .mk-ls-row {
          position: relative;
          display: flex;
          align-items: center;
          gap: 1.4cqw;
          padding: 1.5cqw 2cqw;
          border-radius: var(--radius);
          border: 1.5px solid var(--border-soft);
          background: var(--paper-veil);
          opacity: 0;
        }
        .mk-ls-row + .mk-ls-row {
          margin-top: 1.1cqw;
        }
        /* the accent tab that marks the selected row — a graphic (never text colour) */
        .mk-ls-tab {
          position: absolute;
          left: 0;
          top: 12%;
          bottom: 12%;
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
          transform: scaleY(0);
          transform-origin: center;
        }
        .mk-ls-marker {
          flex: none;
          width: 1.5cqw;
          height: 1.5cqw;
          border-radius: var(--radius-pill);
          border: 2px solid var(--border);
          background: transparent;
        }
        .mk-ls-row.is-selected .mk-ls-marker {
          border-color: var(--accent);
          background: var(--accent);
        }
        .mk-ls-label {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.14;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .mk-ls-detail {
          margin-top: 0.3cqw;
        }
      </style>

      <div id="root" data-composition-id="40-assignment-types" data-ground="content-wash" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="mk-ls-wrap">
          <div id="mk-ls-kicker" class="ilt-kicker"></div>
          <div id="mk-ls-head">
            <span id="mk-ls-count">0</span>
            <span id="mk-ls-count-label"></span>
          </div>
          <div id="mk-ls-rows"></div>
          <div id="mk-ls-note">
            <span id="mk-ls-note-bar"></span>
            <span class="ilt-caption"
              >Nobody carries the role when they aren&rsquo;t using it.</span
            >
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- word-anchored cue clock -----------------------------------------------
             window.__anchors (anchors.js, generated by tools/word_anchors.py from
             transcript.json) carries REAL spoken-word times. This scene starts on its own
             first spoken word, so every cue below is `anchor - sceneStart` in W — never an
             offset guessed from an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = A.beat_b4;
          if (typeof T0 !== "number") throw new Error("40-assignment-types: anchors.js not loaded");
          var W = {};
          Object.keys(A).forEach(function (k) {
            W[k] = Math.max(0, Math.round((A[k] - T0) * 1000) / 1000);
          });

          /* Edit per use. Peer items with ONE selected. The rows cascade in, the count reads
             up to the total, then the selected row lifts with an accent tab as the rest recede
             — the "choose one from these" / compare-and-pick beat. */
          var CONFIG = {
            kicker: "Privileged Identity Management",
            items: [
              { label: "Active", detail: "The role is on. The permissions apply immediately." },
              { label: "Eligible", detail: "Assigned, but off \u2014 the user activates it first." },
            ],
            selectedIndex: 1, // which row lifts (0-based); -1 for none
            countLabel: "assignment types", // trails the count-up figure
            x: 240, // wrap left edge (px)
            width: 1180, // wrap width (px)
            stagger: 0.16, // s between row entrances
          };

          var wrap = document.getElementById("mk-ls-wrap");
          var rowsHost = document.getElementById("mk-ls-rows");
          var countEl = document.getElementById("mk-ls-count");
          var countLabelEl = document.getElementById("mk-ls-count-label");
          var items = CONFIG.items;

          countLabelEl.textContent = CONFIG.countLabel;

          items.forEach(function (it, i) {
            var row = document.createElement("div");
            row.id = "mk-ls-row-" + i;
            row.className = "mk-ls-row" + (i === CONFIG.selectedIndex ? " is-selected" : "");

            var tab = document.createElement("div");
            tab.className = "mk-ls-tab";
            tab.id = "mk-ls-tab-" + i;
            row.appendChild(tab);

            var marker = document.createElement("div");
            marker.className = "mk-ls-marker";
            row.appendChild(marker);

            var text = document.createElement("div");
            var label = document.createElement("div");
            label.className = "mk-ls-label";
            label.textContent = it.label;
            text.appendChild(label);
            if (it.detail) {
              var detail = document.createElement("div");
              detail.className = "ilt-caption mk-ls-detail";
              detail.textContent = it.detail;
              text.appendChild(detail);
            }
            row.appendChild(text);
            rowsHost.appendChild(row);
          });

          wrap.style.left = CONFIG.x + "px";
          wrap.style.width = CONFIG.width + "px";
          rowsHost.querySelectorAll(".mk-ls-row").forEach(function (r) {
            r.style.width = CONFIG.width + "px";
          });

          /* center the whole block vertically after layout settles */
          requestAnimationFrame(function () {
            var h = wrap.getBoundingClientRect().height;
            wrap.style.top = Math.round((1080 - h) / 2) + "px";
          });

          var n = items.length;
          var tl = gsap.timeline({ paused: true });

          document.getElementById("mk-ls-kicker").textContent = CONFIG.kicker;

          /* head + count-up, held to the phrase that says the number */
          gsap.set("#mk-ls-kicker", { opacity: 0, y: 16 });
          tl.to("#mk-ls-kicker", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.2);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
          gsap.set("#mk-ls-head", { opacity: 0, y: 20 });
          tl.to("#mk-ls-head", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.35);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
          var counter = { v: 0 };
          tl.to(
            counter,
            {
              v: n,
              duration: 0.8,
              ease: "power1.out",
              onUpdate: function () {
                countEl.textContent = Math.round(counter.v);
              },
            },
            W.b4_two_types
          );

          /* rows don't cascade here: each definition arrives on the word that names it,
             so the two types are never on screen ahead of the narration. */
          var rowCue = [W.b4_active, W.b4_eligible];
          items.forEach(function (it, i) {
            var row = document.getElementById("mk-ls-row-" + i);
            gsap.set(row, { opacity: 0, x: -30 });
            tl.to(row, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, rowCue[i]);
          });

          /* "…the permissions apply immediately." / "…they have to activate it first." */
          tl.fromTo(
            document.getElementById("mk-ls-row-0"),
            { scale: 1 },
            { scale: 1.03, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 },
            W.b4_immediately
          );
          tl.fromTo(
            document.getElementById("mk-ls-row-1"),
            { scale: 1 },
            { scale: 1.03, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 },
            W.b4_activate_first
          );

          /* the selected row lifts; peers recede; the accent tab draws.
             Fired on "…move people from active to eligible…" — the move is the point. */
          var sel = CONFIG.selectedIndex;
          if (sel >= 0 && sel < n) {
            var lift = W.b4_move;
            items.forEach(function (it, i) {
              if (i === sel) return;
              tl.to(document.getElementById("mk-ls-row-" + i), { opacity: 0.4, duration: 0.5, ease: "power2.out" }, lift);
            });
            tl.to(document.getElementById("mk-ls-row-" + sel), { scale: 1.04, boxShadow: "0 14px 40px rgba(9,31,46,.16)", duration: 0.55, ease: "power3.out" }, lift);
            tl.to(document.getElementById("mk-ls-tab-" + sel), { scaleY: 1, duration: 0.45, ease: "power2.out" }, lift + 0.05);
          }

          /* "…nobody carries the role when they aren't using it." */
          tl.fromTo(
            "#mk-ls-note",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            W.b4_nobody_carries
          );
          tl.fromTo(
            "#mk-ls-note-bar",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "power2.out" },
            W.b4_nobody_carries
          );

          window.__timelines["40-assignment-types"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
