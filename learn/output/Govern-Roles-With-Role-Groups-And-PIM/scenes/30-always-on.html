<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
    <!-- preview-only: the host (index.html) loads anchors.js for the mounted scene. -->
    <script src="../anchors.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT custom scene: 30-always-on (standing access, always on). ===
           Authored on the kit foundation — tokens only, no hardcoded type scale or colour
           outside the single --incident graphic mark declared below. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-body {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.3;
          color: var(--ink);
        }
        .ilt-panel {
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-tab {
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */


        /* primitives this block's pruned _foundation.css copy omitted, pulled in
           verbatim from templates/blocks/_foundation.css so the scene's added
           elements inherit the kit type scale and contrast rules. */
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }

        /* ---- scene-specific: compose primitives + tokens only ---- */
        /* --incident is not a kit token. This scene needs one alarm mark for the standing
           risk; it is used ONLY on graphics (ring, dot, switch) — never on text — so the
           contrast law still holds. */
        #root {
          --incident: #d13438;
        }
        #ao-stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 10cqw;
          gap: 2.6cqw;
        }
        #ao-kicker,
        #ao-head {
          opacity: 0;
        }
        #ao-tenant {
          position: relative;
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          background: var(--paper-veil);
          padding: 2.6cqw 2.8cqw;
          opacity: 0;
        }
        #ao-tenant-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 1.4cqw;
          margin-bottom: 2cqw;
        }
        #ao-switch {
          display: flex;
          align-items: center;
          gap: 0.7cqw;
        }
        #ao-switch-track {
          position: relative;
          width: 4.4cqw;
          height: 2cqw;
          border-radius: var(--radius-pill);
          background: var(--border-soft);
          overflow: hidden;
        }
        #ao-switch-fill {
          position: absolute;
          inset: 0;
          background: var(--incident);
          transform-origin: left center;
        }
        #ao-switch-knob {
          position: absolute;
          top: 0.25cqw;
          left: 0.25cqw;
          width: 1.5cqw;
          height: 1.5cqw;
          border-radius: var(--radius-pill);
          background: var(--paper);
          box-shadow: var(--shadow);
        }
        #ao-tokens {
          display: grid;
          grid-template-columns: repeat(8, 1fr);
          gap: 1.2cqw;
        }
        .ao-token {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.6cqw;
          opacity: 0;
        }
        .ao-face {
          position: relative;
          width: 100%;
          aspect-ratio: 1 / 1;
          border-radius: var(--radius-pill);
          border: 1.5px solid var(--border);
          background: var(--paper);
        }
        .ao-lit {
          position: absolute;
          inset: 0;
          border-radius: var(--radius-pill);
          background: var(--accent);
          opacity: 0;
        }
        .ao-ring {
          position: absolute;
          inset: -0.55cqw;
          border-radius: var(--radius-pill);
          border: 2px solid var(--incident);
          opacity: 0;
        }
        .ao-name {
          font-size: var(--fs-micro);
          line-height: 1.15;
          text-align: center;
          color: var(--ink-soft);
        }
        #ao-life {
          position: relative;
          margin-top: 2.2cqw;
          height: 0.55cqw;
          border-radius: var(--radius-pill);
          background: var(--border-soft);
          overflow: hidden;
        }
        #ao-life-fill {
          position: absolute;
          inset: 0;
          border-radius: var(--radius-pill);
          background: var(--accent);
          transform-origin: left center;
        }
        #ao-life-caption {
          display: flex;
          justify-content: space-between;
          margin-top: 0.8cqw;
          opacity: 0;
        }
        #ao-verdict {
          display: flex;
          align-items: center;
          gap: 1cqw;
          opacity: 0;
        }
        #ao-verdict-dot {
          flex: none;
          width: 1cqw;
          height: 1cqw;
          border-radius: var(--radius-pill);
          background: var(--incident);
        }
        #ao-because {
          margin-left: 2cqw;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="30-always-on"
        data-ground="content-wash"
        data-width="1920"
        data-height="1080"
      >
        <div id="ao-stage" data-keep-in-frame>
          <div>
            <div id="ao-kicker" class="ilt-kicker">Now the catch</div>
            <div id="ao-head" class="ilt-headline">A direct assignment is always on</div>
          </div>

          <div id="ao-tenant">
            <div id="ao-tenant-bar">
              <span class="ilt-caption">Contoso tenant &mdash; Global Administrator</span>
              <span id="ao-switch">
                <span id="ao-switch-track">
                  <span id="ao-switch-fill"></span>
                  <span id="ao-switch-knob"></span>
                </span>
                <span id="ao-switch-label" class="ilt-caption">Always on</span>
              </span>
            </div>

            <div id="ao-tokens"></div>

            <div id="ao-life"><span id="ao-life-fill"></span></div>
            <div id="ao-life-caption">
              <span class="ilt-caption">The moment it&rsquo;s created</span>
              <span class="ilt-caption">&hellip; until someone removes it</span>
            </div>
          </div>

          <div>
            <div id="ao-verdict">
              <span id="ao-verdict-dot"></span>
              <span class="ilt-title">Standing access to Global Administrator</span>
            </div>
            <div id="ao-because" class="ilt-caption">
              &hellip; just because it was simpler to set up.
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- word-anchored cue clock -----------------------------------------------
             window.__anchors (anchors.js, generated by tools/word_anchors.py from
             transcript.json) carries REAL spoken-word times. This scene starts on its own
             first spoken word, so every cue below is `anchor - sceneStart` in W — never an
             offset guessed from an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = A.beat_b3;
          if (typeof T0 !== "number") throw new Error("30-always-on: anchors.js not loaded");
          var W = {};
          Object.keys(A).forEach(function (k) {
            W[k] = Math.max(0, Math.round((A[k] - T0) * 1000) / 1000);
          });

          /* Custom scene: the kit had no block for "permissions switch on and stay on", so
             this one is authored on _foundation.css. Eight admin tokens sit inside a tenant
             frame; one lights the moment the assignment is made, a lifetime bar runs with no
             end, and by the time the narration says "standing access" the whole row is lit. */
          var CONFIG = {
            people: [
              "Priya",
              "Marcus",
              "Aiko",
              "Tomás",
              "Nadia",
              "Ben",
              "Chloé",
              "Ravi",
            ],
            firstLit: 0, // the admin whose assignment is created on screen
          };

          var tokensHost = document.getElementById("ao-tokens");
          CONFIG.people.forEach(function (name, i) {
            var tok = document.createElement("div");
            tok.className = "ao-token";
            tok.id = "ao-token-" + i;
            tok.innerHTML =
              '<span class="ao-face">' +
              '<span class="ao-lit" id="ao-lit-' +
              i +
              '"></span>' +
              '<span class="ao-ring" id="ao-ring-' +
              i +
              '"></span>' +
              "</span>";
            var label = document.createElement("span");
            label.className = "ao-name";
            label.textContent = name;
            tok.appendChild(label);
            tokensHost.appendChild(tok);
          });

          var tl = gsap.timeline({ paused: true });

          /* Seek-safe: every state is set from CSS + gsap.set, and every tween is fromTo,
             so scrubbing to any frame reproduces the same picture. */
          gsap.set("#ao-switch-fill", { scaleX: 0, transformOrigin: "left center" });
          gsap.set("#ao-switch-knob", { x: 0 });
          gsap.set("#ao-life-fill", { scaleX: 0 });

          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            "#ao-kicker",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            0.2
          );
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            "#ao-head",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            0.35
          );
          tl.fromTo(  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
            "#ao-tenant",
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            0.9
          );
          CONFIG.people.forEach(function (name, i) {
            tl.fromTo(
              "#ao-token-" + i,
              { opacity: 0, y: 14 },
              { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
              1.3 + i * 0.07
            );
          });

          /* ---- anchored cues --------------------------------------------------------- */

          // "…is always on…" — the switch throws.
          tl.to("#ao-switch-fill", { scaleX: 1, duration: 0.5, ease: "power2.out" }, W.b3_always_on);
          // knob travel expressed against its own width (1.5cqw knob, 2.4cqw of travel)
          // so it stays correct at any render resolution.
          tl.to(
            "#ao-switch-knob",
            { xPercent: 160, duration: 0.45, ease: "back.out(1.8)" },
            W.b3_always_on
          );

          // "…the moment it's created…" — one admin lights up.
          tl.fromTo(
            "#ao-lit-" + CONFIG.firstLit,
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" },
            W.b3_moment_created
          );

          // "…until someone removes it." — the lifetime bar runs, and never stops on its own.
          // Deliberately slow: this fill carries the long stretch of narration between the
          // two cues, so the frame is never sitting still while the point is being made.
          tl.fromTo(
            "#ao-life-caption",
            { opacity: 0 },
            { opacity: 1, duration: 0.45, ease: "power2.out" },
            W.b3_until_removed
          );
          tl.to(
            "#ao-life-fill",
            { scaleX: 1, duration: 4.6, ease: "none" },
            W.b3_until_removed
          );

          // "…too many people holding standing access…" — the whole row is lit, and ringed.
          CONFIG.people.forEach(function (name, i) {
            if (i === CONFIG.firstLit) return;
            tl.fromTo(
              "#ao-lit-" + i,
              { opacity: 0, scale: 0.6 },
              { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" },
              W.b3_standing_access + i * 0.06
            );
          });
          CONFIG.people.forEach(function (name, i) {
            tl.fromTo(
              "#ao-ring-" + i,
              { opacity: 0, scale: 0.86 },
              { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
              W.b3_standing_access + 0.5 + i * 0.06,
            );
          });
          tl.fromTo(
            "#ao-verdict",
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            W.b3_standing_access + 0.55
          );

          // "…just because it was simpler to set up."
          tl.fromTo(
            "#ao-because",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            W.b3_simpler
          );

          window.__timelines["30-always-on"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
