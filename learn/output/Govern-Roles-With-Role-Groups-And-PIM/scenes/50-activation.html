<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
    <!-- preview-only: the host (index.html) loads anchors.js for the mounted scene. -->
    <script src="../anchors.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: steps-list (numbered how-to process, staggered top→down). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitive used by this block ---- */
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft); /* detail — secondary ink */
        }


        /* primitives this block's pruned _foundation.css copy omitted, pulled in
           verbatim from templates/blocks/_foundation.css so the scene's added
           elements inherit the kit type scale and contrast rules. */
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-st-col {
          position: absolute;
        }
        /* the connector: a thin vertical line linking the badges (a graphic) */
        #mk-st-connector {
          position: absolute;
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--border-soft); /* soft border — ground-aware graphic */
          transform-origin: top center;
        }
        .mk-st-row {
          position: relative;
          display: flex;
          align-items: center;
          opacity: 0; /* revealed by the timeline */
        }
        .mk-st-badge {
          flex: none;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: var(--radius-pill);
          background: var(--accent); /* accent fill = graphic */
          box-shadow: var(--shadow);
        }
        .mk-st-num {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          letter-spacing: -0.01em;
          color: var(--accent-ink); /* numeral SITS ON the accent fill — allowed */
          font-variant-numeric: tabular-nums;
        }
        .mk-st-text {
          display: flex;
          flex-direction: column;
          gap: 0.35cqw;
        }
        /* the gate chips + the duration meter: graphics that arrive on their own phrase */
        .mk-st-extra {
          display: flex;
          align-items: center;
          gap: 0.7cqw;
          margin-top: 0.5cqw;
        }
        .mk-st-gate {
          opacity: 0;
        }
        .mk-st-gate-dot {
          flex: none;
          width: 0.7em;
          height: 0.7em;
          border-radius: var(--radius-pill);
          background: var(--accent-2);
        }
        .mk-st-meter {
          position: relative;
          width: 16cqw;
          height: 0.55cqw;
          border-radius: var(--radius-pill);
          background: var(--border-soft);
          overflow: hidden;
        }
        .mk-st-meter-fill {
          position: absolute;
          inset: 0;
          border-radius: var(--radius-pill);
          background: var(--accent-3);
          transform-origin: left center;
        }
        .mk-st-cap {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-caption);
          color: var(--ink);
          font-variant-numeric: tabular-nums;
          opacity: 0;
        }
        .mk-st-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink); /* step title — primary ink */
        }
      </style>

      <div id="root" data-composition-id="50-activation" data-ground="content-wash" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="mk-st-col">
          <div id="mk-st-connector"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- word-anchored cue clock -----------------------------------------------
             window.__anchors (anchors.js, generated by tools/word_anchors.py from
             transcript.json) carries REAL spoken-word times. This scene starts on its own
             first spoken word, so every cue below is `anchor - sceneStart` in W — never an
             offset guessed from an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = A.beat_b5;
          if (typeof T0 !== "number") throw new Error("50-activation: anchors.js not loaded");
          var W = {};
          Object.keys(A).forEach(function (k) {
            W[k] = Math.max(0, Math.round((A[k] - T0) * 1000) / 1000);
          });

          /* Edit per use. A numbered how-to: each step pops a badge as its row slides in,
             one at a time, top→down, with a connector line drawing down between the badges. */
          var CONFIG = {
            steps: [
              { title: "Eligible", detail: "The assignment exists \u2014 the role itself is off." },
              { title: "Activate", detail: "It can require approval, and whatever else the role setting demands." },
              { title: "Time-box", detail: "The role setting caps how long a single activation lasts." },
              { title: "Expire", detail: "Access drops back to eligible on its own. Nothing to clean up." },
            ],
            connector: true, // draw the vertical line linking the badges
            badge: 84, // px badge diameter
            gap: 34, // px between badge and text
            rowGap: 44, // px between rows
            textWidth: 760, // px wrap width for the text column
            x: 210, // column left edge
            stagger: 0.55, // s between step entrances (clear one-at-a-time cadence)
          };

          var col = document.getElementById("mk-st-col");
          var connector = document.getElementById("mk-st-connector");
          var steps = CONFIG.steps;

          /* build rows */
          steps.forEach(function (s, i) {
            var row = document.createElement("div");
            row.id = "mk-st-row-" + i;
            row.className = "mk-st-row";
            row.style.gap = CONFIG.gap + "px";
            if (i > 0) row.style.marginTop = CONFIG.rowGap + "px";

            var badge = document.createElement("div");
            badge.id = "mk-st-badge-" + i;
            badge.className = "mk-st-badge";
            badge.style.width = CONFIG.badge + "px";
            badge.style.height = CONFIG.badge + "px";
            var num = document.createElement("span");
            num.className = "mk-st-num";
            num.textContent = i + 1;
            badge.appendChild(num);
            row.appendChild(badge);

            var text = document.createElement("div");
            text.className = "mk-st-text";
            text.style.width = CONFIG.textWidth + "px";
            var title = document.createElement("div");
            title.className = "mk-st-title";
            title.textContent = s.title;
            text.appendChild(title);
            if (s.detail) {
              var detail = document.createElement("div");
              detail.className = "ilt-caption";
              detail.textContent = s.detail;
              text.appendChild(detail);
            }
            row.appendChild(text);

            col.appendChild(row);
          });

          /* extras: the gate chips on step 2 and the duration meter on step 3.
             Built here rather than in CONFIG so each one can carry its own cue. */
          var gateHost = document.createElement("div");
          gateHost.className = "mk-st-extra";
          ["Multifactor authentication", "Business justification"].forEach(function (label, i) {
            var chip = document.createElement("span");
            chip.id = "mk-st-gate-" + i;
            chip.className = "ilt-chip mk-st-gate";
            var dot = document.createElement("span");
            dot.className = "mk-st-gate-dot";
            var txt = document.createElement("span");
            txt.textContent = label;
            chip.appendChild(dot);
            chip.appendChild(txt);
            gateHost.appendChild(chip);
          });
          document.querySelector("#mk-st-row-1 .mk-st-text").appendChild(gateHost);

          var meterHost = document.createElement("div");
          meterHost.className = "mk-st-extra";
          meterHost.innerHTML =
            '<span class="mk-st-meter"><span id="mk-st-meter-fill" class="mk-st-meter-fill"></span></span>' +
            '<span id="mk-st-cap" class="mk-st-cap">up to 4 hours</span>';
          document.querySelector("#mk-st-row-2 .mk-st-text").appendChild(meterHost);

          /* declarative ordering for the motion spec: expiry cannot precede activation */
          document.getElementById("mk-st-row-3").setAttribute("data-reveal-after", "#mk-st-row-1 #mk-st-row-2");

          /* center the stack vertically; occupy the left ~60% via CONFIG.x + textWidth */
          var n = steps.length;
          var colH = n * CONFIG.badge + (n - 1) * CONFIG.rowGap;
          col.style.left = CONFIG.x + "px";
          col.style.top = Math.round((1080 - colH) / 2) + "px";

          /* connector runs from the first badge center to the last badge center */
          if (CONFIG.connector && n > 1) {
            connector.style.left = Math.round(CONFIG.badge / 2 - 1.5) + "px";
            connector.style.top = Math.round(CONFIG.badge / 2) + "px";
            connector.style.height = colH - CONFIG.badge + "px";
          } else {
            connector.style.display = "none";
          }

          var tl = gsap.timeline({ paused: true });

          /* Scene-relative, seek-safe: connector draws down across the whole reveal, each row
             slides/fades in while its badge pops. No exit / hide — the host owns lifetime. */
          /* Each step lands on the phrase that names it, so the stack builds at the pace of
             the narration instead of a fixed stagger. */
          var stepCue = [0.4, W.b5_activate, W.b5_timeboxed, W.b5_expire];
          var lastStart = stepCue[n - 1];

          if (CONFIG.connector && n > 1) {
            gsap.set(connector, { scaleY: 0 });
            tl.to(connector, { scaleY: 1, duration: lastStart - 0.4, ease: "none" }, 0.4);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
          }

          steps.forEach(function (s, i) {
            var row = document.getElementById("mk-st-row-" + i);
            var badge = document.getElementById("mk-st-badge-" + i);
            var t0 = stepCue[i];

            gsap.set(row, { opacity: 0, x: -40 });
            tl.to(row, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, t0);

            gsap.set(badge, { scale: 0.35 });
            tl.to(badge, { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, t0 + 0.05);
          });

          /* ---- anchored cues --------------------------------------------------------- */

          // "…nothing takes effect until they activate it."
          tl.fromTo(
            document.getElementById("mk-st-badge-0"),
            { scale: 1 },
            { scale: 1.14, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 },
            W.b5_takes_effect
          );

          // "…multi-factor authentication…" / "…a justification…"
          tl.fromTo(
            "#mk-st-gate-0",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            W.b5_mfa
          );
          tl.fromTo(
            "#mk-st-gate-1",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            W.b5_justification
          );

          // "…a maximum duration…" — the meter fills to the cap.
          gsap.set("#mk-st-meter-fill", { scaleX: 0 });
          tl.to(
            "#mk-st-meter-fill",
            { scaleX: 1, duration: 1.1, ease: "power2.out" },
            W.b5_max_duration
          );

          // "…four hours…" — the figure that caps it.
          tl.fromTo(
            "#mk-st-cap",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            W.b5_four_hours
          );

          // "…it expires." — the meter drains as the last step arrives.
          tl.to(
            "#mk-st-meter-fill",
            { scaleX: 0, duration: 0.9, ease: "power2.inOut" },
            W.b5_expire
          );

          // "…just in time." — the badge of the last step confirms the loop closed.
          tl.fromTo(
            document.getElementById("mk-st-badge-3"),
            { scale: 1 },
            { scale: 1.14, duration: 0.45, ease: "power2.out", yoyo: true, repeat: 1 },
            W.b5_jit
          );

          window.__timelines["50-activation"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
