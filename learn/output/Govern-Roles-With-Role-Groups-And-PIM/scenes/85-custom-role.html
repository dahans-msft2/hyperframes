    <template>
      <style>
        /* === Learn-ILT kit block: callout-note (key-point / note / definition card). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink.
           A panel + a left accent tab is the callout marker (mirrors lower-third-bar);
           the glyph + tab are the only accent-coloured graphics — all text stays ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-headline {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink);
        }
        .ilt-body {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.3;
          color: var(--ink);
        }
        .ilt-panel {
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        }
        .ilt-tab {
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */


        /* primitives this block's pruned _foundation.css copy omitted, pulled in
           verbatim from templates/blocks/_foundation.css so the scene's added
           elements inherit the kit type scale and contrast rules. */
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }
        .ilt-chip {
          display: inline-flex;
          align-items: center;
          gap: 0.6em;
          padding: 0.5em 1.1em;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-pill);
          font-size: var(--fs-micro);
          font-weight: 600;
          color: var(--ink);
          background: var(--paper-veil);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #root .cn-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .cn-card {
          display: flex;
          align-items: stretch;
          width: 46cqw; /* body wraps to 1–2 lines at the kit type scale */
          overflow: hidden; /* clips the tab wipe + rounds the tab's left corners */
          will-change: transform, opacity;
        }
        #root .cn-tab {
          width: 0.6cqw; /* wider than the --rule default for a callout marker */
          border-radius: 0;
          flex-shrink: 0;
        }
        #root .cn-body {
          padding: 2.4cqw 2.8cqw 2.6cqw 2.4cqw;
          display: flex;
          flex-direction: column;
          gap: 1cqw;
        }
        #root .cn-label-row {
          display: flex;
          align-items: center;
          gap: 0.9cqw;
        }
        #root .cn-glyph {
          width: 2.4cqw;
          height: 2.4cqw;
          flex-shrink: 0;
        }
        #root .cn-glyph path {
          stroke: var(--accent); /* accent = graphic, not text */
          fill: none;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #root .cn-card {
          width: 50cqw;
        }
        #root #cn-term {
          opacity: 0;
        }
        #root #cn-narrow {
          opacity: 0;
        }
        #root #cn-caps {
          display: flex;
          flex-wrap: wrap;
          gap: 0.8cqw;
        }
        #root .cn-cap {
          opacity: 0;
        }
        #root .cn-cap-dot {
          flex: none;
          width: 0.7em;
          height: 0.7em;
          border-radius: var(--radius-pill);
          background: var(--accent-2);
        }
        #root #cn-advice {
          display: flex;
          align-items: center;
          gap: 0.8cqw;
          opacity: 0;
        }
        #root #cn-advice-bar {
          flex: none;
          width: 2.2cqw;
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent-3);
          transform-origin: left center;
        }
      </style>

      <div id="root" data-composition-id="85-custom-role" data-ground="content-wash" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div class="cn-wrap">
          <div id="cn-card" class="cn-card ilt-panel">
            <div id="cn-tab" class="cn-tab ilt-tab"></div>
            <div class="cn-body">
              <div id="cn-label-row" class="cn-label-row">
                <svg class="cn-glyph" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 18h6" />
                  <path d="M10 22h4" />
                  <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1v.2h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z" />
                </svg>
                <div id="cn-label" class="ilt-kicker">Key point</div>
              </div>
              <div id="cn-body-text" class="ilt-body">
                Policies evaluate signals at sign-in and grant, block, or challenge access before the session begins.
              </div>
              <div id="cn-narrow" class="ilt-caption">
                &hellip; and no built-in role is narrower.
              </div>
              <div id="cn-term" class="ilt-headline">Custom role</div>
              <div id="cn-caps">
                <span id="cn-cap-0" class="ilt-chip cn-cap"
                  ><span class="cn-cap-dot"></span><span>Choose the exact permissions</span></span
                >
                <span id="cn-cap-1" class="ilt-chip cn-cap"
                  ><span class="cn-cap-dot"></span><span>Assign it at the scope you choose</span></span
                >
              </div>
              <div id="cn-advice">
                <span id="cn-advice-bar"></span>
                <span class="ilt-caption"
                  >Knowing when to reach for one is the real skill.</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- word-anchored cue clock -----------------------------------------------
             window.__anchors (anchors.js, generated by tools/word_anchors.py from
             transcript.json) carries REAL spoken-word times. This scene starts on its own
             first spoken word, so every cue below is `anchor - sceneStart` in W — never an
             offset guessed from an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = A.beat_b9;
          if (typeof T0 !== "number") throw new Error("85-custom-role: anchors.js not loaded");
          var W = {};
          Object.keys(A).forEach(function (k) {
            W[k] = Math.max(0, Math.round((A[k] - T0) * 1000) / 1000);
          });

          // Edit per use. A Learn-style callout: type label + bold term + a 1–2 line body.
          var CONFIG = {
            label: "Key point",
            term: "Custom role",
            body: "Sometimes a built-in role grants far more than the job actually needs.",
          };

          document.getElementById("cn-label").textContent = CONFIG.label;
          document.getElementById("cn-term").textContent = CONFIG.term;
          document.getElementById("cn-body-text").textContent = CONFIG.body;

          var card = document.getElementById("cn-card");
          var tab = document.getElementById("cn-tab");
          var labelRow = document.getElementById("cn-label-row");
          var term = document.getElementById("cn-term");
          var bodyText = document.getElementById("cn-body-text");

          var tl = gsap.timeline({ paused: true });

          // Scene-relative, seek-safe: card scales/fades in, the accent tab wipes
          // top→bottom, then label → term → body reveal in a short upward stagger.
          gsap.set(card, { opacity: 0, scale: 0.92, y: 24, transformOrigin: "50% 50%" });
          gsap.set(tab, { scaleY: 0, transformOrigin: "50% 0%" });
          gsap.set([labelRow, bodyText], { y: 22, opacity: 0 });

          tl.to(card, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
          tl.to(tab, { scaleY: 1, duration: 0.45, ease: "power2.out" }, 0.42);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself
          tl.to(labelRow, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.55);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself

          /* ---- anchored cues: the problem is stated before the answer is named -------- */

          // "…a built-in role is too broad…"
          tl.to(bodyText, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, W.b9_too_broad);

          // "…and nothing narrower exists."
          tl.fromTo(
            "#cn-narrow",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            W.b9_nothing_narrower
          );

          // "…a custom role…" — the vocabulary word lands.
          tl.fromTo(
            term,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            W.b9_custom_role
          );

          // "…the exact permissions…" / "…assign it at the scope you choose."
          tl.fromTo(
            "#cn-cap-0",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            W.b9_exact_permissions
          );
          tl.fromTo(
            "#cn-cap-1",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            W.b9_assign_scope
          );

          // "…the real skill." — the takeaway.
          tl.fromTo(
            "#cn-advice",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            W.b9_real_skill
          );
          tl.fromTo(
            "#cn-advice-bar",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "power2.out" },
            W.b9_real_skill
          );

          window.__timelines["85-custom-role"] = tl;
        })();
      </script>
    </template>
