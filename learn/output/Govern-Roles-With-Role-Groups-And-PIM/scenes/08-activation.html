<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: steps-list (numbered how-to process, staggered top→down). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitive used by this block ---- */
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft); /* detail — secondary ink */
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-st-col {
          position: absolute;
        }
        /* the connector: a thin vertical line linking the badges (a graphic) */
        #mk-st-connector {
          position: absolute;
          width: var(--rule);
          border-radius: var(--rule);
          background: var(--border-soft); /* soft border — ground-aware graphic */
          transform-origin: top center;
        }
        .mk-st-row {
          position: relative;
          display: flex;
          align-items: center;
          opacity: 0; /* revealed by the timeline */
        }
        .mk-st-badge {
          flex: none;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: var(--radius-pill);
          background: var(--accent); /* accent fill = graphic */
          box-shadow: var(--shadow);
        }
        .mk-st-num {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h3);
          letter-spacing: -0.01em;
          color: var(--accent-ink); /* numeral SITS ON the accent fill — allowed */
          font-variant-numeric: tabular-nums;
        }
        .mk-st-text {
          display: flex;
          flex-direction: column;
          gap: 0.35cqw;
        }
        .mk-st-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          line-height: 1.12;
          letter-spacing: -0.015em;
          color: var(--ink); /* step title — primary ink */
        }
      </style>

      <div id="root" data-composition-id="08-activation" data-ground="content-wash" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="mk-st-col">
          <div id="mk-st-connector"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* Edit per use. A numbered how-to: each step pops a badge as its row slides in,
             one at a time, top→down, with a connector line drawing down between the badges. */
          var CONFIG = {
            steps: [
              { title: "Eligible", detail: "The role is assigned, but no permissions apply yet." },
              { title: "Activate", detail: "Request in PIM \u2014 approval, MFA and a business justification if required." },
              { title: "Time-box", detail: "Active only up to the activation maximum duration \u2014 for example, 4 hours." },
              { title: "Expire", detail: "Access falls away automatically. No cleanup ticket needed." },
            ],
            connector: true,
            badge: 92,
            gap: 34,
            rowGap: 46,
            textWidth: 1240,
            x: 240,
            stagger: 0.55,
          };

          var col = document.getElementById("mk-st-col");
          var connector = document.getElementById("mk-st-connector");
          var steps = CONFIG.steps;

          /* build rows */
          steps.forEach(function (s, i) {
            var row = document.createElement("div");
            row.id = "mk-st-row-" + i;
            row.className = "mk-st-row";
            row.style.gap = CONFIG.gap + "px";
            if (i > 0) row.style.marginTop = CONFIG.rowGap + "px";

            var badge = document.createElement("div");
            badge.id = "mk-st-badge-" + i;
            badge.className = "mk-st-badge";
            badge.style.width = CONFIG.badge + "px";
            badge.style.height = CONFIG.badge + "px";
            var num = document.createElement("span");
            num.className = "mk-st-num";
            num.textContent = i + 1;
            badge.appendChild(num);
            row.appendChild(badge);

            var text = document.createElement("div");
            text.className = "mk-st-text";
            text.style.width = CONFIG.textWidth + "px";
            var title = document.createElement("div");
            title.className = "mk-st-title";
            title.textContent = s.title;
            text.appendChild(title);
            if (s.detail) {
              var detail = document.createElement("div");
              detail.className = "ilt-caption";
              detail.textContent = s.detail;
              text.appendChild(detail);
            }
            row.appendChild(text);

            col.appendChild(row);
          });

          /* center the stack vertically; occupy the left ~60% via CONFIG.x + textWidth */
          var n = steps.length;
          var colH = n * CONFIG.badge + (n - 1) * CONFIG.rowGap;
          col.style.left = CONFIG.x + "px";
          col.style.top = Math.round((1080 - colH) / 2) + "px";

          /* connector runs from the first badge center to the last badge center */
          if (CONFIG.connector && n > 1) {
            connector.style.left = Math.round(CONFIG.badge / 2 - 1.5) + "px";
            connector.style.top = Math.round(CONFIG.badge / 2) + "px";
            connector.style.height = colH - CONFIG.badge + "px";
          } else {
            connector.style.display = "none";
          }

          var tl = gsap.timeline({ paused: true });

          /* ---- word-anchored cue clock ------------------------------------------------
             Every position below is a REAL spoken-word time from transcript.json via
             anchors.js (tools/word_anchors.py), converted to scene-relative time by
             subtracting this scene's start. Never an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = 119.73; // scene start in composition time (scenes.json)
          function cue(name, fallback, shift) {
            var t = typeof A[name] === "number" ? A[name] : fallback;
            return Math.max(0, t - T0 + (shift || 0));
          }
          var W = {
            open: cue("open_b5", 120.08, -0.2),               // "Eligible on its own does nothing"
            row0: cue("b5_before_effect", 123.95, -0.35),      // "before it takes effect"
            row1: cue("b5_activate", 125.43, -0.35),           // "activate the role"
            mfa: cue("b5_mfa", 127.08, -0.1),                  // "multi-factor authentication"
            justify: cue("b5_justification", 129.19, -0.1),    // "a business justification"
            row2: cue("b5_timeboxed", 130.88, -0.35),          // "the activation is time-boxed"
            maxdur: cue("b5_max_duration", 133.87, -0.1),      // "activation maximum duration"
            fourHours: cue("b5_four_hours", 137.63, -0.1),     // "four hours"
            row3: cue("b5_expire", 139.81, -0.35),             // "access expires"
            jit: cue("b5_jit", 141.79, -0.1),                  // "just-in-time access"
          };

          /* Scene-relative, seek-safe: the connector draws down across the reveal while each step
             lands on the word that names it. Step 4 is withheld until "expires" is spoken \u2014
             the viewer predicts the outcome before the graphic confirms it. */
          var rowEls = [
            document.getElementById("mk-st-row-0"),
            document.getElementById("mk-st-row-1"),
            document.getElementById("mk-st-row-2"),
            document.getElementById("mk-st-row-3"),
          ];
          var badgeEls = [
            document.getElementById("mk-st-badge-0"),
            document.getElementById("mk-st-badge-1"),
            document.getElementById("mk-st-badge-2"),
            document.getElementById("mk-st-badge-3"),
          ];
          gsap.set(rowEls, { opacity: 0, x: -40 });
          gsap.set(badgeEls, { scale: 0.35 });

          if (CONFIG.connector && n > 1) {
            gsap.set(connector, { scaleY: 0 });
            tl.to(connector, { scaleY: 1, duration: Math.max(0.5, W.row3 - W.row0), ease: "none" }, W.row0);
          }

          tl.to(rowEls[0], { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.row0);
          tl.to(badgeEls[0], { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, W.row0);
          tl.to(rowEls[1], { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.row1);
          tl.to(badgeEls[1], { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, W.row1);
          tl.to(rowEls[2], { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.row2);
          tl.to(badgeEls[2], { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, W.row2);
          tl.to(rowEls[3], { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.row3);
          tl.to(badgeEls[3], { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, W.row3);

          /* CUE \u2014 the two activation gates, each on the word that names it. */
          tl.to(badgeEls[1], { scale: 1.12, duration: 0.3, ease: "power2.out" }, W.mfa);
          tl.to(badgeEls[1], { scale: 1, duration: 0.4, ease: "power2.inOut" }, W.mfa);
          tl.to(rowEls[1], { x: 18, duration: 0.5, ease: "power3.out" }, W.justify);

          /* CUE \u2014 "activation maximum duration" then "four hours": the time-box tightens. */
          tl.to(rowEls[2], { x: 18, duration: 0.5, ease: "power3.out" }, W.maxdur);
          tl.to(badgeEls[2], { scale: 1.12, duration: 0.3, ease: "power2.out" }, W.fourHours);
          tl.to(badgeEls[2], { scale: 1, duration: 0.4, ease: "power2.inOut" }, W.fourHours);

          /* CUE \u2014 "just-in-time access": the whole ladder settles on the payoff. */
          tl.to(col, { y: -12, duration: 0.9, ease: "power2.inOut" }, W.jit);

          window.__timelines["08-activation"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
