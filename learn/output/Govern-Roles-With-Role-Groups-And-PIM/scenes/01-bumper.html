<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: bumper (opening.bumper brand sting). ===
           The recurring open of every Learn companion video: the mark lands, the Microsoft squares
           pop, the "Microsoft Learn" wordmark builds, the rule wipes, the kicker settles. The mark is
           the Microsoft four-square logo by default; set CONFIG.logoSrc to a project-local product
           logo (e.g. the topic's product) to override it. Only the kicker sub-line and logo vary. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root, #root *, #root *::before, #root *::after { box-sizing: border-box; margin: 0; padding: 0; }
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size;
          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e; --ink-soft: #59636e; --paper: #ffffff; --paper-veil: rgba(255,255,255,0.9);
          --border: rgba(9,31,46,0.16); --border-soft: rgba(9,31,46,0.12); --shadow: 0 8px 28px rgba(9,31,46,0.1);
          --accent: #8661c5; --accent-2: #0078d4; --accent-3: #389a91; --accent-4: #bf3ac4; --accent-ink: #ffffff;
          --fs-display: 11cqw; --fs-h1: 4.6cqw; --fs-h2: 3.4cqw; --fs-h3: 2.4cqw; --fs-lead: 2cqw;
          --fs-body: 1.75cqw; --fs-caption: 1.5cqw; --fs-kicker: 1.55cqw; --fs-micro: 1.25cqw;
          --radius: 16px; --radius-sm: 10px; --radius-pill: 999px; --stroke: 5px; --rule: 3px;
          font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff; --ink-soft: rgba(255,255,255,0.72); --paper: rgba(255,255,255,0.08);
          --paper-veil: rgba(255,255,255,0.1); --border: rgba(255,255,255,0.24); --border-soft: rgba(255,255,255,0.14);
          --shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        .ilt-kicker { font-family: "Segoe UI Semibold","Segoe UI",sans-serif; font-weight: 600; font-size: var(--fs-kicker); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
        .ilt-rule { height: var(--rule); border-radius: var(--rule); background: var(--accent); }
        /* ==== END _foundation.css ==== */

        #bm-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2cqw; }
        #bm-mark { width: 9cqw; height: 9cqw; position: relative; }
        #bm-ms { width: 100%; height: 100%; display: block; }
        .bm-sq { transform-box: fill-box; transform-origin: 50% 50%; }
        #bm-logo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
        #bm-lockup { display: flex; flex-direction: column; align-items: center; gap: 1.1cqw; }
        #bm-word { font-family: "Segoe UI Semibold","Segoe UI",sans-serif; font-weight: 600; font-size: var(--fs-h1); letter-spacing: -0.01em; color: var(--ink); }
        #bm-word span { display: inline-block; }
        #bm-kick { font-size: var(--fs-kicker); }
        #bm-rule { width: 8cqw; transform-origin: center; }
      </style>

      <div id="root" data-composition-id="01-bumper" data-ground="hero-swoosh" data-width="1920" data-height="1080">
        <div id="bm-wrap">
          <div id="bm-mark" aria-hidden="true">
            <svg id="bm-ms" viewBox="0 0 100 100">
              <rect class="bm-sq" x="3"  y="3"  width="44" height="44" fill="#F25022" />
              <rect class="bm-sq" x="53" y="3"  width="44" height="44" fill="#7FBA00" />
              <rect class="bm-sq" x="3"  y="53" width="44" height="44" fill="#00A4EF" />
              <rect class="bm-sq" x="53" y="53" width="44" height="44" fill="#FFB900" />
            </svg>
            <img id="bm-logo" alt="" />
          </div>
          <div id="bm-lockup">
            <div id="bm-word"><span id="bm-w1">Microsoft</span>&nbsp;<span id="bm-w2">Learn</span></div>
            <div id="bm-rule" class="ilt-rule"></div>
            <div id="bm-kick" class="ilt-kicker"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Edit per use. The mark is the Microsoft four-square logo by default; set logoSrc to a
          // project-local product logo (e.g. "assets/media/scout.png") to override it. Only the
          // kicker sub-line and the logo vary; the "Microsoft Learn" wordmark is fixed.
          var CONFIG = {
            "kicker": "Provision and govern identities in Microsoft Entra"
          };

          var mark = document.getElementById("bm-mark");
          var ms = document.getElementById("bm-ms");
          var logo = document.getElementById("bm-logo");
          var squares = mark.querySelectorAll(".bm-sq");
          var w1 = document.getElementById("bm-w1");
          var w2 = document.getElementById("bm-w2");
          var rule = document.getElementById("bm-rule");
          var kick = document.getElementById("bm-kick");

          kick.textContent = CONFIG.kicker;

          var useLogo = !!CONFIG.logoSrc;
          if (useLogo) { logo.src = CONFIG.logoSrc; logo.style.display = "block"; ms.style.display = "none"; }

          var tl = gsap.timeline({ paused: true });
          // Brand sting: the mark lands, the Microsoft squares pop (or the product logo scales in),
          // the wordmark builds, the rule wipes.
          gsap.set([mark, w1, w2, rule, kick], { opacity: 0 });
          gsap.set(mark, { scale: 0.55, transformOrigin: "50% 50%" });
          gsap.set([w1, w2, kick], { y: 22 });
          gsap.set(rule, { scaleX: 0 });
          if (!useLogo) gsap.set(squares, { scale: 0 });

          tl.to(mark, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.15);  // anchor-exempt: silent brand bumper — narration hasn't started, there is no word to anchor to
          if (!useLogo) tl.to(squares, { scale: 1, duration: 0.42, ease: "back.out(2.2)", stagger: 0.07 }, 0.32);  // anchor-exempt: silent brand bumper — narration hasn't started, there is no word to anchor to
          tl.to(w1, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.7);  // anchor-exempt: silent brand bumper — narration hasn't started, there is no word to anchor to
          tl.to(w2, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.82);  // anchor-exempt: silent brand bumper — narration hasn't started, there is no word to anchor to
          tl.to(rule, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, 1.05);  // anchor-exempt: silent brand bumper — narration hasn't started, there is no word to anchor to
          tl.to(kick, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.2);  // anchor-exempt: silent brand bumper — narration hasn't started, there is no word to anchor to
          // a slow, intentional final push on the mark (camera settling) — performs, does not wobble.
          tl.to(mark, { scale: 1.04, duration: 1.4, ease: "power1.inOut" }, 1.5);  // anchor-exempt: silent brand bumper — narration hasn't started, there is no word to anchor to

          window.__timelines["01-bumper"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
