<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
    <!-- preview-only: the host (index.html) loads anchors.js for the mounted scene. -->
    <script src="../anchors.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: console-status (a status panel; one row flips pending→passed). ===
           The operational-evidence beat: portal-like check rows with status pills populate,
           then the blocking row flips from pending to passed — readiness checks, approval flows,
           troubleshooting, pass/fail outcomes.
           Built on the kit foundation: tokens only, no hardcoded colours/fonts/px type.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        /* ==== END _foundation.css ==== */

        /* ---- kit primitives used by this block ---- */
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }


        /* primitives this block's pruned _foundation.css copy omitted, pulled in
           verbatim from templates/blocks/_foundation.css so the scene's added
           elements inherit the kit type scale and contrast rules. */
        .ilt-caption {
          font-weight: 400;
          font-size: var(--fs-caption);
          line-height: 1.3;
          color: var(--ink-soft);
        }

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-cs-panel {
          position: absolute;
          background: var(--paper);
          border: 1.5px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          overflow: hidden;
          opacity: 0;
        }
        #mk-cs-title-bar {
          display: flex;
          align-items: center;
          gap: 0.8cqw;
          padding: 1.5cqw 2.2cqw;
          border-bottom: 1.5px solid var(--border-soft);
        }
        /* window dots — a chrome graphic; neutral so they never fight the status colours */
        .mk-cs-dot {
          width: 0.9cqw;
          height: 0.9cqw;
          border-radius: var(--radius-pill);
          background: var(--border);
        }
        #mk-cs-title {
          margin-left: 0.6cqw;
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-body);
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        .mk-cs-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 2cqw;
          padding: 1.6cqw 2.2cqw;
          opacity: 0;
        }
        .mk-cs-row + .mk-cs-row {
          border-top: 1.5px solid var(--border-soft);
        }
        .mk-cs-label {
          font-weight: 400;
          font-size: var(--fs-body);
          line-height: 1.2;
          color: var(--ink);
        }
        /* status pills — the fill/border is a GRAPHIC; pill text rides ON the fill via
           --accent-ink (sanctioned for chips/badges) or stays --ink-soft on the outline pill. */
        .mk-cs-pillwrap {
          position: relative;
          flex: none;
          display: inline-grid;
        }
        .mk-cs-pill {
          grid-area: 1 / 1;
          display: inline-flex;
          align-items: center;
          gap: 0.5em;
          padding: 0.5em 1.1em;
          border-radius: var(--radius-pill);
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-micro);
          white-space: nowrap;
        }
        .mk-cs-pill {
          grid-area: 1 / 1;
          display: inline-flex;
          align-items: center;
          gap: 0.55em;
          padding: 0.5em 1.1em;
          border-radius: var(--radius-pill);
          border: 1.5px solid var(--border);
          background: var(--paper-veil);
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-micro);
          white-space: nowrap;
          color: var(--ink); /* label is ALWAYS ink; the status colour lives on the dot (a graphic) */
        }
        /* status dot — a filled graphic, never text, so the accent colour never carries a glyph */
        .mk-cs-dot-status {
          flex: none;
          width: 0.8em;
          height: 0.8em;
          border-radius: var(--radius-pill);
          background: var(--border);
        }
        .mk-cs-pill--pass {
          border-color: var(--accent-3);
        }
        .mk-cs-pill--pass .mk-cs-dot-status {
          background: var(--accent-3);
        }
        .mk-cs-pill--fail {
          border-color: var(--accent-4);
        }
        .mk-cs-pill--fail .mk-cs-dot-status {
          background: var(--accent-4);
        }
        .mk-cs-pill--pending {
          color: var(--ink-soft);
        }
        .mk-cs-pill--pending .mk-cs-dot-status {
          background: transparent;
          border: 2px solid var(--border);
        }
        /* the scope caption sits under the panel and lands on its own spoken phrase */
        #mk-cs-note {
          position: absolute;
          display: flex;
          align-items: center;
          gap: 0.8cqw;
          opacity: 0;
        }
        #mk-cs-note-bar {
          flex: none;
          width: 2.2cqw;
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent-2);
          transform-origin: left center;
        }
      </style>

      <div id="root" data-composition-id="60-approver-fallback" data-ground="content-wash" data-width="1920" data-height="1080">
        <!-- host may set data-ground="section-field" | "hero-swoosh" | "dark-field" on #root -->
        <div id="mk-cs-panel">
          <div id="mk-cs-title-bar">
            <span class="mk-cs-dot"></span>
            <span class="mk-cs-dot"></span>
            <span class="mk-cs-dot"></span>
            <span id="mk-cs-title"></span>
          </div>
          <div id="mk-cs-rows"></div>
        </div>
        <div id="mk-cs-note">
          <span id="mk-cs-note-bar"></span>
          <span class="ilt-caption"
            >The fallback is tenant-wide &mdash; it isn&rsquo;t scoped to the role you configured.</span
          >
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          /* ---- word-anchored cue clock -----------------------------------------------
             window.__anchors (anchors.js, generated by tools/word_anchors.py from
             transcript.json) carries REAL spoken-word times. This scene starts on its own
             first spoken word, so every cue below is `anchor - sceneStart` in W — never an
             offset guessed from an assumed words-per-second. */
          var A = window.__anchors || {};
          var T0 = A.beat_b6;
          if (typeof T0 !== "number") throw new Error("60-approver-fallback: anchors.js not loaded");
          var W = {};
          Object.keys(A).forEach(function (k) {
            W[k] = Math.max(0, Math.round((A[k] - T0) * 1000) / 1000);
          });

          /* Edit per use. A portal-like readiness panel. Rows populate one at a time, then the
             blocking row flips pending→passed. status: "pass" | "fail" | "pending". flipIndex is
             the pending row that resolves to passed (set to -1 for a static panel). */
          var CONFIG = {
            title: "Role setting \u2014 Global Administrator",
            rows: [
              { label: "Require approval to activate", status: "pass", text: "On" },
              { label: "Approver list", status: "pending", text: "Empty" },
              { label: "So who approves the request?", status: "pending", text: "Unresolved", passText: "Fallback applies" },
              { label: "Privileged Role Administrator", status: "pass", text: "Can approve" },
              { label: "Global Administrator", status: "pass", text: "Can approve" },
            ],
            flipIndex: 2, // the pending row that flips to passed; -1 = none
            x: 400, // panel left edge (px)
            width: 1120, // panel width (px)
            stagger: 0.22, // s between row entrances
          };

          var STATUS = {
            pass: { cls: "mk-cs-pill--pass", text: "Passed" },
            fail: { cls: "mk-cs-pill--fail", text: "Failed" },
            pending: { cls: "mk-cs-pill--pending", text: "Pending" },
          };

          /* `text` overrides the default Passed/Failed/Pending wording so the pills can
             speak the portal's own language (On / Empty / Can approve). */
          function makePill(kind, override) {
            var s = STATUS[kind];
            var pill = document.createElement("span");
            pill.className = "mk-cs-pill " + s.cls;
            var dot = document.createElement("span");
            dot.className = "mk-cs-dot-status";
            var t = document.createElement("span");
            t.textContent = override || s.text;
            pill.appendChild(dot);
            pill.appendChild(t);
            return pill;
          }

          var panel = document.getElementById("mk-cs-panel");
          var rowsHost = document.getElementById("mk-cs-rows");
          document.getElementById("mk-cs-title").textContent = CONFIG.title;
          panel.style.left = CONFIG.x + "px";
          panel.style.width = CONFIG.width + "px";

          CONFIG.rows.forEach(function (r, i) {
            var row = document.createElement("div");
            row.className = "mk-cs-row";
            row.id = "mk-cs-row-" + i;

            var label = document.createElement("div");
            label.className = "mk-cs-label";
            label.textContent = r.label;
            row.appendChild(label);

            var wrap = document.createElement("div");
            wrap.className = "mk-cs-pillwrap";
            if (i === CONFIG.flipIndex) {
              wrap.setAttribute("data-layout-allow-overlap", ""); // stacked pills cross-fade on flip
              // stacked pills, cross-faded on flip (seek-safe: both states always in the DOM)
              var pending = makePill("pending", r.text);
              pending.id = "mk-cs-pending-" + i;
              var pass = makePill("pass", r.passText);
              pass.id = "mk-cs-pass-" + i;
              wrap.appendChild(pending);
              wrap.appendChild(pass);
            } else {
              wrap.appendChild(makePill(r.status, r.text));
            }
            row.appendChild(wrap);
            rowsHost.appendChild(row);
          });

          panel.style.width = CONFIG.width + "px";
          var note = document.getElementById("mk-cs-note");
          requestAnimationFrame(function () {
            var h = panel.getBoundingClientRect().height;
            var top = Math.round((1080 - h) / 2);
            panel.style.top = top + "px";
            note.style.left = CONFIG.x + "px";
            note.style.top = top + h + 34 + "px";
          });

          /* declarative ordering for the motion spec: the fallback approvers cannot be shown
             before the question they answer. */
          [3, 4].forEach(function (i) {
            document
              .getElementById("mk-cs-row-" + i)
              .setAttribute("data-reveal-after", "#mk-cs-row-2");
          });

          var n = CONFIG.rows.length;
          var tl = gsap.timeline({ paused: true });

          gsap.set(panel, { opacity: 0, y: 26 });
          tl.to(panel, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.1);  // anchor-exempt: scene entrance — this scene starts on its own first spoken word (beat_*), so the entrance is anchored by the boundary itself

          /* Rows are not staggered: each line of the setting appears on the phrase that
             states it, so the puzzle assembles at the pace the narration poses it. */
          var rowCue = [W.b6_sensitive_role, W.b6_empty_list, W.b6_who_signs, W.b6_pra, W.b6_ga];
          CONFIG.rows.forEach(function (r, i) {
            var row = document.getElementById("mk-cs-row-" + i);
            gsap.set(row, { opacity: 0, x: 24 });
            tl.to(row, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, rowCue[i]);
          });

          // "…does the request just stall?" — the unresolved pill wavers.
          tl.fromTo(
            document.getElementById("mk-cs-pending-2"),
            { opacity: 1 },
            { opacity: 0.45, duration: 0.4, ease: "power1.inOut", yoyo: true, repeat: 1 },
            W.b6_stall
          );

          // "…there's a fallback." — the flip that answers it.
          var fi = CONFIG.flipIndex;
          if (fi >= 0 && fi < n) {
            var pending = document.getElementById("mk-cs-pending-" + fi);
            var pass = document.getElementById("mk-cs-pass-" + fi);
            gsap.set(pass, { opacity: 0, scale: 0.7 });
            var flipAt = W.b6_fallback;
            tl.to(pending, { opacity: 0, duration: 0.3, ease: "power1.out" }, flipAt);
            tl.to(pass, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, flipAt + 0.05);
          }

          // "…tenant-wide…" — the caveat, right before the cut.
          tl.fromTo(
            note,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            W.b6_tenant_wide
          );
          tl.fromTo(
            "#mk-cs-note-bar",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.4, ease: "power2.out" },
            W.b6_tenant_wide
          );

          window.__timelines["60-approver-fallback"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
