<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Require MFA with a Conditional Access policy</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="anchors.js"></script>
    <style>
      @font-face {
        font-family: "Segoe UI";
        font-weight: 400;
        font-style: normal;
        src: url("fonts/segoeui-regular.woff2") format("woff2");
        font-display: block;
      }

      @font-face {
        font-family: "Segoe UI Semibold";
        font-weight: 600;
        font-style: normal;
        src: url("fonts/segoeui-semibold.woff2") format("woff2");
        font-display: block;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 1920px; height: 1080px;
        margin: 0; overflow: hidden;
        background: #fff8f3;
        font-family: "Segoe UI", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px; height: 1080px;
        overflow: hidden;
        /* Opaque stage ground: white-flash guard for any seam dip (seam-craft). */
        background: #fff8f3;
      }

      /* Scene slots fill the root and stack by mount order. */
      #root > div[data-composition-src] { position: absolute; inset: 0; }

      /* Fade bookends: opaque covers above everything; the timeline drives their opacity. */
      .fade-cover { position: absolute; inset: 0; background: #000; z-index: 100; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-start="0" data-duration="183.017"
         data-width="1920" data-height="1080" data-resolution="landscape">

      <audio id="narration" class="clip" src="narration.wav" data-start="3.0" data-duration="168.95" data-track-index="10"></audio>

      <div id="slot-01-bumper" class="clip"
           data-composition-id="01-bumper"
           data-composition-src="scenes/01-bumper.html"
           data-start="0.0" data-duration="3.0"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-02-title" class="clip"
           data-composition-id="02-title"
           data-composition-src="scenes/02-title.html"
           data-start="3.0" data-duration="14.51"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-03-objectives" class="clip"
           data-composition-id="03-objectives"
           data-composition-src="scenes/03-objectives.html"
           data-start="17.51" data-duration="13.96"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-04-concept" class="clip"
           data-composition-id="04-concept"
           data-composition-src="scenes/04-concept.html"
           data-start="31.47" data-duration="21.64"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-05-new-policy" class="clip"
           data-composition-id="05-new-policy"
           data-composition-src="scenes/05-new-policy.html"
           data-start="53.11" data-duration="22.44"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-06-select-app" class="clip"
           data-composition-id="06-select-app"
           data-composition-src="scenes/06-select-app.html"
           data-start="75.55" data-duration="23.6"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-07-require-mfa" class="clip"
           data-composition-id="07-require-mfa"
           data-composition-src="scenes/07-require-mfa.html"
           data-start="99.15" data-duration="20.52"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-08-enable-on" class="clip"
           data-composition-id="08-enable-on"
           data-composition-src="scenes/08-enable-on.html"
           data-start="119.67" data-duration="16.94"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-90-recap" class="clip"
           data-composition-id="90-recap"
           data-composition-src="scenes/90-recap.html"
           data-start="136.61" data-duration="19.3"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-91-cta" class="clip"
           data-composition-id="91-cta"
           data-composition-src="scenes/91-cta.html"
           data-start="155.91" data-duration="16.44"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <video id="ai-end-card" class="clip" src="assets/AI_End_Card.mp4" data-start="172.35" data-duration="10.667" data-track-index="11" muted></video>

      <div id="fade-in" class="fade-cover clip" data-start="0" data-duration="0.5" data-track-index="20"></div>

      <div id="fade-out" class="fade-cover clip" data-start="182.317" data-duration="0.7" data-track-index="20"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Thin root timeline: scene motion lives in each scene file. This timeline carries only
      // the cross-scene seams, stamped against the slot-<id> hosts.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["root"] = tl;

      // <seams:auto> — cross-scene cut-the-curve, stamped by assemble_scenes.py from scenes.json.
      // SEAM 02-title -> 03-objectives : cut-left (cut @17.51)
      tl.to("#slot-02-title", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 17.17);
      tl.set("#slot-02-title", { autoAlpha: 0 }, 17.51);
      tl.fromTo("#slot-03-objectives", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 17.51);
      // SEAM 03-objectives -> 04-concept : cut-left (cut @31.47)
      tl.to("#slot-03-objectives", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 31.13);
      tl.set("#slot-03-objectives", { autoAlpha: 0 }, 31.47);
      tl.fromTo("#slot-04-concept", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 31.47);
      // SEAM 04-concept -> 05-new-policy : cut-left (cut @53.11)
      tl.to("#slot-04-concept", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 52.77);
      tl.set("#slot-04-concept", { autoAlpha: 0 }, 53.11);
      tl.fromTo("#slot-05-new-policy", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 53.11);
      // SEAM 05-new-policy -> 06-select-app : cut-left (cut @75.55)
      tl.to("#slot-05-new-policy", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 75.21);
      tl.set("#slot-05-new-policy", { autoAlpha: 0 }, 75.55);
      tl.fromTo("#slot-06-select-app", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 75.55);
      // SEAM 06-select-app -> 07-require-mfa : cut-left (cut @99.15)
      tl.to("#slot-06-select-app", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 98.81);
      tl.set("#slot-06-select-app", { autoAlpha: 0 }, 99.15);
      tl.fromTo("#slot-07-require-mfa", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 99.15);
      // SEAM 07-require-mfa -> 08-enable-on : cut-left (cut @119.67)
      tl.to("#slot-07-require-mfa", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 119.33);
      tl.set("#slot-07-require-mfa", { autoAlpha: 0 }, 119.67);
      tl.fromTo("#slot-08-enable-on", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 119.67);
      // SEAM 08-enable-on -> 90-recap : cut-up (cut @136.61)
      tl.to("#slot-08-enable-on", { yPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 136.27);
      tl.set("#slot-08-enable-on", { autoAlpha: 0 }, 136.61);
      tl.fromTo("#slot-90-recap", { yPercent: 10, autoAlpha: 0.35 }, { yPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 136.61);
      // SEAM 90-recap -> 91-cta : cut-left (cut @155.91)
      tl.to("#slot-90-recap", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 155.57);
      tl.set("#slot-90-recap", { autoAlpha: 0 }, 155.91);
      tl.fromTo("#slot-91-cta", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 155.91);
      // </seams:auto>

      // <bookends> — fade-in breath + fade-to-black on the end card.
      gsap.set("#fade-in", { autoAlpha: 1 });
      tl.to("#fade-in", { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#fade-out", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.7, ease: "power2.in", immediateRender: false }, 182.317);
      // </bookends>
    </script>
  </body>
</html>
