        /* ---- block-specific: compose primitives + tokens only ---- */
        #c4-col {

      <div

        data-composition-id="04-what-it-is"

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Cue clock — real spoken-word times (anchors.js, generated from transcript.json),
          // made scene-relative against this beat's start in scenes.json.
          var A = window.__anchors || {};
          var B = { b04: 16.775 };
          var W = {
            autopilot: A.t4Autopilot - B.b04,   // "…Microsoft's first Autopilot"
            alwaysOn: A.t4AlwaysOn - B.b04,     // "…an agent that's always on"
            identity: A.t4Identity - B.b04,     // "…with its own identity"
            behalf: A.t4Behalf - B.b04,         // "…takes action on your behalf"
            grounded: A.t4Grounded - B.b04,     // "And it's grounded in…"
            m365: A.t4M365 - B.b04,             // "…your everyday Microsoft 365"
            teams: A.t4Teams - B.b04,
            outlook: A.t4Outlook - B.b04,
            calendar: A.t4Calendar - B.b04,
            files: A.t4Files - B.b04
          };

          var card = document.getElementById("c4-card");
          var tab = document.getElementById("c4-tab");
          var labelRow = document.getElementById("c4-label-row");
          var term = document.getElementById("c4-term");
          var note = document.getElementById("c4-note");
          var chip0 = document.getElementById("c4-chip-0");
          var chip1 = document.getElementById("c4-chip-1");
          var chip2 = document.getElementById("c4-chip-2");
          var groundKicker = document.getElementById("c4-ground-kicker");
          var m365 = document.getElementById("c4-m365");
          var link = document.getElementById("c4-link");
          var src0 = document.getElementById("c4-src-0");
          var src1 = document.getElementById("c4-src-1");
          var src2 = document.getElementById("c4-src-2");
          var src3 = document.getElementById("c4-src-3");

          var tl = gsap.timeline({ paused: true });

          // Every element is pinned before its cue, so state stays a pure function of time.
          gsap.set(card, { opacity: 0, scale: 0.94, y: 24, transformOrigin: "50% 50%" });
          gsap.set(tab, { scaleY: 0, transformOrigin: "50% 0%" });
          gsap.set([labelRow, term, note], { opacity: 0, y: 22 });
          gsap.set([chip0, chip1, chip2], { opacity: 0, y: 20, scale: 0.94 });
          gsap.set([groundKicker, src0, src1, src2, src3], { opacity: 0, y: 16 });
          gsap.set(m365, { opacity: 0, scale: 0.9 });
          gsap.set(link, { scaleX: 0 });

          // 1) the definition card arrives on the word "Autopilot" — tab wipes, then the
          //    label / term / body reveal in a short upward stagger.
          tl.to(card, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, W.autopilot);
          tl.to(tab, { scaleY: 1, duration: 0.45, delay: 0.22, ease: "power2.out" }, W.autopilot);
          tl.to(labelRow, { opacity: 1, y: 0, duration: 0.5, delay: 0.3, ease: "power3.out" }, W.autopilot);
          tl.to(term, { opacity: 1, y: 0, duration: 0.5, delay: 0.42, ease: "power3.out" }, W.autopilot);
          tl.to(note, { opacity: 1, y: 0, duration: 0.5, delay: 0.54, ease: "power3.out" }, W.autopilot);

          // 2) each attribute chip lands on the clause that states it.
          tl.to(chip0, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, W.alwaysOn);
          tl.to(chip1, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, W.identity);
          tl.to(chip2, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, W.behalf);

          // 3) the grounding row: the promise, then the surface it is grounded in, then the
          //    four connected sources — each named as it is spoken.
          tl.to(groundKicker, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, W.grounded);
          tl.to(m365, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, W.m365);
          tl.to(link, { scaleX: 1, duration: 0.4, delay: 0.3, ease: "power2.out" }, W.m365);
          tl.to(src0, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.teams);
          tl.to(src1, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.outlook);
          tl.to(src2, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.calendar);
          tl.to(src3, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.files);

          window.__timelines["04-what-it-is"] = tl;
        })();
      </script>
