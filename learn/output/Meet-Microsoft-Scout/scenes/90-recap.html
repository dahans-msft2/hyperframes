<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is preview-only; the runtime clones ONLY the <template> below. -->
    <script src="../assets/vendor/gsap.min.js"></script>
    <script src="../anchors.js"></script>
  </head>
  <body>
    <template>
      <style>
        /* === Learn-ILT kit block: title-hero (opening title card — kicker + 2-line title + subtitle). ===
           Built on the kit foundation: no hardcoded colours/fonts/px type — tokens only.
           Ground is host-selectable via #root[data-ground]; dark-field auto-inverts ink. */

        /* ==== BEGIN _foundation.css (verbatim; edit the source, not this copy) ==== */
        #root,
        #root *,
        #root *::before,
        #root *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;

          --ground: url("../assets/grounds/ground-content-wash.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #fffcfa 0%, #fff9f5 42%, #fffaef 68%, #f7f2f9 100%);
          --ink: #091f2e;
          --ink-soft: #59636e;
          --paper: #ffffff;
          --paper-veil: rgba(255, 255, 255, 0.9);
          --border: rgba(9, 31, 46, 0.16);
          --border-soft: rgba(9, 31, 46, 0.12);
          --shadow: 0 8px 28px rgba(9, 31, 46, 0.1);

          --accent: #8661c5;
          --accent-2: #0078d4;
          --accent-3: #389a91;
          --accent-4: #bf3ac4;
          --accent-ink: #ffffff;

          --fs-display: 11cqw;
          --fs-h1: 4.6cqw;
          --fs-h2: 3.4cqw;
          --fs-h3: 2.4cqw;
          --fs-lead: 2cqw;
          --fs-body: 1.75cqw;
          --fs-caption: 1.5cqw;
          --fs-kicker: 1.55cqw;
          --fs-micro: 1.25cqw;

          --radius: 16px;
          --radius-sm: 10px;
          --radius-pill: 999px;
          --stroke: 5px;
          --rule: 3px;

          font-family: "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--ground);
        }
        #root[data-ground="hero-swoosh"] {
          --ground: url("../assets/grounds/ground-hero-swoosh.png") center / cover no-repeat, radial-gradient(130% 100% at 82% 6%, #f4edf9 0%, #fbf6f2 40%, #fffaf4 70%, #fff9f5 100%);
        }
        #root[data-ground="section-field"] {
          --ground: url("../assets/grounds/ground-section-field.png") center / cover no-repeat, radial-gradient(120% 90% at 18% 8%, #f6f9fd 0%, #eef4fb 44%, #e9f1fa 70%, #eef3f7 100%);
        }
        #root[data-ground="dark-field"] {
          --ground: radial-gradient(90% 120% at 6% 4%, #365f7d 0%, #121f42 38%, #0a142d 66%, #050d1a 100%);
          --ink: #ffffff;
          --ink-soft: rgba(255, 255, 255, 0.72);
          --paper: rgba(255, 255, 255, 0.08);
          --paper-veil: rgba(255, 255, 255, 0.1);
          --border: rgba(255, 255, 255, 0.24);
          --border-soft: rgba(255, 255, 255, 0.14);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .ilt-kicker {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-kicker);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .ilt-title {
          font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
          font-weight: 600;
          font-size: var(--fs-h2);
          line-height: 1.08;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .ilt-rule {
          height: var(--rule);
          border-radius: var(--rule);
          background: var(--accent);
        }
        /* ==== END _foundation.css ==== */

        /* ---- block-specific: compose primitives + tokens only ---- */
        #mk-th-group {
          position: absolute;
          left: 184px;
          top: 50%;
          width: 1250px; /* left ~65% of a 1920 frame, generous right margin */
          transform: translateY(-50%);
        }
        #mk-th-title {
          font-size: var(--fs-h1); /* title-card headline — up to the h1 tier */
          margin-top: 2.4cqw;
        }
        #mk-th-line {
          display: block;
        }
        #mk-th-rule {
          width: 104px; /* graphic underline bar (accent = graphic, not text) */
          margin: 2.6cqw 0 0;
          transform-origin: left center;
        }
        #mk-th-subtitle {
          margin-top: 2.4cqw;
          font-size: var(--fs-lead);
          line-height: 1.3;
          color: var(--ink-soft);
        }
      </style>

      <div
        id="root"
        data-composition-id="90-recap"
        data-ground="hero-swoosh"
        data-width="1920"
        data-height="1080"
      >
        <!-- host may override data-ground with "section-field" | "dark-field" -->
        <div id="mk-th-group">
          <div id="mk-th-kicker" class="ilt-kicker"></div>
          <div id="mk-th-title" class="ilt-title">
            <span id="mk-th-line1" class="mk-th-line"></span>
            <span id="mk-th-line2" class="mk-th-line"></span>
          </div>
          <div id="mk-th-rule" class="ilt-rule"></div>
          <div id="mk-th-subtitle"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Edit per use. Opening title card: eyebrow kicker + two-line title + one-line subtitle.
          var CONFIG = {
            "kicker": "RECAP",
            "titleLine1": "The follow-through",
            "titleLine2": "happens for you",
            "subtitle": "An always-on agent that keeps work moving — under your control."
          };

          // Cue clock — real spoken-word times (anchors.js, generated from transcript.json),
          // made scene-relative against this beat's start in scenes.json.
          var A = window.__anchors || {};
          var B = { b90: 73.535 };
          var W = {
            kicker: A.t90Kicker - B.b90,   // "So the follow-through …"
            line1: A.t90Line1 - B.b90,
            line2: A.t90Line2 - B.b90,     // "… happens for you"
            rule: A.t90Rule - B.b90,
            subtitle: A.t90Sub - B.b90
          };

          var kicker = document.getElementById("mk-th-kicker");
          var line1 = document.getElementById("mk-th-line1");
          var line2 = document.getElementById("mk-th-line2");
          var rule = document.getElementById("mk-th-rule");
          var subtitle = document.getElementById("mk-th-subtitle");

          kicker.textContent = CONFIG.kicker;
          line1.textContent = CONFIG.titleLine1;
          line2.textContent = CONFIG.titleLine2;
          subtitle.textContent = CONFIG.subtitle;

          var tl = gsap.timeline({ paused: true });

          // Waterfall entrance — scene-relative, seek-safe. Every step lands on the
          // word that earns it, not on an assumed words-per-second.
          // 1) kicker fades + rises first.
          tl.fromTo(
            kicker,
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
            W.kicker
          );

          // 2) the two title lines arrive on the phrase each one carries.
          tl.fromTo(
            line1,
            { opacity: 0, y: 44 },
            { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" },
            W.line1
          );

          tl.fromTo(
            line2,
            { opacity: 0, y: 44 },
            { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" },
            W.line2
          );

          // 3) the accent rule wipes in left→right (a graphic).
          tl.fromTo(
            rule,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.7, ease: "power2.out" },
            W.rule
          );

          // 4) the subtitle fades up last, then we hold on stillness.
          tl.fromTo(
            subtitle,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
            W.subtitle
          );

          window.__timelines["90-recap"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
