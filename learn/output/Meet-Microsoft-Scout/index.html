<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Meet Microsoft Scout</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Segoe UI";
        font-weight: 400;
        font-style: normal;
        src: url("fonts/segoeui-regular.woff2") format("woff2");
        font-display: block;
      }

      @font-face {
        font-family: "Segoe UI Semibold";
        font-weight: 600;
        font-style: normal;
        src: url("fonts/segoeui-semibold.woff2") format("woff2");
        font-display: block;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 1920px; height: 1080px;
        margin: 0; overflow: hidden;
        background: #fff8f3;
        font-family: "Segoe UI", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px; height: 1080px;
        overflow: hidden;
        /* Opaque stage ground: white-flash guard for any seam dip (seam-craft). */
        background: #fff8f3;
      }

      /* Scene slots fill the root and stack by mount order. */
      #root > div[data-composition-src] { position: absolute; inset: 0; }

      /* Fade bookends: opaque covers above everything; the timeline drives their opacity. */
      .fade-cover { position: absolute; inset: 0; background: #000; z-index: 100; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-start="0" data-duration="81.667"
         data-width="1920" data-height="1080" data-resolution="landscape">

      <div id="slot-01-bumper" class="clip"
           data-composition-id="01-bumper"
           data-composition-src="scenes/01-bumper.html"
           data-start="0.0" data-duration="3.0"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-02-title" class="clip"
           data-composition-id="02-title"
           data-composition-src="scenes/02-title.html"
           data-start="3.0" data-duration="20.0"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-03-objectives" class="clip"
           data-composition-id="03-objectives"
           data-composition-src="scenes/03-objectives.html"
           data-start="23.0" data-duration="14.0"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-90-recap" class="clip"
           data-composition-id="90-recap"
           data-composition-src="scenes/90-recap.html"
           data-start="37.0" data-duration="20.0"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="slot-91-cta" class="clip"
           data-composition-id="91-cta"
           data-composition-src="scenes/91-cta.html"
           data-start="57.0" data-duration="14.0"
           data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <video id="ai-end-card" class="clip" src="assets/AI_End_Card.mp4" data-start="71.0" data-duration="10.667" data-track-index="11" muted></video>

      <div id="fade-in" class="fade-cover clip" data-start="0" data-duration="0.5" data-track-index="20"></div>

      <div id="fade-out" class="fade-cover clip" data-start="80.967" data-duration="0.7" data-track-index="20"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Thin root timeline: scene motion lives in each scene file. This timeline carries only
      // the cross-scene seams, stamped against the slot-<id> hosts.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["root"] = tl;

      // <seams:auto> — cross-scene cut-the-curve, stamped by assemble_scenes.py from scenes.json.
      // SEAM 02-title -> 03-objectives : cut-left (cut @23.0)
      tl.to("#slot-02-title", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 22.66);
      tl.set("#slot-02-title", { autoAlpha: 0 }, 23.0);
      tl.fromTo("#slot-03-objectives", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 23.0);
      // SEAM 03-objectives -> 90-recap : cut-up (cut @37.0)
      tl.to("#slot-03-objectives", { yPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 36.66);
      tl.set("#slot-03-objectives", { autoAlpha: 0 }, 37.0);
      tl.fromTo("#slot-90-recap", { yPercent: 10, autoAlpha: 0.35 }, { yPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 37.0);
      // SEAM 90-recap -> 91-cta : cut-left (cut @57.0)
      tl.to("#slot-90-recap", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 56.66);
      tl.set("#slot-90-recap", { autoAlpha: 0 }, 57.0);
      tl.fromTo("#slot-91-cta", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 57.0);
      // </seams:auto>

      // <bookends> — fade-in breath + fade-to-black on the end card.
      gsap.set("#fade-in", { autoAlpha: 1 });
      tl.to("#fade-in", { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#fade-out", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.7, ease: "power2.in", immediateRender: false }, 80.967);
      // </bookends>
    </script>
  </body>
</html>
