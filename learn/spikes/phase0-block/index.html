<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Learn ILT — data-chart block restyle</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff9f5; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff9f5; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0" data-width="1920" data-height="1080" data-duration="15">
      <!-- real upstream block, mounted as a sub-composition -->
      <div id="chart-host"
           data-composition-id="data-chart"
           data-composition-src="compositions/data-chart.html"
           data-start="0" data-duration="15" data-track-index="1"
           data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
